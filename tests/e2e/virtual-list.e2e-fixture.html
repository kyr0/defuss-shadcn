<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual List e2e fixture</title>
  <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css">
  <link rel="stylesheet" href="/dist/components/virtual-list/virtual-list.css">
  <style>
    /* spacing and container height only — never layout properties the checks assert */
    body { font-family: system-ui, sans-serif; padding: 2rem; }
    .virtual-list { height: 320px; max-width: 30rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <!-- ten million rows: the point of the component -->
  <div class="virtual-list" id="vl-huge" aria-label="Ten million rows"></div>

  <!-- a small list, where the sizer is the real content height -->
  <div class="virtual-list" id="vl-small" aria-label="Fifty rows"></div>

  <!-- row height comes from the custom property, not a size scale -->
  <div class="virtual-list" id="vl-sm" style="--virtual-list-row-height:28px;" aria-label="Compact rows"></div>
  <div class="virtual-list" id="vl-lg" style="--virtual-list-row-height:64px;" aria-label="Roomy rows"></div>

  <!-- grid: three items per row, tail row deliberately short (1_000_000 % 3 = 1) -->
  <div class="virtual-list" id="vl-grid" data-columns="3" style="--virtual-list-row-height:72px;" aria-label="Icon grid"></div>

  <!-- records behind a dataview source: bound filter + sort controls -->
  <input id="vl-q" data-virtual-list-filter="vl-people" data-field="name" aria-label="Filter people">
  <input id="vl-age" data-virtual-list-filter="vl-people" data-field="age" data-kind="number" aria-label="Filter by age">
  <select id="vl-sort" data-virtual-list-sort="vl-people" aria-label="Sort people">
    <option value="">Source order</option>
    <option value="name:asc">Name A–Z</option>
    <option value="age:desc">Oldest first</option>
  </select>
  <div class="virtual-list" id="vl-people" data-empty-text="Nobody matches" aria-label="People"></div>

  <!-- empty, via markup rather than a later setData call -->
  <div class="virtual-list" id="vl-empty" data-empty-text="No results found" aria-label="Empty list"></div>

  <script type="module" src="/dist/components/core.js"></script>
  <script type="module" src="/dist/components/virtual-list/virtual-list.js"></script>
  <script type="module">
    const api = globalThis.df$.shadcn.virtualList;
    const renderRow = (row, i) => {
      row.textContent = '';
      const label = document.createElement('span');
      label.textContent = 'Item ' + (i + 1);
      const meta = document.createElement('span');
      meta.className = 'virtual-list-row-meta';
      meta.textContent = '#' + (i + 1);
      row.append(label, meta);
    };
    // wait for init() to have claimed the elements
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    api.setData(document.getElementById('vl-huge'), 10_000_000, renderRow);
    api.setData(document.getElementById('vl-small'), 50, renderRow);
    api.setData(document.getElementById('vl-sm'), 1000, renderRow);
    api.setData(document.getElementById('vl-lg'), 1000, renderRow);
    api.setData(document.getElementById('vl-grid'), 1_000_000, (cell, i) => {
      cell.textContent = '';
      const glyph = document.createElement('span');
      glyph.textContent = String.fromCodePoint(0x1f4c1 + (i % 6));
      const label = document.createElement('span');
      label.textContent = 'Icon ' + (i + 1);
      cell.append(glyph, label);
    });
    // 200,000 records (deterministic); the renderer gets the record
    const first = ['Ada', 'Grace', 'Linus', 'Barbara', 'Ken', 'Margaret', 'Dennis', 'Frances'];
    const people = Array.from({ length: 200_000 }, (_, i) => ({ id: i + 1, name: `${first[i % 8]} ${i + 1}`, age: 18 + ((i * 7) % 70) }));
    api.setSource(document.getElementById('vl-people'), people, {
      render: (row, person) => {
        row.textContent = '';
        const label = document.createElement('span');
        label.textContent = person.name;
        const meta = document.createElement('span');
        meta.className = 'virtual-list-row-meta';
        meta.textContent = String(person.age);
        row.append(label, meta);
      },
    });
    globalThis.__fixtureReady = true;
  </script>
</body>
</html>
