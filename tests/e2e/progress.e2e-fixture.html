<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>progress e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/progress/progress.css" />
  </head>
  <body style="padding:2rem;">
    <!-- mirrors the doc page: native <progress> with value + indeterminate -->
    <progress class="progress" id="pg-half" value="50" max="100"></progress>
    <progress class="progress" id="pg-empty" value="0" max="100" style="margin-top:1rem;"></progress>
    <progress class="progress" id="pg-indet" style="margin-top:1rem;"></progress>
      <progress class="progress" id="z-progress-xs" value="60" max="100" data-size="xs"></progress>
    <progress class="progress" id="z-progress-sm" value="60" max="100" data-size="sm"></progress>
    <progress class="progress" id="z-progress-md" value="60" max="100" data-size="md"></progress>
    <progress class="progress" id="z-progress-lg" value="60" max="100" data-size="lg"></progress>
    <progress class="progress" id="z-progress-xl" value="60" max="100" data-size="xl"></progress>
</body>
</html>
