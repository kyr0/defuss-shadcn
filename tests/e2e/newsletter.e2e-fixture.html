<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>newsletter e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/badge/badge.css" />
    <link rel="stylesheet" href="/dist/components/avatar/avatar.css" />
    <link rel="stylesheet" href="/dist/components/input/input.css" />
    <link rel="stylesheet" href="/dist/components/separator/separator.css" />
    <link rel="stylesheet" href="/dist/components/newsletter/newsletter.css" />
    <style>
      /* docs-utility stand-in (fixtures carry no doc-site CSS) */
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
      body { padding: 2rem; margin: 0; }
    </style>
  </head>
  <body>
    <!-- Default -->
<section class="mk-newsletter" style="width:100%">
  <div class="mk-newsletter-layout">
  <div class="mk-newsletter-copy">
    <h2 class="mk-newsletter-title">Stay in the loop</h2>
    <p class="mk-newsletter-desc">Get insights, product updates, and productivity tips straight to your inbox.</p>
  </div>
  <div class="mk-newsletter-form-col">
    <form class="mk-newsletter-form" action="#" method="post">
      <label class="sr-only" for="mk-nl-email">Email address</label>
      <input class="input" id="mk-nl-email" type="email" name="email" placeholder="email@example.com" required autocomplete="email" enterkeyhint="send" />
      <button class="btn" type="submit" aria-label="Subscribe to newsletter"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>Subscribe</button>
    </form>
    <span class="mk-newsletter-note" role="note">We respect your privacy.</span>
  </div>
  </div>
</section>
  </body>
</html>
