<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>diff e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/diff/diff.css" />
    <link rel="stylesheet" href="/dist/components/mockup-code/mockup-code.css" />
    <style>
      .a { display:block; width:100%; height:100%; background:rgb(255, 0, 0); }
      .b { display:block; width:100%; height:100%; background:rgb(0, 0, 255); }
    </style>
  </head>
  <body style="padding:2rem;display:grid;gap:1.5rem;width:640px;">
    <!-- mirrors the doc page: default (labels), text content, variants line /
         primary, vertical, follow-hover, start position + ratios, RTL -->
    <figure class="diff" id="d-default" data-ratio="16/9">
      <div class="diff-item-1"><span class="a"></span><span class="diff-label">A</span></div>
      <div class="diff-item-2"><span class="b"></span><span class="diff-label">B</span></div>
      <input class="diff-range" type="range" min="0" max="100" value="50" step="0.1" aria-label="Comparison divider">
    </figure>
    <figure class="diff" id="d-text">
      <div class="diff-item-1"><div style="padding:2rem;font-size:3rem;">DIFF</div></div>
      <div class="diff-item-2"><div style="padding:2rem;font-size:3rem;">DIFF</div></div>
      <input class="diff-range" type="range" min="0" max="100" value="50" step="0.1" aria-label="Comparison divider">
    </figure>
    <figure class="diff" id="d-line" data-ratio="4/3" data-variant="line">
      <div class="diff-item-1"><span class="a"></span></div>
      <div class="diff-item-2"><span class="b"></span></div>
      <input class="diff-range" type="range" min="0" max="100" value="50" step="0.1" aria-label="Comparison divider">
    </figure>
    <figure class="diff" id="d-primary" data-ratio="1/1" data-variant="primary" style="width:200px;">
      <div class="diff-item-1"><span class="a"></span></div>
      <div class="diff-item-2"><span class="b"></span></div>
      <input class="diff-range" type="range" min="0" max="100" value="50" step="0.1" aria-label="Comparison divider">
    </figure>
    <figure class="diff" id="d-vertical" data-ratio="3/4" data-orientation="vertical" style="width:240px;">
      <div class="diff-item-1"><span class="a"></span><span class="diff-label">Top</span></div>
      <div class="diff-item-2"><span class="b"></span><span class="diff-label">Bottom</span></div>
      <input class="diff-range" type="range" min="0" max="100" value="40" step="0.1" aria-label="Comparison divider">
    </figure>
    <figure class="diff" id="d-hover" data-ratio="16/9" data-follow="hover">
      <div class="diff-item-1"><span class="a"></span></div>
      <div class="diff-item-2"><span class="b"></span></div>
      <input class="diff-range" type="range" min="0" max="100" value="50" step="0.1" aria-label="Comparison divider">
    </figure>
    <figure class="diff" id="d-start" data-ratio="4/3" style="width:400px;">
      <div class="diff-item-1"><span class="a"></span></div>
      <div class="diff-item-2"><span class="b"></span></div>
      <input class="diff-range" type="range" min="0" max="100" value="25" step="0.1" aria-label="Comparison divider">
    </figure>
    <figure class="diff" id="d-rtl" data-ratio="16/9" dir="rtl">
      <div class="diff-item-1"><span class="a"></span></div>
      <div class="diff-item-2"><span class="b"></span></div>
      <input class="diff-range" type="range" min="0" max="100" value="25" step="0.1" aria-label="Comparison divider">
    </figure>
    <!-- composed with Code Mockups: a source tree before (removed lines) and after (added lines) -->
    <figure class="diff" id="d-code" aria-label="The source tree before and after the layout change: drag the divider to compare">
      <div class="diff-item-1">
        <div class="mockup-code" data-chrome="none" data-variant="muted">
          <pre><code>src/components/</code></pre>
          <pre data-diff="remove"><code>  button/</code></pre>
          <pre><code>    button.css</code></pre>
          <pre><code>    component-skill.md</code></pre>
          <pre data-diff="remove"><code>  data-grid/</code></pre>
          <pre><code>    component-skill.md</code></pre>
          <pre><code>    data-grid.css</code></pre>
          <pre><code>    data-grid.schema.json</code></pre>
          <pre><code>    data-grid.ts</code></pre>
          <pre data-diff="remove"><code>  dialog/</code></pre>
          <pre><code>    component-skill.md</code></pre>
          <pre><code>    dialog.css</code></pre>
          <pre><code>    dialog.schema.json</code></pre>
          <pre><code>    dialog.ts</code></pre>
          <pre><code>  ... 225 more component folders</code></pre>
        </div>
        <span class="diff-label">Before</span>
      </div>
      <div class="diff-item-2">
        <div class="mockup-code" data-chrome="none" data-variant="muted" style="justify-content:end;">
          <pre><code>src/components/</code></pre>
          <pre data-diff="add"><code>  actions/button/</code></pre>
          <pre><code>    button.css</code></pre>
          <pre><code>    component-skill.md</code></pre>
          <pre data-diff="add"><code>  big-data/data-grid/</code></pre>
          <pre><code>    component-skill.md</code></pre>
          <pre><code>    data-grid.css</code></pre>
          <pre><code>    data-grid.schema.json</code></pre>
          <pre><code>    data-grid.ts</code></pre>
          <pre data-diff="add"><code>  overlays/dialog/</code></pre>
          <pre><code>    component-skill.md</code></pre>
          <pre><code>    dialog.css</code></pre>
          <pre><code>    dialog.schema.json</code></pre>
          <pre><code>    dialog.ts</code></pre>
          <pre><code>  ... 225 more, in 19 sections</code></pre>
        </div>
        <span class="diff-label">After</span>
      </div>
      <input class="diff-range" type="range" min="0" max="100" value="50" step="0.1" aria-label="Comparison divider">
    </figure>
    <script type="module" src="/dist/components/core.js"></script>
    <script type="module" src="/dist/components/diff/diff.js"></script>
  </body>
</html>
