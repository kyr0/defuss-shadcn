<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autocomplete e2e fixture</title>
  <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css">
  <link rel="stylesheet" href="/dist/components/input/input.css">
  <link rel="stylesheet" href="/dist/components/label/label.css">
  <link rel="stylesheet" href="/dist/components/autocomplete/autocomplete.css">
  <style>
    /* spacing only - never properties the checks assert */
    body { font-family: system-ui, sans-serif; padding: 1.5rem; display: grid; gap: 1.5rem; max-width: 26rem; }
  </style>
</head>
<body>
  <!-- local records (a dataview source): sorted by population, a hidden form value -->
  <div class="autocomplete" id="ac-local" data-search-field="name" data-label-field="name" data-sort="population:desc" data-page-size="20" data-debounce="0">
    <label class="label" for="ac-local-input">City</label>
    <input class="input autocomplete-input" id="ac-local-input" type="text" placeholder="Search 10,000 cities…">
    <input type="hidden" name="city" class="autocomplete-value">
  </div>

  <!-- your own client: load(request, { signal }) - 80 ms latency, honours abort -->
  <div class="autocomplete" id="ac-load" data-label-field="name" data-debounce="150" data-page-size="25" data-empty-text="No city like that.">
    <label class="label" for="ac-load-input">City (custom client)</label>
    <input class="input autocomplete-input" id="ac-load-input" type="text">
  </div>

  <!-- the default network client: GET data-url?q=&page=&pageSize=&sort= -->
  <div class="autocomplete" id="ac-url" data-url="/api/cities" data-label-field="name" data-sort="name:asc" data-debounce="0" data-page-size="10">
    <label class="label" for="ac-url-input">City (network)</label>
    <input class="input autocomplete-input" id="ac-url-input" type="text">
  </div>

  <!-- a source that fails -->
  <div class="autocomplete" id="ac-error" data-debounce="0">
    <label class="label" for="ac-error-input">Broken source</label>
    <input class="input autocomplete-input" id="ac-error-input" type="text">
  </div>

  <script type="module" src="/dist/components/core.js"></script>
  <script type="module" src="/dist/components/autocomplete/autocomplete.js"></script>
  <script type="module">
    const ac = globalThis.df$.shadcn.autocomplete;
    const syllables = ['ber', 'lin', 'mar', 'sea', 'to', 'ky', 'os', 'lo', 'ri', 'va', 'po', 'na'];
    const countries = ['DE', 'PT', 'JP', 'CA', 'KE', 'PE'];
    // 10,000 deterministic cities: city i always reads the same
    const cities = Array.from({ length: 10_000 }, (_, i) => ({
      id: i + 1,
      name: syllables[i % 12][0].toUpperCase() + syllables[i % 12].slice(1) + syllables[(i * 7) % 12] + ' ' + (i + 1),
      country: countries[(i * 5) % 6],
      population: 1000 + ((i * 7919) % 2_000_000),
    }));
    globalThis.__cities = cities;
    const stats = (globalThis.__stats = { requests: 0, aborted: 0, answered: 0, requestsSeen: [] });

    ac.configure(document.getElementById('ac-local'), {
      rows: cities,
      render: (option, city, { query }) => {
        const label = document.createElement('span');
        label.className = 'autocomplete-label';
        label.textContent = city.name;
        const meta = document.createElement('span');
        meta.className = 'autocomplete-meta';
        meta.textContent = city.country + ' · ' + city.population.toLocaleString('en-US');
        option.append(label, meta);
        option.dataset.query = query;
      },
    });

    // a fake server: the same dataview request a real one would get
    // (df$.dataview.source: filters match case-insensitively, the result is cached per query)
    const server = globalThis.df$.dataview.source(cities);
    ac.configure(document.getElementById('ac-load'), {
      sorters: [{ field: 'population', direction: 'desc' }],
      load: (request, { signal }) => new Promise((resolve, reject) => {
        stats.requests++;
        stats.requestsSeen.push(request);
        const timer = setTimeout(() => {
          stats.answered++;
          const all = server.query({ filters: request.filters, sorters: request.sorters }).entries;
          const start = request.page * request.pageSize;
          resolve({ rows: all.slice(start, start + request.pageSize).map((e) => e.row), total: all.length });
        }, 80);
        signal.addEventListener('abort', () => {
          clearTimeout(timer);
          stats.aborted++;
          reject(new DOMException('aborted', 'AbortError'));
        });
      }),
    });

    ac.configure(document.getElementById('ac-url'), { client: { headers: { 'x-client': 'fixture' } } });

    ac.configure(document.getElementById('ac-error'), {
      load: () => Promise.reject(new Error('The server is down')),
    });
    globalThis.__fixtureReady = true;
  </script>
</body>
</html>
