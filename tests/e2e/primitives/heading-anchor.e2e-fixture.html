<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>heading-anchor e2e fixture</title>
  <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css">
  <link rel="stylesheet" href="/dist/components/heading-anchor/heading-anchor.css">
  <style>body { padding: 2rem 3rem; font-family: var(--font-sans); }</style>
</head>
<body>
  <h3 id="t-front"><a class="heading-anchor" href="#t-front" aria-label="Link to section: Tokens">§</a> Tokens</h3>
  <h3 id="t-plain">Tokens</h3>
  <h3 id="t-hash"><a class="heading-anchor" href="#t-hash" aria-label="Link to section: Spacing">#</a> Spacing</h3>
  <h3 id="t-before"><a class="heading-anchor" href="#t-before" data-placement="before" aria-label="Link to section: Tokens">§</a> Tokens</h3>
  <h3 id="t-after">Tokens <a class="heading-anchor" href="#t-after" data-placement="after" aria-label="Link to section: Tokens">§</a></h3>
  <p><a class="heading-anchor" data-size="xs" data-placement="before" href="#t-before" aria-label="xs">§</a></p>
  <p><a class="heading-anchor" data-size="sm" data-placement="before" href="#t-before" aria-label="sm">§</a></p>
  <p><a class="heading-anchor" data-size="md" data-placement="before" href="#t-before" aria-label="md">§</a></p>
  <p><a class="heading-anchor" data-size="lg" data-placement="before" href="#t-before" aria-label="lg">§</a></p>
  <p><a class="heading-anchor" data-size="xl" data-placement="before" href="#t-before" aria-label="xl">§</a></p>
</body>
</html>
