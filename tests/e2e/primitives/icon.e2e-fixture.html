<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>icon e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/icon/icon.css" />
  </head>
  <body style="padding:2rem;display:block;">
    <!-- every documented size + the spin animation (every CSS data-token instantiated) -->
    <span data-lucide="x" id="ic-xs" data-size="xs"></span>
    <span data-lucide="x" id="ic-sm" data-size="sm"></span>
    <span data-lucide="x" id="ic-default"></span>
    <span data-lucide="x" id="ic-md" data-size="md"></span>
    <span data-lucide="x" id="ic-lg" data-size="lg"></span>
    <span data-lucide="x" id="ic-xl" data-size="xl"></span>
    <span data-lucide="loader" id="ic-spin" data-animate="spin"></span>
  </body>
</html>
