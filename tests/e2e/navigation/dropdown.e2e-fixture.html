<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dropdown e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/dropdown/dropdown.css" />
    <link rel="stylesheet" href="/dist/components/button-group/button-group.css" />
  </head>
  <body style="padding:12rem;">
    <!-- mirrors doc demo 1: options menu (label, group, disabled, separator, destructive) -->
    <button class="btn" data-variant="outline" data-dropdown-trigger="demo-dropdown" aria-haspopup="menu" aria-expanded="false">Open</button>
    <div id="demo-dropdown" role="menu" popover class="dropdown-content" aria-label="Options menu" style="min-width:12rem;">
      <div class="dropdown-label">My Account</div>
      <div role="group" aria-label="Navigation">
        <button role="menuitem" class="dropdown-item" tabindex="-1">Profile <span class="dropdown-shortcut">⇧⌘P</span></button>
        <button role="menuitem" class="dropdown-item" tabindex="-1">Settings</button>
        <button role="menuitem" class="dropdown-item" tabindex="-1" disabled>Upload</button>
      </div>
      <div class="dropdown-separator" role="separator"></div>
      <div role="group" aria-label="Actions">
        <button role="menuitem" class="dropdown-item" tabindex="-1">Export</button>
        <button role="menuitem" class="dropdown-item" data-variant="destructive" tabindex="-1">Delete</button>
      </div>
    </div>

    <!-- mirrors doc demo 2: checkbox + radio items -->
    <button class="btn" data-variant="outline" data-dropdown-trigger="demo-checks" aria-haspopup="menu" aria-expanded="false">View</button>
    <div id="demo-checks" role="menu" popover class="dropdown-content" aria-label="View options" style="min-width:11rem;">
      <!-- mirrors the doc demo: .dropdown-check / .dropdown-radio on the
           menuitem buttons themselves (the CSS indicator targets those) -->
      <button role="menuitemcheckbox" aria-checked="true" class="dropdown-item dropdown-check" tabindex="-1">Status Bar</button>
      <button role="menuitemcheckbox" aria-checked="false" class="dropdown-item dropdown-check" tabindex="-1">Activity Bar</button>
      <div role="group" aria-label="Cursor style">
        <button role="menuitemradio" aria-checked="true" class="dropdown-item dropdown-radio" tabindex="-1">Default</button>
        <button role="menuitemradio" aria-checked="false" class="dropdown-item dropdown-radio" tabindex="-1">Text</button>
      </div>
    </div>

    <!-- split button (button-group page): chevron trigger, end-aligned menu after the group -->
    <div class="btn-group" role="group" aria-label="Split action" style="margin-top:2rem;">
      <button class="btn" data-variant="outline">Save</button>
      <hr role="separator">
      <button class="btn" data-variant="outline" data-size="icon" id="split-trigger" aria-label="More save options" aria-haspopup="menu" aria-expanded="false" aria-controls="split-menu" data-dropdown-trigger="split-menu">v</button>
    </div>
    <div id="split-menu" role="menu" popover class="dropdown-content" data-align="end" aria-label="Save options">
      <button role="menuitem" class="dropdown-item" tabindex="-1">Save as draft</button>
      <button role="menuitem" class="dropdown-item" tabindex="-1">Save a copy</button>
    </div>
    <!-- viewport edges: the preferred alignment doesn't fit, the menu flips to the other edge -->
    <button class="btn" data-variant="outline" data-size="icon" id="edge-left-trigger" aria-label="Left edge menu" aria-haspopup="menu" aria-expanded="false" data-dropdown-trigger="edge-left-menu" style="position:fixed;left:4px;bottom:40vh;">v</button>
    <div id="edge-left-menu" role="menu" popover class="dropdown-content" data-align="end" aria-label="Left edge" style="min-width:12rem;">
      <button role="menuitem" class="dropdown-item" tabindex="-1">Item A</button>
    </div>
    <button class="btn" data-variant="outline" data-size="icon" id="edge-right-trigger" aria-label="Right edge menu" aria-haspopup="menu" aria-expanded="false" data-dropdown-trigger="edge-right-menu" style="position:fixed;right:4px;bottom:40vh;">v</button>
    <div id="edge-right-menu" role="menu" popover class="dropdown-content" aria-label="Right edge" style="min-width:12rem;">
      <button role="menuitem" class="dropdown-item" tabindex="-1">Item A</button>
    </div>
    <!-- submenus three levels deep, click-toggled checkbox / radio, disabled items, inset, link item -->
    <button class="btn" data-variant="outline" id="sub-trigger" data-dropdown-trigger="sub-menu" style="position:fixed;left:8px;top:8px;">Project</button>
    <div id="sub-menu" role="menu" popover class="dropdown-content" aria-label="Project" style="min-width:10rem;">
      <button role="menuitem" class="dropdown-item" tabindex="-1" id="s-new">New file</button>
      <div class="dropdown-sub">
        <button role="menuitem" class="dropdown-item dropdown-sub-trigger" tabindex="-1" id="s1-t">Recent</button>
        <div id="s1" role="menu" popover class="dropdown-content dropdown-sub-content" aria-label="Recent">
          <button role="menuitem" class="dropdown-item" tabindex="-1" id="s1-a">a.ts</button>
          <div class="dropdown-sub">
            <button role="menuitem" class="dropdown-item dropdown-sub-trigger" tabindex="-1" id="s2-t">More</button>
            <div id="s2" role="menu" popover class="dropdown-content dropdown-sub-content" aria-label="More">
              <button role="menuitem" class="dropdown-item" tabindex="-1" id="s2-a">b.ts</button>
              <div class="dropdown-sub">
                <button role="menuitem" class="dropdown-item dropdown-sub-trigger" tabindex="-1" id="s3-t">Archived</button>
                <div id="s3" role="menu" popover class="dropdown-content dropdown-sub-content" aria-label="Archived">
                  <button role="menuitem" class="dropdown-item" tabindex="-1" id="s3-a" data-value="old">old.ts</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="dropdown-sub">
        <button role="menuitem" class="dropdown-item dropdown-sub-trigger" tabindex="-1" id="sx-t">Share</button>
        <div id="sx" role="menu" popover class="dropdown-content dropdown-sub-content" aria-label="Share">
          <button role="menuitem" class="dropdown-item" tabindex="-1">Email</button>
        </div>
      </div>
      <div class="dropdown-sub">
        <button role="menuitem" class="dropdown-item dropdown-sub-trigger" tabindex="-1" id="sd-t" disabled>Translate</button>
        <div id="sd" role="menu" popover class="dropdown-content dropdown-sub-content" aria-label="Translate">
          <button role="menuitem" class="dropdown-item" tabindex="-1">English</button>
        </div>
      </div>
      <button role="menuitem" class="dropdown-item" tabindex="-1" id="s-ariadis" aria-disabled="true">Paste</button>
      <button role="menuitem" class="dropdown-item" tabindex="-1" id="s-inset" data-inset>Inset item</button>
      <a role="menuitem" class="dropdown-item" tabindex="-1" id="s-link" href="#linked">Docs</a>
    </div>

    <button class="btn" data-variant="outline" id="live-trigger" data-dropdown-trigger="live-menu" style="position:fixed;left:8px;top:60px;">Live</button>
    <div id="live-menu" role="menu" popover class="dropdown-content" aria-label="Live" style="min-width:10rem;">
      <button role="menuitemcheckbox" class="dropdown-item dropdown-check" aria-checked="false" tabindex="-1" id="lv-c1" data-value="bar">Bar</button>
      <div role="group" aria-label="Theme">
        <button role="menuitemradio" class="dropdown-item dropdown-radio" aria-checked="true" tabindex="-1" id="lv-r1">Light</button>
        <button role="menuitemradio" class="dropdown-item dropdown-radio" aria-checked="false" tabindex="-1" id="lv-r2">Dark</button>
      </div>
    </div>
    <div dir="rtl">
      <button class="btn" data-variant="outline" id="rtl-trigger" data-dropdown-trigger="rtl-menu" style="position:fixed;right:8px;top:8px;">قائمة</button>
      <div id="rtl-menu" role="menu" popover class="dropdown-content" aria-label="RTL" style="min-width:8rem;">
        <div class="dropdown-sub">
          <button role="menuitem" class="dropdown-item dropdown-sub-trigger" tabindex="-1" id="rtl-sub-t">مشاركة</button>
          <div id="rtl-sub" role="menu" popover class="dropdown-content dropdown-sub-content" aria-label="مشاركة"><button role="menuitem" class="dropdown-item" tabindex="-1">بريد</button></div>
        </div>
      </div>
    </div>
    <script type="module" src="/dist/components/core.js"></script>
    <script type="module" src="/dist/components/dropdown/dropdown.js"></script>
      <button class="btn" data-variant="outline" data-dropdown-trigger="z-dropdown-xs-pop" aria-haspopup="menu">Size xs</button><div id="z-dropdown-xs-pop" role="menu" popover class="dropdown-content" data-size="xs" aria-label="Size xs" style="min-width:10rem;"><button role="menuitem" class="dropdown-item">Item A</button><button role="menuitem" class="dropdown-item">Item B</button></div>
    <button class="btn" data-variant="outline" data-dropdown-trigger="z-dropdown-sm-pop" aria-haspopup="menu">Size sm</button><div id="z-dropdown-sm-pop" role="menu" popover class="dropdown-content" data-size="sm" aria-label="Size sm" style="min-width:10rem;"><button role="menuitem" class="dropdown-item">Item A</button><button role="menuitem" class="dropdown-item">Item B</button></div>
    <button class="btn" data-variant="outline" data-dropdown-trigger="z-dropdown-md-pop" aria-haspopup="menu">Size md</button><div id="z-dropdown-md-pop" role="menu" popover class="dropdown-content" data-size="md" aria-label="Size md" style="min-width:10rem;"><button role="menuitem" class="dropdown-item">Item A</button><button role="menuitem" class="dropdown-item">Item B</button></div>
    <button class="btn" data-variant="outline" data-dropdown-trigger="z-dropdown-lg-pop" aria-haspopup="menu">Size lg</button><div id="z-dropdown-lg-pop" role="menu" popover class="dropdown-content" data-size="lg" aria-label="Size lg" style="min-width:10rem;"><button role="menuitem" class="dropdown-item">Item A</button><button role="menuitem" class="dropdown-item">Item B</button></div>
    <button class="btn" data-variant="outline" data-dropdown-trigger="z-dropdown-xl-pop" aria-haspopup="menu">Size xl</button><div id="z-dropdown-xl-pop" role="menu" popover class="dropdown-content" data-size="xl" aria-label="Size xl" style="min-width:10rem;"><button role="menuitem" class="dropdown-item">Item A</button><button role="menuitem" class="dropdown-item">Item B</button></div>
</body>
</html>
