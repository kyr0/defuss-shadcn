<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>radial-progress e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/radial-progress/radial-progress.css" />
  </head>
  <!-- plain block flow: a flex body would blockify inline-grid to grid and
       hide the display value the component CSS actually sets -->
  <body style="padding:2rem;">
    <!-- default state, the doc page's first .preview -->
    <div class="radial-progress" id="rp-default" role="progressbar" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100" style="--value:70">70%</div>

    <!-- no --value at all: the base rule's 0 applies -->
    <div class="radial-progress" id="rp-unset" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>

    <!-- value scale (same set the doc page shows) -->
    <div class="radial-progress" id="rp-v0" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="--value:0">0%</div>
    <div class="radial-progress" id="rp-v25" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="--value:25">25%</div>
    <div class="radial-progress" id="rp-v50" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" style="--value:50">50%</div>
    <div class="radial-progress" id="rp-v75" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" style="--value:75">75%</div>
    <div class="radial-progress" id="rp-v100" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" style="--value:100">100%</div>

    <!-- every documented variant -->
    <div class="radial-progress" id="rp-variant-default" data-variant="default" role="progressbar" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100" style="--value:70">70%</div>
    <div class="radial-progress" id="rp-secondary" data-variant="secondary" role="progressbar" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100" style="--value:70">70%</div>
    <div class="radial-progress" id="rp-destructive" data-variant="destructive" role="progressbar" aria-valuenow="95" aria-valuemin="0" aria-valuemax="100" style="--value:95">95%</div>
    <div class="radial-progress" id="rp-success" data-variant="success" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" style="--value:100">100%</div>

    <!-- every documented size -->
    <div class="radial-progress" id="rp-sm" data-size="sm" role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" style="--value:40">40%</div>
    <div class="radial-progress" id="rp-lg" data-size="lg" role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" style="--value:40">40%</div>

    <!-- custom --size / --thickness (the documented escape hatch) -->
    <div class="radial-progress" id="rp-custom" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="--value:60;--size:12rem;--thickness:2px">60%</div>
    <div class="radial-progress" id="rp-thick" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="--value:60;--size:8rem;--thickness:1.5rem">60%</div>

    <!-- composition: label other than a percentage -->
    <div class="radial-progress" id="rp-fraction" data-size="lg" data-format="fraction" role="progressbar" aria-valuenow="7" aria-valuemin="0" aria-valuemax="10" style="--value:70">7/10</div>
    <!-- a foreign --value (countdown digits, consumer code) stays untyped -->
    <span id="foreign" style="--value: 5px">x</span>
    <!-- a ring whose value the test changes, to watch the tween -->
    <div class="radial-progress" id="rp-tween" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="--value:0">0%</div>
    <!-- runtime (radial-progress.js): tones, labels, indeterminate, commands -->
    <div class="radial-progress" id="t-success" data-tone="success" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"></div>
    <div class="radial-progress" id="t-warning" data-tone="warning" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"></div>
    <div class="radial-progress" id="t-info" data-tone="info" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"></div>
    <div class="radial-progress" id="t-destructive" data-tone="destructive" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"></div>
    <div class="radial-progress" id="t-custom" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="--progress-color: rgb(200, 0, 200);"></div>
    <div class="radial-progress" id="t-auto" data-tone="auto" role="progressbar" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100"></div>
    <div class="radial-progress" id="l-pct" role="progressbar" aria-valuenow="38" aria-valuemin="0" aria-valuemax="100"></div>
    <div class="radial-progress" id="l-tpl" data-template="{value} km" role="progressbar" aria-valuenow="7" aria-valuemin="0" aria-valuemax="10"></div>
    <div class="radial-progress" id="l-cap" data-format="fraction" role="progressbar" aria-valuenow="4" aria-valuemin="0" aria-valuemax="5"><span class="radial-progress-value" id="l-cap-v"></span><span class="radial-progress-caption" id="l-cap-c">workouts</span></div>
    <div class="radial-progress" id="l-icon" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"><i id="l-icon-i">✓</i></div>
    <div class="radial-progress" id="ind" data-indeterminate="Waiting" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
    <div class="radial-progress" id="cmd" data-step="10" data-duration="600" role="progressbar" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100"></div>
    <button id="b-inc" type="button" commandfor="cmd" command="--increment">+</button>
    <button id="b-dec" type="button" commandfor="cmd" command="--decrement">-</button>
    <button id="b-reset" type="button" commandfor="cmd" command="--reset">reset</button>
    <button id="b-play" type="button" commandfor="cmd" command="--play">play</button>
    <button id="b-pause" type="button" commandfor="cmd" command="--pause">pause</button>
    <script type="module" src="/dist/components/core.js"></script>
    <script type="module" src="/dist/components/radial-progress/radial-progress.js"></script>
  </body>
</html>
