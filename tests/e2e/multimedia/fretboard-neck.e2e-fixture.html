<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fretboard-neck e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/select/select.css" />
    <link rel="stylesheet" href="/dist/components/fretboard-neck/fretboard-neck.css" />
  </head>
  <!-- mirrors the doc page: a ukulele's C sounding, G with the next note, F upright, Am for the right hand, G in string
       colours, a guitar's F with a capo and a barre, a guitar's C with a muted string, a scale on twelve frets, the
       neck played through the API (a select and two buttons); plus a neck with its own description and none named -->
  <body style="padding: 2rem; display: grid; gap: 1.5rem; width: 900px; margin: 0">
    <div class="fretboard-neck" id="fn-c" data-tuning="G C E A" data-shape="0003" data-notes="1/3" aria-label="C on a ukulele"></div>
    <div class="fretboard-neck" id="fn-next" data-tuning="G C E A" data-shape="0232" data-notes="3/2" data-next="2/3" aria-label="G, picked"></div>
    <div style="display: flex; gap: 1.5rem; align-items: start">
      <div class="fretboard-neck" id="fn-upright" data-orientation="vertical" data-tuning="G C E A" data-shape="2010" data-notes="2/1" aria-label="F, upright"></div>
    </div>
    <div class="fretboard-neck" id="fn-right" data-hand="right" data-tuning="G C E A" data-shape="2000" data-notes="4/2" aria-label="Am for the right hand"></div>
    <div class="fretboard-neck" id="fn-colors" data-colors="strings" data-tuning="G C E A" data-shape="0232" data-notes="3/2 2/3 1/2" aria-label="G in string colours"></div>
    <div class="fretboard-neck" id="fn-capo" data-tuning="E A D G B e" data-capo="3" data-shape="133211" data-barre="1" data-notes="6/1" aria-label="F with a capo on the 3rd fret"></div>
    <div class="fretboard-neck" id="fn-muted" data-tuning="E A D G B e" data-shape="x32010" data-notes="5/3 4/2 2/1" aria-label="C on a guitar"></div>
    <div class="fretboard-neck" id="fn-scale" data-tuning="G C E A" data-frets="12" data-notes="3/2 2/1 2/3 1/2 1/3" aria-label="C major scale"></div>
    <p id="fn-own-hint">Four strings, nothing played.</p>
    <div class="fretboard-neck" id="fn-plain" aria-describedby="fn-own-hint"></div>

    <div style="display: grid; gap: 0.75rem">
      <div class="fretboard-neck" id="fn-play" data-tuning="G C E A" aria-label="Chords played"></div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem">
        <select class="select" data-size="sm" id="fn-play-chord" aria-label="Chord">
          <option value="0003">C</option>
          <option value="0232">G</option>
        </select>
        <button class="btn" data-variant="outline" data-size="sm" id="fn-play-strum">Strum</button>
        <button class="btn" data-variant="outline" data-size="sm" id="fn-play-pick">Pick</button>
      </div>
    </div>

    <script type="module" src="/dist/components/core.js"></script>
    <script type="module" src="/dist/components/fretboard-neck/fretboard-neck.js"></script>
    <script type="module">
      const notesOf = (shape) => [...shape].map((f, i) => ({ string: 4 - i, fret: Number(f) })).filter((n) => n.fret > 0);
      let step = 0;
      document.querySelector('#fn-play-strum').addEventListener('click', () => {
        const shape = document.querySelector('#fn-play-chord').value;
        globalThis.df$.shadcn.fretboardNeck.play('#fn-play', notesOf(shape), { shape, next: '' });
      });
      document.querySelector('#fn-play-pick').addEventListener('click', () => {
        const shape = document.querySelector('#fn-play-chord').value;
        const strings = [...shape].map((f, i) => ({ string: 4 - i, fret: Number(f) }));
        const now = strings[step % 4];
        const next = strings[(step + 1) % 4];
        step++;
        globalThis.df$.shadcn.fretboardNeck.play('#fn-play', [now], { shape, next: [next] });
      });
    </script>
  </body>
</html>
