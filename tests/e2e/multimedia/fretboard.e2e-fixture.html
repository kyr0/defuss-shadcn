<!doctype html>

    <title>fretboard e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/select/select.css" />

  <!-- mirrors the doc page: a song of three scores (a tempo from another, another key replacing the chords and the
       melody) with chords, a melody, strums, a chord column, picked strings, a followed lyrics lane (a hold, markup
       as text) and a lyrics lane of its own items, every header control, readout and select, a position slider, a
       neck and a chord chart outside it, a 3/4 score of the same song; a long fast score in a bounded sheet (scrolling), a waltz (three-four) in string colours for the right hand with its chord charts (across and upright) and an upright neck, a
       narrow score the page scrolls to, one that never scrolls (data-follow="none") and a song without scores -->
  <body style="padding: 2rem; display: grid; gap: 1.5rem; width: 760px; margin: 0">
    <div class="fretboard" id="fb-main" role="group" aria-label="Fixture song">
      <div class="fretboard-header">
        <span class="fretboard-title">Fixture song</span>
        <button class="btn" data-variant="ghost" data-size="icon-sm" data-fretboard-action="toggle" aria-pressed="false" aria-label="Play" id="fb-main-toggle"><i data-lucide="play"></i><i data-lucide="pause"></i></button>
        <button class="btn" data-variant="ghost" data-size="icon-sm" data-fretboard-action="stop" aria-label="Stop" id="fb-main-stop"><i data-lucide="square"></i></button>
        <button class="btn" data-variant="ghost" data-size="icon-sm" data-fretboard-action="loop" aria-pressed="false" aria-label="Loop" id="fb-main-loop"><i data-lucide="repeat"></i></button>
        <span class="fretboard-readout"><output id="fb-main-measure" data-fretboard-output="measure">1</output> / <output id="fb-main-measures" data-fretboard-output="measures">4</output></span>
        <output class="fretboard-readout" id="fb-main-beat" data-fretboard-output="beat">1</output>
        <output class="fretboard-readout" id="fb-main-time" data-fretboard-output="time">0:00</output>
        <button class="btn" data-variant="ghost" data-size="icon-sm" data-fretboard-action="zoom-out" aria-label="Zoom out" id="fb-main-zoom-out"><i data-lucide="zoom-out"></i></button>
        <output class="fretboard-readout" id="fb-main-zoom" data-fretboard-output="zoom">100%</output>
        <button class="btn" data-variant="ghost" data-size="icon-sm" data-fretboard-action="zoom-in" aria-label="Zoom in" id="fb-main-zoom-in"><i data-lucide="zoom-in"></i></button>
        <button class="btn" data-variant="ghost" data-size="icon-sm" data-fretboard-action="zoom-reset" aria-label="Actual size" id="fb-main-zoom-reset"><i data-lucide="scan"></i></button>
        <select class="select" data-size="sm" data-fretboard-control="key" aria-label="Key" id="fb-main-key"></select>
        <select class="select" data-size="sm" data-fretboard-control="signature" aria-label="Time signature" id="fb-main-signature"></select>
        <select class="select" data-size="sm" data-fretboard-control="score" aria-label="Score" id="fb-main-score"></select>
