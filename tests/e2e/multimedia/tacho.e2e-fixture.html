<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tacho e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/slider/slider.css" />
    <link rel="stylesheet" href="/dist/components/knob/knob.css" />
    <link rel="stylesheet" href="/dist/components/tacho/tacho.css" />
  </head>
  <!-- mirrors the doc page: a tuner (cents, a narrow optimum, labels every 25, the note, the frequency, the caption), a
       pan position with a bound slider, the three needles (spring, smooth, instant), a rev counter (240 degrees, three
       zones, a custom format for the scale and the readout), a VU meter resting at its minimum, a small one in a chart
       colour, an idle tuner, a knob bound to a tacho -->
  <body style="padding: 2rem; display: grid; gap: 2rem; width: 900px; margin: 0">
    <section style="display: flex; flex-wrap: wrap; gap: 2rem; align-items: start">
      <div class="tacho" id="tc-tuner" data-size="lg" data-format="signed" data-sweep="100" data-ticks="25" data-minor="4">
        <span class="tacho-label">A</span>
        <meter class="tacho-meter" id="tc-tuner-meter" min="-50" max="50" low="-5" high="5" optimum="0" value="0" aria-label="Tuning in cents">0 cents</meter>
        <output class="tacho-value">440.0 Hz</output>
        <span class="tacho-caption">A4 · 0 ct</span>
      </div>
      <div style="display: grid; gap: 0.5rem">
        <div class="tacho" id="tc-pan" data-format="pan" data-sweep="90" data-ticks="25" data-minor="4">
          <span class="tacho-label">Pan</span>
          <meter class="tacho-meter" min="-50" max="50" value="-20" aria-label="Pan">L20</meter>
          <output class="tacho-value"></output>
        </div>
        <input class="slider" type="range" id="tc-pan-slider" min="-50" max="50" value="-20" data-tacho-for="tc-pan" aria-label="Pan" />
      </div>
    </section>

    <section style="display: flex; gap: 1.5rem">
      <div class="tacho" id="tc-spring" data-size="sm">
        <meter class="tacho-meter" min="0" max="100" value="0" aria-label="Spring">0</meter>
        <output class="tacho-value"></output>
      </div>
      <div class="tacho" id="tc-smooth" data-size="sm" data-needle="smooth">
        <meter class="tacho-meter" min="0" max="100" value="0" aria-label="Smooth">0</meter>
        <output class="tacho-value"></output>
      </div>
      <div class="tacho" id="tc-instant" data-size="sm" data-needle="instant">
        <meter class="tacho-meter" min="0" max="100" value="0" aria-label="Instant">0</meter>
        <output class="tacho-value"></output>
      </div>
    </section>

    <section style="display: flex; flex-wrap: wrap; gap: 2rem; align-items: start">
      <div class="tacho" id="tc-rev" data-sweep="240" data-ticks="1000" data-minor="4" data-format="rpm">
        <meter class="tacho-meter" min="0" max="8000" low="5500" high="6500" optimum="0" value="800" aria-label="Engine speed">800 rpm</meter>
        <output class="tacho-value"></output>
        <span class="tacho-caption">× 1000 rpm</span>
      </div>
      <div class="tacho" id="tc-vu" data-sweep="90" data-ticks="5" data-format="signed" data-unit="dB" data-decimals="1" data-rest="-20" data-needle="smooth">
        <span class="tacho-label">VU</span>
        <meter class="tacho-meter" min="-20" max="3" low="-6" high="0" optimum="-20" value="-10" aria-label="Level">-10 dB</meter>
        <output class="tacho-value"></output>
      </div>
      <div class="tacho" id="tc-sm" data-size="sm" data-color="chart-2" data-labels="ends">
        <meter class="tacho-meter" min="0" max="1" value="0.5" aria-label="Mix">0.5</meter>
        <output class="tacho-value"></output>
      </div>
      <div class="tacho" id="tc-idle" data-idle data-format="signed" data-ticks="10" data-labels="ends">
        <span class="tacho-label">–</span>
        <meter class="tacho-meter" min="-50" max="50" low="-5" high="5" optimum="0" value="0" aria-label="Tuning in cents">0 cents</meter>
        <output class="tacho-value">– Hz</output>
      </div>
      <div style="display: grid; gap: 0.5rem; justify-items: center">
        <div class="tacho" id="tc-knob-view" data-size="sm" data-sweep="270">
          <meter class="tacho-meter" min="0" max="10" value="3" aria-label="Drive">3</meter>
          <output class="tacho-value"></output>
        </div>
        <div class="knob" data-size="sm" data-tacho-for="tc-knob-view">
          <input class="knob-input" type="range" id="tc-knob" min="0" max="10" step="0.1" value="3" />
          <label class="knob-label" for="tc-knob">Drive</label>
          <output class="knob-value" for="tc-knob">3.0</output>
        </div>
      </div>
    </section>

    <script type="module" src="/dist/components/core.js"></script>
    <script type="module" src="/dist/components/knob/knob.js"></script>
    <script type="module" src="/dist/components/tacho/tacho.js"></script>
    <script type="module">
      // the rev counter's scale in thousands, its readout in rpm
      globalThis.df$.shadcn.tacho.format('rpm', (v, c) =>
        c.tick ? String(v / 1000) : `${new Intl.NumberFormat(c.locale).format(Math.round(v))} rpm`,
      );
    </script>
  </body>
</html>
