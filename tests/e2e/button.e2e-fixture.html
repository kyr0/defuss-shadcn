<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>button e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
  </head>
  <body style="padding:2rem;">
    <!-- every documented variant + size (verify fixture↔CSS parity) -->
    <button class="btn" id="bt-default" data-variant="default">Default</button>
    <button class="btn" id="bt-secondary" data-variant="secondary">Secondary</button>
    <button class="btn" id="bt-outline" data-variant="outline">Outline</button>
    <button class="btn" id="bt-ghost" data-variant="ghost">Ghost</button>
    <button class="btn" id="bt-destructive" data-variant="destructive">Destructive</button>
    <button class="btn" id="bt-link" data-variant="link">Link</button>

    <button class="btn" id="bt-xs" data-size="xs">xs</button>
    <button class="btn" id="bt-sm" data-size="sm">sm</button>
    <button class="btn" id="bt-md" data-size="md">md</button>
    <button class="btn" id="bt-lg" data-size="lg">lg</button>
    <button class="btn" id="bt-xl" data-size="xl">xl</button>
    <button class="btn" id="bt-icon" data-size="icon" aria-label="icon">+</button>
    <button class="btn" id="bt-icon-xs" data-size="icon-xs" aria-label="icon-xs">+</button>
    <button class="btn" id="bt-icon-sm" data-size="icon-sm" aria-label="icon-sm">+</button>
    <button class="btn" id="bt-icon-lg" data-size="icon-lg" aria-label="icon-lg">+</button>
    <button class="btn" id="bt-icon-xl" data-size="icon-xl" aria-label="icon-xl">+</button>

    <button class="btn" id="bt-disabled" disabled>Disabled</button>
    <button class="btn" id="bt-aria-disabled" aria-disabled="true">aria-disabled</button>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:1rem;">
      <button class="btn" id="bt-soft" data-variant="soft">Soft</button>
      <button class="btn" id="bt-dashed" data-variant="dashed">Dashed</button>
      <button class="btn" id="bt-success" data-tone="success">Success</button>
      <button class="btn" id="bt-warning" data-tone="warning">Warning</button>
      <button class="btn" id="bt-info" data-tone="info">Info</button>
      <button class="btn" id="bt-tone-destructive" data-tone="destructive">Destructive</button>
      <button class="btn" id="bt-success-outline" data-tone="success" data-variant="outline">Outline</button>
      <button class="btn" id="bt-success-soft" data-tone="success" data-variant="soft">Soft</button>
      <button class="btn" id="bt-success-ghost" data-tone="success" data-variant="ghost">Ghost</button>
      <button class="btn" id="bt-success-dashed" data-tone="success" data-variant="dashed">Dashed</button>
      <button class="btn" id="bt-success-link" data-tone="success" data-variant="link">Link</button>
      <button class="btn" id="bt-custom" data-tone="custom" style="--btn-color: rgb(120, 40, 200); --btn-color-fg: rgb(255, 255, 0);">Custom</button>
      <button class="btn" id="bt-custom-outline" data-tone="custom" data-variant="outline" style="--btn-color: rgb(120, 40, 200);">Custom outline</button>
    </div>
    <div dir="rtl" style="margin-top:1rem;"><button class="btn" id="bt-rtl">التالي <svg id="bt-rtl-arrow" data-rtl-flip viewBox="0 0 24 24"><path d="M5 12h14"/></svg><svg id="bt-rtl-sym" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/></svg></button></div>
    <div dir="ltr"><button class="btn"><svg id="bt-ltr-arrow" data-rtl-flip viewBox="0 0 24 24"><path d="M5 12h14"/></svg> Next</button></div>
  </body>
</html>
