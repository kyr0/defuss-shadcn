<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>core runtime e2e fixture — modular mode (core + selected components)</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/badge/badge.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/dialog/dialog.css" />
  </head>
  <body>
    <!-- CSS-only component: proves tokens + component CSS apply without JS -->
    <span class="badge" id="css-only" data-variant="default">CSS-only</span>

    <!-- interactive component: proves a component bound to core initializes -->
    <button class="btn" id="trigger" data-dialog-trigger="demo-dialog" aria-haspopup="dialog">Open dialog</button>
    <dialog id="demo-dialog" class="dialog" role="dialog" aria-modal="true">
      <div class="dialog-content"><p id="demo-body">core + dialog</p></div>
    </dialog>

    <script type="module" src="/dist/components/core.js"></script>
    <script type="module" src="/dist/components/dialog/dialog.js"></script>
  </body>
</html>
