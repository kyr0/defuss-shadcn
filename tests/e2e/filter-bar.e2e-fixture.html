<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>filter-bar e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/theme/utils/layout.css" />
    <link rel="stylesheet" href="/dist/theme/utils/accessibility.css" />
    <link rel="stylesheet" href="/dist/components/select/select.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/badge/badge.css" />
    <link rel="stylesheet" href="/dist/components/filter-bar/filter-bar.css" />
    <style>body { padding: 2rem; margin: 0; font-family: sans-serif; } body > section.fx { margin-block-end: 3rem; }</style>
  </head>
  <body>
    <!-- Default -->
    <section class="fx">
<div class="mk-filter-bar">
  <form action="#" method="get" aria-label="Filters">
    <select class="select" name="category" aria-label="Category"><option>All categories</option><option>Shirts</option><option>Knitwear</option></select>
    <select class="select" name="price" aria-label="Price"><option>Any price</option><option>Under €50</option><option>€50 – €100</option></select>
    <span class="mk-filter-bar-sep" aria-hidden="true"></span>
    <label class="mk-filter-bar-chip"><input type="checkbox" name="sale" checked><i data-lucide="percent"></i>On sale</label>
    <label class="mk-filter-bar-chip"><input type="checkbox" name="new">New in</label>
    <label class="mk-filter-bar-chip"><input type="checkbox" name="organic">Organic</label>
    <button class="btn" data-variant="outline" data-size="sm" type="button"><i data-lucide="sliders-horizontal"></i> More filters <span class="badge" data-variant="secondary" data-size="sm">2</span></button>
    <output class="mk-filter-bar-count">36 products</output>
  </form>
</div>
    </section>
    <!-- Sticky -->
    <section class="fx">
<div style="max-height:16rem;overflow:auto;width:100%;border:1px solid var(--border);border-radius:var(--radius-md)">
  <div class="mk-filter-bar" data-variant="sticky">
    <form action="#" method="get" aria-label="Filters" style="padding-inline:0.75rem">
      <label class="mk-filter-bar-chip"><input type="checkbox" name="open" checked>Open now</label>
      <label class="mk-filter-bar-chip"><input type="checkbox" name="wifi">Wi-Fi</label>
      <label class="mk-filter-bar-chip"><input type="checkbox" name="quiet">Quiet</label>
      <output class="mk-filter-bar-count">12 cafés</output>
    </form>
  </div>
  <div style="padding:1rem;display:grid;gap:0.75rem"><p style="margin:0;color:var(--muted-foreground)">Café 1</p><p style="margin:0;color:var(--muted-foreground)">Café 2</p><p style="margin:0;color:var(--muted-foreground)">Café 3</p><p style="margin:0;color:var(--muted-foreground)">Café 4</p><p style="margin:0;color:var(--muted-foreground)">Café 5</p><p style="margin:0;color:var(--muted-foreground)">Café 6</p><p style="margin:0;color:var(--muted-foreground)">Café 7</p><p style="margin:0;color:var(--muted-foreground)">Café 8</p><p style="margin:0;color:var(--muted-foreground)">Café 9</p><p style="margin:0;color:var(--muted-foreground)">Café 10</p></div>
</div>
    </section>
  </body>
</html>
