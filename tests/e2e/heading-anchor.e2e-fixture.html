<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>heading-anchor e2e fixture</title>
  <link rel="stylesheet" href="/dist/theme/default-semantic-tokens.css">
  <link rel="stylesheet" href="/dist/components/heading-anchor/heading-anchor.css">
  <style>body { padding: 2rem; font-family: var(--font-sans); }</style>
</head>
<body>
  <h3 id="t-before"><a class="heading-anchor" href="#t-before" aria-label="Link to section: Tokens">§</a> Tokens</h3>
  <h3 id="t-after">Tokens <a class="heading-anchor" href="#t-after" data-placement="after" aria-label="Link to section: Tokens">§</a></h3>
  <p><a class="heading-anchor" data-size="xs" href="#t-before" aria-label="xs">§</a></p>
  <p><a class="heading-anchor" data-size="sm" href="#t-before" aria-label="sm">§</a></p>
  <p><a class="heading-anchor" data-size="md" href="#t-before" aria-label="md">§</a></p>
  <p><a class="heading-anchor" data-size="lg" href="#t-before" aria-label="lg">§</a></p>
  <p><a class="heading-anchor" data-size="xl" href="#t-before" aria-label="xl">§</a></p>
</body>
</html>
