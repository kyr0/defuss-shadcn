<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Grid e2e fixture</title>
  <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css">
  <link rel="stylesheet" href="/dist/components/data-grid/data-grid.css">
  <link rel="stylesheet" href="/dist/components/checkbox/checkbox.css">
  <link rel="stylesheet" href="/dist/components/data-tree/data-tree.css">
  <style>
    /* spacing and container size only - never properties the checks assert */
    body { font-family: system-ui, sans-serif; padding: 1.5rem; }
    .data-grid { height: 360px; max-width: 46rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <!-- 100,000 orders: virtual scrolling, multisort, column filters, a locked column, multiple selection -->
  <div class="data-grid" id="dg-orders" aria-label="Orders" data-select="multiple" data-empty-text="No orders match.">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="id" data-type="number" data-width="6rem" data-format="" data-filter="number" data-locked>ID</div>
          <div class="data-grid-header" data-field="customer" data-width="12rem" data-filter="text">Customer</div>
          <div class="data-grid-header" data-field="region" data-width="8rem" data-filter="select" data-options="EU,US,APAC">Region</div>
          <div class="data-grid-header" data-field="amount" data-type="number" data-width="9rem" data-format="currency:EUR" data-filter="number">Amount</div>
          <div class="data-grid-header" data-field="status" data-width="9rem" data-filter="select">Status</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>

  <!-- pagination: 25 rows a page -->
  <div class="data-grid" id="dg-pages" aria-label="Paged orders" data-paging="pages" data-page-size="25">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="id" data-type="number" data-width="6rem" data-format="">ID</div>
          <div class="data-grid-header" data-field="customer" data-width="12rem">Customer</div>
          <div class="data-grid-header" data-field="amount" data-type="number" data-width="9rem" data-format="currency:EUR">Amount</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>

  <!-- infinite: pages load from an async loader as you near the end -->
  <div class="data-grid" id="dg-infinite" aria-label="Event log" data-paging="infinite" data-page-size="40">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="id" data-type="number" data-width="6rem" data-format="">#</div>
          <div class="data-grid-header" data-field="event" data-width="14rem">Event</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>

  <!-- tree grid: every row may have a parent -->
  <div class="data-grid" id="dg-tree" aria-label="Files" data-parent-field="parentId" data-select="single">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="name" data-width="16rem" data-filter="text">Name</div>
          <div class="data-grid-header" data-field="size" data-type="number" data-width="8rem" data-filter="number">Size</div>
          <div class="data-grid-header" data-field="kind" data-width="8rem">Kind</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>

  <!-- waiting for its records: no setSource yet - it starts in loading -->
  <div class="data-grid" id="dg-waiting" aria-label="Waiting for records" data-persist="none" style="height:160px;">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="id" data-type="number">ID</div>
          <div class="data-grid-header" data-field="name" data-filter="text">Name</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>

  <!-- persistence: local storage under its own key, with an authored sort (data-sort) -->
  <div class="data-grid" id="dg-local" aria-label="Kept locally" data-persist="local" data-persist-key="fixture-grid" style="height:200px;">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="id" data-type="number" data-format="" data-width="6rem">ID</div>
          <div class="data-grid-header" data-field="customer" data-width="12rem">Customer</div>
          <div class="data-grid-header" data-field="amount" data-type="number" data-width="9rem" data-sort="desc">Amount</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>

  <!-- persistence opted out -->
  <div class="data-grid" id="dg-none" aria-label="Not kept" data-persist="none" style="height:200px;">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="id" data-type="number" data-format="" data-width="6rem">ID</div>
          <div class="data-grid-header" data-field="customer" data-width="12rem">Customer</div>
          <div class="data-grid-header" data-field="amount" data-type="number" data-width="9rem">Amount</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>

  <!-- persistence + starting query from setSource's config -->
  <div class="data-grid" id="dg-config" aria-label="Configured" style="height:200px;">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="id" data-type="number" data-format="" data-width="6rem">ID</div>
          <div class="data-grid-header" data-field="customer" data-width="12rem">Customer</div>
          <div class="data-grid-header" data-field="amount" data-type="number" data-width="9rem">Amount</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>

  <!-- inline editing: built-in editors by type, rules, a custom editor, validateFn, a cell that does not edit -->
  <div class="data-grid" id="dg-edit" aria-label="Stock" style="height:240px;">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="name" data-editable data-required>Name</div>
          <div class="data-grid-header" data-field="qty" data-type="number" data-editable data-min="0" data-integer data-sort="desc">Qty</div>
          <div class="data-grid-header" data-field="kind" data-editable data-editor="enum" data-options="tool, part, kit">Kind</div>
          <div class="data-grid-header" data-field="ok" data-editable data-editor="boolean">OK</div>
          <div class="data-grid-header" data-field="score" data-type="number" data-editable>Score</div>
          <div class="data-grid-header" data-field="note">Note</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>

  <!-- selection models over editable parts: cells (Excel's ranges), columns, rows and columns - copy and paste -->
  <div class="data-grid" id="dg-cells" aria-label="Parts by cell" data-select="multiple" data-select-model="cell" data-persist="none" style="height:240px;">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="id" data-type="number" data-format="" data-width="5rem">ID</div>
          <div class="data-grid-header" data-field="name" data-width="9rem" data-editable data-required>Name</div>
          <div class="data-grid-header" data-field="qty" data-type="number" data-width="6rem" data-editable data-min="0" data-integer>Qty</div>
          <div class="data-grid-header" data-field="kind" data-width="7rem" data-editable data-editor="enum" data-options="tool, part, kit">Kind</div>
          <div class="data-grid-header" data-field="note" data-width="8rem">Note</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>
  <div class="data-grid" id="dg-cols" aria-label="Parts by column" data-select="multiple" data-select-model="column" data-persist="none" style="height:240px;">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="id" data-type="number" data-format="" data-width="5rem">ID</div>
          <div class="data-grid-header" data-field="name" data-width="9rem" data-editable data-required>Name</div>
          <div class="data-grid-header" data-field="qty" data-type="number" data-width="6rem" data-editable data-min="0" data-integer>Qty</div>
          <div class="data-grid-header" data-field="kind" data-width="7rem" data-editable data-editor="enum" data-options="tool, part, kit">Kind</div>
          <div class="data-grid-header" data-field="note" data-width="8rem">Note</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>
  <div class="data-grid" id="dg-both" aria-label="Parts by row and column" data-select="multiple" data-select-model="row column" data-persist="none" style="height:240px;">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="id" data-type="number" data-format="" data-width="5rem">ID</div>
          <div class="data-grid-header" data-field="name" data-width="9rem" data-editable data-required>Name</div>
          <div class="data-grid-header" data-field="qty" data-type="number" data-width="6rem" data-editable data-min="0" data-integer>Qty</div>
          <div class="data-grid-header" data-field="kind" data-width="7rem" data-editable data-editor="enum" data-options="tool, part, kit">Kind</div>
          <div class="data-grid-header" data-field="note" data-width="8rem">Note</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>
  <!-- the checkbox model: a checkbox in front of every row, one for all in the head; a filter row keeps its place -->
  <div class="data-grid" id="dg-check" aria-label="Parts by checkbox" data-select="multiple" data-select-model="checkbox" data-persist="none" style="height:240px;">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="id" data-type="number" data-format="" data-width="5rem">ID</div>
          <div class="data-grid-header" data-field="name" data-width="9rem" data-filter="text">Name</div>
          <div class="data-grid-header" data-field="qty" data-type="number" data-width="6rem">Qty</div>
          <div class="data-grid-header" data-field="kind" data-width="7rem">Kind</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>
  <!-- drag and drop: rows move (or, with Alt / Ctrl, copy) between two grids -->
  <div class="data-grid" id="dg-from" aria-label="Backlog" data-select="multiple" data-drag data-drop data-persist="none" style="height:240px;">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="id" data-type="number" data-format="" data-width="5rem">ID</div>
          <div class="data-grid-header" data-field="title" data-width="12rem">Title</div>
          <div class="data-grid-header" data-field="points" data-type="number" data-width="6rem">Points</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>
  <div class="data-grid" id="dg-to" aria-label="Sprint" data-select="multiple" data-select-model="checkbox" data-drag data-drop data-persist="none" style="height:360px;">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="id" data-type="number" data-format="" data-width="5rem">ID</div>
          <div class="data-grid-header" data-field="title" data-width="12rem">Title</div>
          <div class="data-grid-header" data-field="points" data-type="number" data-width="6rem">Points</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>
  <!-- a tree grid whose rows drag into other rows (their children) and out to a Data Tree -->
  <div class="data-grid" id="dg-tree-dnd" aria-label="Folders" data-parent-field="parentId" data-select="multiple" data-select-model="checkbox" data-drag data-drop data-persist="none" style="height:280px;">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="name" data-width="minmax(12rem, 1fr)">Name</div>
          <div class="data-grid-header" data-field="kind" data-width="7rem">Kind</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>
  <div class="data-tree" id="dt-drop" aria-label="Archive" data-drag="copy" data-drop data-persist="none" style="height:200px;max-width:20rem;"></div>
  <!-- waits for records: the loading state -->
  <div class="data-grid" id="dg-wait" aria-label="Pending">
    <div class="data-grid-viewport">
      <div class="data-grid-head">
        <div class="data-grid-row">
          <div class="data-grid-header" data-field="id">ID</div>
        </div>
      </div>
      <div class="data-grid-body"></div>
    </div>
  </div>

  <script type="module" src="/dist/components/core.js"></script>
  <script type="module" src="/dist/components/data-grid/data-grid.js"></script>
  <script type="module" src="/dist/components/data-tree/data-tree.js"></script>
  <script type="module">
    const grid = globalThis.df$.shadcn.dataGrid;
    const names = ['Ada', 'Grace', 'Linus', 'Barbara', 'Ken', 'Margaret', 'Dennis', 'Frances'];
    const regions = ['EU', 'US', 'APAC'];
    const statuses = ['open', 'paid', 'shipped', 'refunded'];
    // deterministic: row i always reads the same
    const orders = Array.from({ length: 100_000 }, (_, i) => ({
      id: i + 1,
      customer: `${names[i % 8]} ${String.fromCharCode(65 + (i * 7) % 26)}.`,
      region: regions[i % 3],
      amount: ((i * 7919) % 100_000) / 100,
      status: statuses[(i * 5) % 4],
    }));
    grid.setSource(document.getElementById('dg-orders'), orders);
    grid.setSource(document.getElementById('dg-pages'), orders.slice(0, 1000));
    grid.setSource(document.getElementById('dg-infinite'), [], {
      load: (offset, size) => new Promise((r) => setTimeout(() => r(offset >= 200 ? [] : Array.from({ length: size }, (_, i) => ({ id: offset + i + 1, event: `Event ${offset + i + 1}` }))), 30)),
    });
    // 20 folders × 50 sub-folders × 10 files = 11,020 rows
    const files = [];
    let id = 0;
    for (let a = 0; a < 20; a++) {
      const top = ++id;
      files.push({ id: top, parentId: null, name: `Folder ${a + 1}`, size: 0, kind: 'folder' });
      for (let b = 0; b < 50; b++) {
        const sub = ++id;
        files.push({ id: sub, parentId: top, name: `Folder ${a + 1}.${b + 1}`, size: 0, kind: 'folder' });
        for (let c = 0; c < 10; c++) files.push({ id: ++id, parentId: sub, name: `file-${a + 1}-${b + 1}-${c + 1}.txt`, size: ((id * 37) % 9000) + 100, kind: 'file' });
      }
    }
    grid.setSource(document.getElementById('dg-tree'), files);
    const few = orders.slice(0, 200);
    grid.setSource(document.getElementById('dg-local'), few);
    grid.setSource(document.getElementById('dg-none'), few);
    grid.setSource(document.getElementById('dg-config'), few, {
      query: { sorters: [{ field: 'id', direction: 'desc' }] },
      persist: { area: 'local', prefix: 'myapp' },
    });
    const stock = Array.from({ length: 5000 }, (_, i) => ({ id: i + 1, name: `Item ${i + 1}`, qty: (i * 37) % 1000, kind: ['tool', 'part', 'kit'][i % 3], ok: i % 2 === 0, score: 1 + (i % 5), note: i === 0 ? 'locked' : '' }));
    grid.setSource(document.getElementById('dg-edit'), stock, {
      // a custom editor: a select of 1-5 (immediate), and a cell that does not edit
      getEditorFn: (field, value, ctx) => {
        if (ctx.record.note === 'locked' && field === 'name') return false;
        if (field !== 'score') return null;
        const el = document.createElement('select');
        el.className = 'select score-editor';
        for (let n = 1; n <= 5; n++) el.append(new Option(String(n), String(n), false, n === value));
        return { el, immediate: true, getValue: () => Number(el.value) };
      },
      validateFn: (field, value) => (field === 'name' && /!/.test(value) ? 'No exclamation marks' : undefined),
    });
    const parts = () => Array.from({ length: 300 }, (_, i) => ({ id: i + 1, name: `Part ${i + 1}`, qty: (i * 13) % 50, kind: ['tool', 'part', 'kit'][i % 3], note: i % 2 ? 'odd' : 'even' }));
    for (const id of ['dg-cells', 'dg-cols', 'dg-both', 'dg-check']) grid.setSource(document.getElementById(id), parts());
    const tasks = (from, n) => Array.from({ length: n }, (_, i) => ({ id: from + i, title: `Task ${from + i}`, points: ((from + i) * 3) % 8 }));
    grid.setSource(document.getElementById('dg-from'), tasks(1, 20));
    grid.setSource(document.getElementById('dg-to'), tasks(101, 3));
    grid.setSource(document.getElementById('dg-tree-dnd'), [
      { id: 1, parentId: null, name: 'Docs', kind: 'folder' },
      { id: 2, parentId: 1, name: 'a.txt', kind: 'file' },
      { id: 3, parentId: 1, name: 'Old', kind: 'folder' },
      { id: 4, parentId: 3, name: 'b.txt', kind: 'file' },
      { id: 5, parentId: null, name: 'Music', kind: 'folder' },
    ], { query: { expanded: [1, 3, 5] } });
    // a Data Tree takes a tree grid's rows (its data-drag="copy": it gives copies only)
    globalThis.df$.shadcn.dataTree.setSource(document.getElementById('dt-drop'), [{ id: 'arch', parentId: null, name: 'Archive' }]);
    globalThis.__fixtureReady = true;
  </script>
</body>
</html>
