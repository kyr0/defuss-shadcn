<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>breadcrumb e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/breadcrumb/breadcrumb.css" />
  </head>
  <body style="padding:2rem;">
    <!-- mirrors the doc page: nav > ol > links, separators, ellipsis, current page -->
    <nav aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item"><a class="breadcrumb-link" href="#">Home</a></li>
        <li class="breadcrumb-item"><span class="breadcrumb-separator" aria-hidden="true">/</span></li>
        <li class="breadcrumb-item"><span class="breadcrumb-ellipsis" aria-hidden="true">…</span></li>
        <li class="breadcrumb-item"><span class="breadcrumb-separator" aria-hidden="true">/</span></li>
        <li class="breadcrumb-item"><span class="breadcrumb-page" aria-current="page">Current</span></li>
      </ol>
    </nav>
    <!-- custom icon separators (the doc page's chevron variant) -->
    <nav aria-label="Breadcrumb icons">
      <ol class="breadcrumb-list" id="icon-crumbs">
        <li class="breadcrumb-item"><a class="breadcrumb-link" href="#">Home</a></li>
        <li class="breadcrumb-separator" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></li>
        <li class="breadcrumb-item"><span class="breadcrumb-page" aria-current="page">Current</span></li>
      </ol>
    </nav>

    <!-- sizes: type scales 12/13/14/16/18px on the .breadcrumb-list -->
    <nav class="breadcrumb" id="bc-xs" data-size="xs" style="margin-top:1rem;"><ol class="breadcrumb-list"><li class="breadcrumb-item"><span class="breadcrumb-page">xs</span></li></ol></nav>
    <nav class="breadcrumb" id="bc-sm" data-size="sm" style="margin-top:1rem;"><ol class="breadcrumb-list"><li class="breadcrumb-item"><span class="breadcrumb-page">sm</span></li></ol></nav>
    <nav class="breadcrumb" id="bc-md" data-size="md" style="margin-top:1rem;"><ol class="breadcrumb-list"><li class="breadcrumb-item"><span class="breadcrumb-page">md</span></li></ol></nav>
    <nav class="breadcrumb" id="bc-lg" data-size="lg" style="margin-top:1rem;"><ol class="breadcrumb-list"><li class="breadcrumb-item"><span class="breadcrumb-page">lg</span></li></ol></nav>
    <nav class="breadcrumb" id="bc-xl" data-size="xl" style="margin-top:1rem;"><ol class="breadcrumb-list"><li class="breadcrumb-item"><span class="breadcrumb-page">xl</span></li></ol></nav>
  </body>
</html>
