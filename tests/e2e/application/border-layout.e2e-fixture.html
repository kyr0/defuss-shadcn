<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Border Layout e2e fixture</title>
  <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css">
  <link rel="stylesheet" href="/dist/components/resizer/resizer.css">
  <link rel="stylesheet" href="/dist/components/border-layout/border-layout.css">
  <link rel="stylesheet" href="/dist/components/card/card.css">
  <link rel="stylesheet" href="/dist/components/swap/swap.css">
  <link rel="stylesheet" href="/dist/components/panel/panel.css">
  <style>
    /* spacing only - never properties the checks assert */
    body { font-family: system-ui, sans-serif; padding: 1rem; margin: 0; }
    .border-layout { width: 800px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <!-- mirrors the doc page: five regions (ns and we dominant), splits,
       percent starts, a fixed region, grips, divider styles, gap,
       collapsible + saved, stacks of panels on one side -->
  <div class="border-layout" id="bl" data-collapsible style="height:400px;">
    <div class="resizer border-layout-north" id="n"><header id="n-pane" style="height:50px" aria-label="North">N</header></div>
    <div class="resizer border-layout-west" id="w"><nav id="w-pane" style="width:160px" aria-label="Files">W</nav></div>
    <main class="border-layout-center" id="c">C</main>
    <div class="resizer border-layout-east" id="e"><aside id="e-pane" style="width:140px" aria-label="Inspector">E</aside></div>
    <div class="resizer border-layout-south" id="s"><footer id="s-pane" style="height:80px" aria-label="Terminal">S</footer></div>
  </div>
  <div class="border-layout" id="we" data-dominant="we" style="height:240px;">
    <div class="resizer border-layout-north" id="we-n"><div style="height:40px">N</div></div>
    <div class="resizer border-layout-west" id="we-w"><div style="width:120px">W</div></div>
    <div class="border-layout-center">C</div>
    <div class="resizer border-layout-east" id="we-e"><div style="width:120px">E</div></div>
  </div>
  <div class="border-layout" id="hs" style="height:120px;">
    <div class="resizer border-layout-west" id="hs-w"><div id="hs-pane" style="width:50%">One</div></div>
    <div class="border-layout-center" id="hs-c">Two</div>
  </div>
  <div class="border-layout" id="fixed" data-divider="dashed" data-grip="dots" style="height:120px;">
    <div class="border-layout-north" id="fx-n" style="height:30px">fixed</div>
    <div class="resizer border-layout-west" id="fx-w"><div style="width:120px">dashed + dots</div></div>
    <div class="border-layout-center">C</div>
    <div class="resizer border-layout-east" id="fx-e" data-grip="none" data-divider="double"><div style="width:120px">no grip, double</div></div>
  </div>
  <div class="border-layout" id="gap" data-divider="gap" style="height:120px;">
    <div class="resizer border-layout-west"><div id="gap-pane" style="width:120px">gap</div></div>
    <div class="border-layout-center" id="gap-c">C</div>
  </div>
  <!-- data-fit: fixed regions sized by their content - a south list (half the layout at most), a north with its own
       bounds (a fifth at least, two fifths at most) -->
  <div class="border-layout" id="fit" style="height:302px;">
    <div class="border-layout-north" id="fit-n" data-fit style="--border-layout-fit-min: 20cqh; --border-layout-fit-max: 40cqh"><p id="fit-n-text" style="margin:0;line-height:20px">One line</p></div>
    <div class="border-layout-center" id="fit-c">C</div>
    <ul class="border-layout-south" id="fit-s" data-fit style="margin:0;padding:0;list-style:none"><li style="height:20px">1</li><li style="height:20px">2</li></ul>
  </div>
  <div class="border-layout" id="saved" data-save="e2e" data-collapsible style="height:120px;">
    <div class="resizer border-layout-west" id="sv-w"><div id="sv-pane" style="width:150px">saved</div></div>
    <div class="border-layout-center">C</div>
  </div>

  <div class="border-layout" id="stk" style="height:480px;">
    <div class="resizer border-layout-west" id="stk-w">
      <div class="border-layout-stack" id="stk-w-stack" style="width:220px" aria-label="Side panels">
      <section class="card panel" id="sp1" aria-labelledby="sp1-t">
        <header class="panel-header">
          <h3 class="panel-title" id="sp1-t">Tree</h3>
          <div class="panel-tools">
            <label class="swap panel-minimize"><input type="checkbox" aria-label="Minimize Tree"><span class="swap-off">-</span><span class="swap-on">+</span></label>
          </div>
        </header>
        <div class="panel-body">branches</div>
      </section>
      <section class="card panel" id="sp2" aria-labelledby="sp2-t">
        <header class="panel-header">
          <h3 class="panel-title" id="sp2-t">Updates</h3>
          <div class="panel-tools">
            <label class="swap panel-minimize"><input type="checkbox" aria-label="Minimize Updates"><span class="swap-off">-</span><span class="swap-on">+</span></label>
          </div>
        </header>
        <div class="panel-body">newest first</div>
      </section>
      <section class="card panel" id="sp3" aria-labelledby="sp3-t" data-min="60">
        <header class="panel-header">
          <h3 class="panel-title" id="sp3-t">Notes</h3>
          <div class="panel-tools">
            <label class="swap panel-minimize"><input type="checkbox" aria-label="Minimize Notes"><span class="swap-off">-</span><span class="swap-on">+</span></label>
          </div>
        </header>
        <div class="panel-body">a note</div>
      </section>
      </div>
    </div>
    <div class="border-layout-center" id="stk-c">C</div>
    <div class="resizer border-layout-south" id="stk-s">
      <div class="border-layout-stack" id="stk-s-stack" style="height:110px">
      <section class="card panel" id="sq1" aria-labelledby="sq1-t">
        <header class="panel-header">
          <h3 class="panel-title" id="sq1-t">Console</h3>
          <div class="panel-tools">
            <label class="swap panel-minimize"><input type="checkbox" aria-label="Minimize Console"><span class="swap-off">-</span><span class="swap-on">+</span></label>
          </div>
        </header>
        <div class="panel-body">output</div>
      </section>
      <section class="card panel" id="sq2" aria-labelledby="sq2-t">
        <header class="panel-header">
          <h3 class="panel-title" id="sq2-t">Problems</h3>
          <div class="panel-tools">
            <label class="swap panel-minimize"><input type="checkbox" aria-label="Minimize Problems"><span class="swap-off">-</span><span class="swap-on">+</span></label>
          </div>
        </header>
        <div class="panel-body">none</div>
      </section>
      </div>
    </div>
  </div>

  <!-- data-exclusive: one panel open at a time - both start minimized, the region folded to vertical tabs -->
  <div class="border-layout" id="exc" style="height:300px;">
    <div class="border-layout-center">C</div>
    <div class="resizer border-layout-east" id="exc-e">
      <div class="border-layout-stack" id="exc-stack" style="width:200px" data-exclusive>
      <section class="card panel" id="ex1" aria-labelledby="ex1-t" data-minimized>
        <header class="panel-header">
          <h3 class="panel-title" id="ex1-t">Inspector</h3>
          <div class="panel-tools">
            <label class="swap panel-minimize"><input type="checkbox" aria-label="Minimize Inspector"><span class="swap-off">-</span><span class="swap-on">+</span></label>
          </div>
        </header>
        <div class="panel-body">props</div>
      </section>
      <section class="card panel" id="ex2" aria-labelledby="ex2-t" data-minimized>
        <header class="panel-header">
          <h3 class="panel-title" id="ex2-t">Outline</h3>
          <div class="panel-tools">
            <label class="swap panel-minimize"><input type="checkbox" aria-label="Minimize Outline"><span class="swap-off">-</span><span class="swap-on">+</span></label>
          </div>
        </header>
        <div class="panel-body">headings</div>
      </section>
      </div>
    </div>
  </div>

  <!-- data-direction="row": side by side on the east side, a minimized panel a vertical tab; exclusive: of the two
       authored open the last stays open -->
  <div class="border-layout" id="row" style="height:240px;">
    <div class="border-layout-center">C</div>
    <div class="resizer border-layout-east" id="row-e">
      <div class="border-layout-stack" id="row-stack" style="width:340px" data-direction="row" data-exclusive>
      <section class="card panel" id="rw1" aria-labelledby="rw1-t">
        <header class="panel-header">
          <h3 class="panel-title" id="rw1-t">Chat</h3>
          <div class="panel-tools">
            <label class="swap panel-minimize"><input type="checkbox" aria-label="Minimize Chat"><span class="swap-off">-</span><span class="swap-on">+</span></label>
          </div>
        </header>
        <div class="panel-body">messages</div>
      </section>
      <section class="card panel" id="rw2" aria-labelledby="rw2-t">
        <header class="panel-header">
          <h3 class="panel-title" id="rw2-t">Notes</h3>
          <div class="panel-tools">
            <label class="swap panel-minimize"><input type="checkbox" aria-label="Minimize Notes"><span class="swap-off">-</span><span class="swap-on">+</span></label>
          </div>
        </header>
        <div class="panel-body">a note</div>
      </section>
      <section class="card panel" id="rw3" aria-labelledby="rw3-t" data-minimized>
        <header class="panel-header">
          <h3 class="panel-title" id="rw3-t">History</h3>
          <div class="panel-tools">
            <label class="swap panel-minimize"><input type="checkbox" aria-label="Minimize History"><span class="swap-off">-</span><span class="swap-on">+</span></label>
          </div>
        </header>
        <div class="panel-body">yesterday</div>
      </section>
      </div>
    </div>
  </div>

  <script type="module" src="/dist/components/core.js"></script>
  <script type="module" src="/dist/components/resizer/resizer.js"></script>
  <script type="module" src="/dist/components/swap/swap.js"></script>
  <script type="module" src="/dist/components/panel/panel.js"></script>
  <script type="module" src="/dist/components/border-layout/border-layout.js"></script>
</body>
</html>
