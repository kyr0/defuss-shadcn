<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>typography e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/typography/typography.css" />
  </head>
  <!-- the component also styles <body> (base layer): 14px / 1.5 -->
  <body style="padding:2rem;">
    <!-- mirrors the doc page: the whole prose scale -->
    <h1 class="h1" id="ty-h1">Heading 1</h1>
    <h2 class="h2" id="ty-h2">Heading 2</h2>
    <h3 class="h3" id="ty-h3">Heading 3</h3>
    <h4 class="h4" id="ty-h4">Heading 4</h4>
    <p class="p" id="ty-p">Body copy paragraph.</p>
    <p class="lead" id="ty-lead">Lead text.</p>
    <p class="large" id="ty-large">Large text.</p>
    <p class="small" id="ty-small">Small text.</p>
    <p class="muted" id="ty-muted">Muted text.</p>
    <blockquote class="blockquote" id="ty-quote"><p>Quoted text.</p></blockquote>
    <p>Inline <code class="inline-code" id="ty-code">code</code> sample.</p>
  </body>
</html>
