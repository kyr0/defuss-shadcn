<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>event-countdown e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/theme/utils/layout.css" />
    <link rel="stylesheet" href="/dist/theme/utils/accessibility.css" />
    <link rel="stylesheet" href="/dist/components/countdown/countdown.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/event-countdown/event-countdown.css" />
    <style>body { padding: 2rem; margin: 0; font-family: sans-serif; } body > section.fx { margin-block-end: 3rem; }</style>
  </head>
  <body>
    <!-- Default -->
    <section class="fx">
<section class="mk-event-countdown" aria-labelledby="ec-1">
  <div class="mk-event-countdown-inner">
    <span class="mk-event-countdown-eyebrow">Acme Summit 2026</span>
    <h2 class="mk-event-countdown-title" id="ec-1">Doors open in</h2>
    <div class="countdown-group mk-event-countdown-timer" data-until="2026-11-12T09:00:00Z">
      <div class="countdown-unit" data-variant="muted"><span class="countdown" data-size="xl"><span data-unit="days" style="--value:41">41</span></span><span class="countdown-label">days</span></div>
      <div class="countdown-unit" data-variant="muted"><span class="countdown" data-size="xl" data-digits="2"><span data-unit="hours" style="--value:9">09</span></span><span class="countdown-label">hours</span></div>
      <div class="countdown-unit" data-variant="muted"><span class="countdown" data-size="xl" data-digits="2"><span data-unit="minutes" style="--value:30">30</span></span><span class="countdown-label">min</span></div>
      <div class="countdown-unit" data-variant="muted"><span class="countdown" data-size="xl" data-digits="2"><span data-unit="seconds" style="--value:0">00</span></span><span class="countdown-label">sec</span></div>
    </div>
    <span class="mk-event-countdown-date"><i data-lucide="calendar"></i><time datetime="2026-11-12T09:00Z">12 November 2026, 09:00 UTC</time> · Lisbon</span>
    <a class="btn" data-size="lg" href="#">Get your ticket</a>
  </div>
</section>
    </section>
    <!-- Dark -->
    <section class="fx">
<section class="mk-event-countdown" data-variant="dark" aria-labelledby="ec-2">
  <div class="mk-event-countdown-inner">
    <span class="mk-event-countdown-eyebrow">Launch</span>
    <h2 class="mk-event-countdown-title" id="ec-2">Acme Spaces goes live</h2>
    <div class="countdown-group mk-event-countdown-timer" data-until="2026-11-12T16:00:00Z">
      <div class="countdown-unit" data-variant="muted"><span class="countdown" data-size="xl"><span data-unit="days" style="--value:41">41</span></span><span class="countdown-label">days</span></div>
      <div class="countdown-unit" data-variant="muted"><span class="countdown" data-size="xl" data-digits="2"><span data-unit="hours" style="--value:9">09</span></span><span class="countdown-label">hours</span></div>
      <div class="countdown-unit" data-variant="muted"><span class="countdown" data-size="xl" data-digits="2"><span data-unit="minutes" style="--value:30">30</span></span><span class="countdown-label">min</span></div>
      <div class="countdown-unit" data-variant="muted"><span class="countdown" data-size="xl" data-digits="2"><span data-unit="seconds" style="--value:0">00</span></span><span class="countdown-label">sec</span></div>
    </div>
    <span class="mk-event-countdown-date"><time datetime="2026-11-12T16:00Z">12 Nov, 16:00 UTC</time></span>
  </div>
</section>
    </section>
    <!-- Inline -->
    <section class="fx">
<section class="mk-event-countdown" data-variant="inline" aria-labelledby="ec-3">
  <div class="mk-event-countdown-inner">
    <h2 class="mk-event-countdown-title" id="ec-3">Early-bird ends in</h2>
    <div class="countdown-group mk-event-countdown-timer" data-until="2026-10-31T23:59:59Z">
      <div class="countdown-unit" data-variant="muted"><span class="countdown" data-size="xl"><span data-unit="days" style="--value:41">41</span></span><span class="countdown-label">days</span></div>
      <div class="countdown-unit" data-variant="muted"><span class="countdown" data-size="xl" data-digits="2"><span data-unit="hours" style="--value:9">09</span></span><span class="countdown-label">hours</span></div>
      <div class="countdown-unit" data-variant="muted"><span class="countdown" data-size="xl" data-digits="2"><span data-unit="minutes" style="--value:30">30</span></span><span class="countdown-label">min</span></div>
      <div class="countdown-unit" data-variant="muted"><span class="countdown" data-size="xl" data-digits="2"><span data-unit="seconds" style="--value:0">00</span></span><span class="countdown-label">sec</span></div>
    </div>
    <a class="btn" data-size="sm" href="#">Save 30%</a>
  </div>
</section>
    </section>
  </body>
</html>
