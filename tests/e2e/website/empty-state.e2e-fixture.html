<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>empty-state e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/theme/utils/layout.css" />
    <link rel="stylesheet" href="/dist/theme/utils/accessibility.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/empty-state/empty-state.css" />
    <style>body { padding: 2rem; margin: 0; font-family: sans-serif; } body > section.fx { margin-block-end: 3rem; }</style>
  </head>
  <body>
    <!-- Default -->
    <section class="fx">
<section class="mk-empty-state" aria-labelledby="es-1">
  <span class="mk-empty-state-icon" aria-hidden="true"><i data-lucide="folder-open"></i></span>
  <h2 class="mk-empty-state-title" id="es-1">No projects yet</h2>
  <p class="mk-empty-state-text">Projects keep plans, docs and tasks together. Create one, or start from a template.</p>
  <div class="mk-empty-state-actions"><a class="btn" href="#"><i data-lucide="plus"></i> New project</a><a class="btn" data-variant="outline" href="#">Browse templates</a></div>
</section>
    </section>
    <!-- Dashed -->
    <section class="fx">
<section class="mk-empty-state" data-variant="dashed" aria-labelledby="es-2">
  <span class="mk-empty-state-icon" aria-hidden="true"><i data-lucide="upload-cloud"></i></span>
  <h2 class="mk-empty-state-title" id="es-2">Drop files to attach them</h2>
  <p class="mk-empty-state-text">PDF, images or docs up to 50 MB.</p>
  <div class="mk-empty-state-actions"><a class="btn" data-variant="outline" href="#">Choose files</a></div>
</section>
    </section>
    <!-- Compact -->
    <section class="fx">
<div style="border:1px solid var(--border);border-radius:var(--radius-lg);width:100%">
  <section class="mk-empty-state" data-variant="compact" aria-labelledby="es-3">
    <span class="mk-empty-state-icon" aria-hidden="true"><i data-lucide="search-x"></i></span>
    <h2 class="mk-empty-state-title" id="es-3">No tasks match "launch"</h2>
    <p class="mk-empty-state-text">Try another word or clear the filters.</p>
    <div class="mk-empty-state-actions"><a class="btn" data-variant="ghost" data-size="sm" href="#">Clear filters</a></div>
  </section>
</div>
    </section>
  </body>
</html>
