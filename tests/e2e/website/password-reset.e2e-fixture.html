<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>password-reset e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/theme/utils/layout.css" />
    <link rel="stylesheet" href="/dist/theme/utils/accessibility.css" />
    <link rel="stylesheet" href="/dist/components/input/input.css" />
    <link rel="stylesheet" href="/dist/components/label/label.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/password-reset/password-reset.css" />
    <style>body { padding: 2rem; margin: 0; font-family: sans-serif; } body > section.fx { margin-block-end: 3rem; }</style>
  </head>
  <body>
    <!-- Default -->
    <section class="fx">
<section class="mk-password-reset" aria-labelledby="pr-title">
  <div class="mk-password-reset-head"><span class="mk-password-reset-icon"><i data-lucide="lock-keyhole"></i></span><h1 id="pr-title">Set a new password</h1><p>For anna@example.com</p></div>
  <form action="#" method="post">
    <div class="mk-auth-field"><label class="label" for="pr-new">New password</label><input class="input" id="pr-new" type="password" name="password" autocomplete="new-password" minlength="12" required aria-describedby="pr-rules"><ul class="mk-password-reset-rules" id="pr-rules"><li>12 characters or more</li><li>Not one you used before</li></ul></div>
    <div class="mk-auth-field"><label class="label" for="pr-confirm">Confirm new password</label><input class="input" id="pr-confirm" type="password" name="confirm" autocomplete="new-password" minlength="12" required></div>
    <button class="btn" type="submit">Update password</button>
  </form>
</section>
    </section>
    <!-- Done -->
    <section class="fx">
<section class="mk-password-reset" data-variant="done" role="status" aria-labelledby="pr2-title">
  <div class="mk-password-reset-head"><span class="mk-password-reset-icon"><i data-lucide="check"></i></span><h1 id="pr2-title">Password updated</h1><p>We signed you out on your other devices.</p></div>
  <a class="btn" href="#">Sign in</a>
</section>
    </section>
  </body>
</html>
