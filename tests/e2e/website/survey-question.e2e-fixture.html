<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>survey-question e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/theme/utils/layout.css" />
    <link rel="stylesheet" href="/dist/theme/utils/accessibility.css" />
    <link rel="stylesheet" href="/dist/components/progress/progress.css" />
    <link rel="stylesheet" href="/dist/components/textarea/textarea.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/label/label.css" />
    <link rel="stylesheet" href="/dist/components/survey-question/survey-question.css" />
    <style>body { padding: 2rem; margin: 0; font-family: sans-serif; } body > section.fx { margin-block-end: 3rem; }</style>
  </head>
  <body>
    <!-- Single choice -->
    <section class="fx">
<form class="mk-survey-question" action="#" method="post">
  <div class="mk-survey-question-meta"><span>Question 3 of 8</span><progress class="progress" value="3" max="8" aria-label="Survey progress">3 of 8</progress></div>
  <fieldset>
    <legend>How big is your team?</legend>
    <label class="mk-survey-question-option"><input type="radio" name="team" value="0" required>Just me</label>
    <label class="mk-survey-question-option"><input type="radio" name="team" value="1" checked required>2–10 people</label>
    <label class="mk-survey-question-option"><input type="radio" name="team" value="2" required>11–50 people</label>
    <label class="mk-survey-question-option"><input type="radio" name="team" value="3" required>More than 50</label>
  </fieldset>
  <div class="mk-survey-question-actions"><button class="btn" data-variant="ghost" type="button">Back</button><button class="btn" type="submit">Next</button></div>
</form>
    </section>
    <!-- Multiple choice -->
    <section class="fx">
<form class="mk-survey-question" data-variant="multiple" action="#" method="post">
  <div class="mk-survey-question-meta"><span>Question 4 of 8</span><progress class="progress" value="4" max="8" aria-label="Survey progress">4 of 8</progress></div>
  <fieldset aria-describedby="sq-hint">
    <legend>Which tools does your team use today?</legend>
    <p class="mk-survey-question-hint" id="sq-hint">Choose all that apply.</p>
    <label class="mk-survey-question-option"><input type="checkbox" name="tools" value="0" checked>Spreadsheets</label>
    <label class="mk-survey-question-option"><input type="checkbox" name="tools" value="1" checked>A wiki</label>
    <label class="mk-survey-question-option"><input type="checkbox" name="tools" value="2">A task tracker</label>
    <label class="mk-survey-question-option"><input type="checkbox" name="tools" value="3">Chat only</label>
  </fieldset>
  <div class="mk-survey-question-actions"><button class="btn" data-variant="ghost" type="button">Back</button><button class="btn" type="submit">Next</button></div>
</form>
    </section>
    <!-- Scale -->
    <section class="fx">
<form class="mk-survey-question" data-variant="scale" action="#" method="post">
  <div class="mk-survey-question-meta"><span>Question 5 of 8</span><progress class="progress" value="5" max="8" aria-label="Survey progress">5 of 8</progress></div>
  <fieldset>
    <legend>"Planning takes less time than before."</legend>
    <div class="mk-survey-question-scale"><label class="mk-survey-question-option"><input type="radio" name="agree" value="1" required>Strongly disagree</label><label class="mk-survey-question-option"><input type="radio" name="agree" value="2" required>Disagree</label><label class="mk-survey-question-option"><input type="radio" name="agree" value="3" required>Neutral</label><label class="mk-survey-question-option"><input type="radio" name="agree" value="4" checked required>Agree</label><label class="mk-survey-question-option"><input type="radio" name="agree" value="5" required>Strongly agree</label></div>
  </fieldset>
  <div class="mk-survey-question-actions"><button class="btn" data-variant="ghost" type="button">Back</button><button class="btn" type="submit">Next</button></div>
</form>
    </section>
    <!-- Written answer -->
    <section class="fx">
<form class="mk-survey-question" data-variant="text" action="#" method="post">
  <div class="mk-survey-question-meta"><span>Question 8 of 8</span><progress class="progress" value="8" max="8" aria-label="Survey progress">8 of 8</progress></div>
  <fieldset>
    <legend><label for="sq-text">What would make Acme indispensable for you?</label></legend>
    <p class="mk-survey-question-hint">A sentence or two is plenty.</p>
    <textarea class="textarea" id="sq-text" name="answer" maxlength="500"></textarea>
  </fieldset>
  <div class="mk-survey-question-actions"><button class="btn" data-variant="ghost" type="button">Back</button><button class="btn" type="submit">Finish</button></div>
</form>
    </section>
  </body>
</html>
