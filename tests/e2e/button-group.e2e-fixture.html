<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>button-group e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/button-group/button-group.css" />
  </head>
  <body style="padding:2rem;">
    <!-- mirrors the doc page: horizontal group, separator, vertical group -->
    <div class="btn-group" id="bg-horizontal">
      <button class="btn" id="bg-left">Left</button>
      <button class="btn" id="bg-right">Right</button>
    </div>

    <div class="btn-group" id="bg-separator">
      <button class="btn" data-variant="outline">Save</button>
      <hr role="separator">
      <button class="btn" data-variant="outline" data-size="icon" aria-label="More options">v</button>
    </div>

    <div class="btn-group" id="bg-vertical" data-orientation="vertical">
      <button class="btn" id="bg-v-top">Bold</button>
      <button class="btn" id="bg-v-mid">Italic</button>
      <button class="btn" id="bg-v-bottom">Underline</button>
    </div>

    <!-- full size ladder (doc page "Sizes" demo): size rides on the .btn children -->
    <div class="btn-group" id="bg-xs"><button class="btn" data-size="xs">Save</button><button class="btn" data-size="xs">Edit</button></div>
    <div class="btn-group" id="bg-sm"><button class="btn" data-size="sm">Save</button><button class="btn" data-size="sm">Edit</button></div>
    <div class="btn-group" id="bg-md"><button class="btn" data-size="md">Save</button><button class="btn" data-size="md">Edit</button></div>
    <div class="btn-group" id="bg-lg"><button class="btn" data-size="lg">Save</button><button class="btn" data-size="lg">Edit</button></div>
    <div class="btn-group" id="bg-xl"><button class="btn" data-size="xl">Save</button><button class="btn" data-size="xl">Edit</button></div>
  </body>
</html>
