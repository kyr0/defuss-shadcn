<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>card e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/card/card.css" />
  </head>
  <body style="padding:2rem;">
    <!-- mirrors the doc page: full composition + a narrow container for the @container query -->
    <div style="width:400px;">
      <div class="card" id="card-full">
        <div class="card-header">
          <h3 class="card-title">Title</h3>
          <p class="card-description">Description</p>
        </div>
        <div class="card-content"><p>Body</p></div>
        <div class="card-footer"><button class="btn">Review</button></div>
      </div>
    </div>
    <div style="width:200px;margin-top:1rem;">
      <div class="card" id="card-narrow">
        <div class="card-header"><h3 class="card-title">Narrow</h3></div>
        <div class="card-content"><p>Body</p></div>
      </div>
    </div>
      <div class="card" id="cd-compact" data-density="compact" style="max-width:18rem;margin-top:1rem;"><div class="card-header"><h3 class="card-title">Density compact</h3><p class="card-description">Section paddings scale.</p></div><div class="card-content"><p>Body</p></div><div class="card-footer"><span>Footer</span></div></div>
    <div class="card" id="cd-comfortable" data-density="comfortable" style="max-width:18rem;margin-top:1rem;"><div class="card-header"><h3 class="card-title">Density comfortable</h3><p class="card-description">Section paddings scale.</p></div><div class="card-content"><p>Body</p></div><div class="card-footer"><span>Footer</span></div></div>
    <div class="card" id="cd-spacious" data-density="spacious" style="max-width:18rem;margin-top:1rem;"><div class="card-header"><h3 class="card-title">Density spacious</h3><p class="card-description">Section paddings scale.</p></div><div class="card-content"><p>Body</p></div><div class="card-footer"><span>Footer</span></div></div>
</body>
</html>
