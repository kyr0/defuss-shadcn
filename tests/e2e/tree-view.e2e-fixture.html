<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tree-view e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/tree-view/tree-view.css" />
  </head>
  <body style="padding:2rem;">
    <!-- mirrors the doc page: an open branch containing a closed branch + leaves -->
    <ul class="tree" role="tree" aria-label="File explorer" id="tv-demo" style="width:16rem;">
      <li class="tree-item" role="treeitem" aria-expanded="true">
        <details class="tree-branch" open id="tv-src">
          <summary class="tree-branch-trigger" tabindex="0">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6" /></svg>
            <span>src</span>
          </summary>
          <ul class="tree-group" role="group">
            <li class="tree-item" role="treeitem" aria-expanded="false">
              <details class="tree-branch" id="tv-components">
                <summary class="tree-branch-trigger" tabindex="0">
                  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6" /></svg>
                  <span>components</span>
                </summary>
                <ul class="tree-group" role="group">
                  <li class="tree-item" role="treeitem">
                    <span class="tree-leaf" tabindex="0"><span>button.tsx</span></span>
                  </li>
                  <li class="tree-item" role="treeitem">
                    <span class="tree-leaf" tabindex="0"><span>dialog.tsx</span></span>
                  </li>
                </ul>
              </details>
            </li>
            <li class="tree-item" role="treeitem">
              <span class="tree-leaf" tabindex="0"><span>index.ts</span></span>
            </li>
          </ul>
        </details>
      </li>
    </ul>

    <script type="module" src="/dist/components/core.js"></script>
    <script type="module" src="/dist/components/tree-view/tree-view.js"></script>
      <ul class="tree" role="tree" aria-label="Density compact" id="tvd-compact" data-density="compact" style="width:16rem;margin-top:1rem;"><li class="tree-item" role="treeitem" aria-expanded="true"><details class="tree-branch" open><summary class="tree-branch-trigger" tabindex="0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg><span>src</span></summary><ul class="tree-group" role="group"><li class="tree-item" role="treeitem"><span class="tree-leaf" tabindex="0"><span>a.ts</span></span></li></ul></details></li></ul>
    <ul class="tree" role="tree" aria-label="Density comfortable" id="tvd-comfortable" data-density="comfortable" style="width:16rem;margin-top:1rem;"><li class="tree-item" role="treeitem" aria-expanded="true"><details class="tree-branch" open><summary class="tree-branch-trigger" tabindex="0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg><span>src</span></summary><ul class="tree-group" role="group"><li class="tree-item" role="treeitem"><span class="tree-leaf" tabindex="0"><span>a.ts</span></span></li></ul></details></li></ul>
    <ul class="tree" role="tree" aria-label="Density spacious" id="tvd-spacious" data-density="spacious" style="width:16rem;margin-top:1rem;"><li class="tree-item" role="treeitem" aria-expanded="true"><details class="tree-branch" open><summary class="tree-branch-trigger" tabindex="0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg><span>src</span></summary><ul class="tree-group" role="group"><li class="tree-item" role="treeitem"><span class="tree-leaf" tabindex="0"><span>a.ts</span></span></li></ul></details></li></ul>
</body>
</html>
