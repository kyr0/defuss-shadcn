<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>stats e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/badge/badge.css" />
    <link rel="stylesheet" href="/dist/components/avatar/avatar.css" />
    <link rel="stylesheet" href="/dist/components/input/input.css" />
    <link rel="stylesheet" href="/dist/components/separator/separator.css" />
    <link rel="stylesheet" href="/dist/components/stats/stats.css" />
    <style>
      /* docs-utility stand-in (fixtures carry no doc-site CSS) */
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
      body { padding: 2rem; margin: 0; }
    </style>
  </head>
  <body>
    <!-- Default -->
<section class="mk-stats" style="width:100%">
  <div class="mk-stats-layout">
  <div class="mk-stats-copy">
    <div class="mk-stats-head">
      <h2 class="mk-stats-title">Trusted by Teams Everywhere</h2>
      <p class="mk-stats-desc">Acme is helping thousands of creators and companies move faster, work smarter, and deliver with confidence.</p>
    </div>
    <div class="mk-stats-grid">
      <div class="mk-stat">
        <span class="mk-stat-value">12,500+</span>
        <span class="mk-stat-label">Projects completed</span>
        <a href="#" class="btn mk-stat-link" data-variant="link" data-size="default">Our clients</a>
      </div>
      <div class="mk-stat">
        <span class="mk-stat-value">38% faster</span>
        <span class="mk-stat-label">Delivery across teams</span>
        <a href="#" class="btn mk-stat-link" data-variant="link" data-size="default">Learn more</a>
      </div>
      <div class="mk-stat">
        <span class="mk-stat-value">94%</span>
        <span class="mk-stat-label">User satisfaction</span>
        <a href="#" class="btn mk-stat-link" data-variant="link" data-size="default">See feedback</a>
      </div>
      <div class="mk-stat">
        <span class="mk-stat-value">8 zones</span>
        <span class="mk-stat-label">With active customers</span>
        <a href="#" class="btn mk-stat-link" data-variant="link" data-size="default">Our users</a>
      </div>
    </div>
  </div>
  <figure class="mk-stats-media"><img alt="Team at work" src="/dist/documentation/images/mk-wide.png" /></figure>
  </div>
</section>
  </body>
</html>
