<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>core runtime e2e fixture - component WITHOUT core must fail before mutation</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/dialog/dialog.css" />
    <script>
      // module evaluation errors surface here - the assert reads this array
      window.__errs = [];
      addEventListener('error', function (e) { window.__errs.push(String((e && e.message) || e)); });
    </script>
  </head>
  <body>
    <button class="btn" id="trigger" data-dialog-trigger="demo-dialog">Open dialog</button>
    <dialog id="demo-dialog" class="dialog"><div class="dialog-content">x</div></dialog>

    <!-- deliberately NO core.js: dialog.js must throw the load-order error
         and must NOT stamp data-init or register anything -->
    <script type="module" src="/dist/components/dialog/dialog.js"></script>
  </body>
</html>
