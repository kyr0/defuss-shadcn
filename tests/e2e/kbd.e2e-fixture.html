<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kbd e2e fixture</title>
  <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css">
  <link rel="stylesheet" href="/dist/components/button/button.css">
  <link rel="stylesheet" href="/dist/components/dropdown/dropdown.css">
  <link rel="stylesheet" href="/dist/components/tooltip/tooltip.css">
  <link rel="stylesheet" href="/dist/components/kbd/kbd.css">
  <style>
    /* spacing only — never properties the checks assert */
    body { font-family: system-ui, sans-serif; padding: 2rem; }
    body > * { margin: 0 1rem 1.5rem 0; }
  </style>
</head>
<body>
  <!-- one key -->
  <kbd class="kbd" id="k-default">Esc</kbd>

  <!-- sizes -->
  <kbd class="kbd" id="k-sm" data-size="sm">Esc</kbd>
  <kbd class="kbd" id="k-lg" data-size="lg">Esc</kbd>
  <kbd class="kbd" id="k-pressed" data-pressed>⌘</kbd>

  <!-- a combination: nested <kbd>, as the HTML spec prescribes -->
  <kbd class="kbd-group" id="k-group">
    <kbd class="kbd" id="k-group-1">⌘</kbd>
    <kbd class="kbd" id="k-group-2">K</kbd>
  </kbd>

  <!-- with a "+" between keys -->
  <kbd class="kbd-group" id="k-sep" data-separator>
    <kbd class="kbd" id="k-sep-1">Ctrl</kbd>
    <kbd class="kbd" id="k-sep-2">Shift</kbd>
    <kbd class="kbd" id="k-sep-3">P</kbd>
  </kbd>

  <!-- inside a control, where the key must not out-shout the label -->
  <button class="btn" data-variant="outline" id="k-btn">
    Search
    <kbd class="kbd" id="k-in-btn" data-size="sm">⌘K</kbd>
  </button>

  <!-- the doc page's menu and tooltip: a key on a dropdown item and on the
       tooltip's inverted surface borrows their colour too -->
  <div role="menu" class="dropdown-content" style="position:static;opacity:1;transform:none;display:block;width:14rem;margin-top:1rem;">
    <button role="menuitem" class="dropdown-item" id="k-item" data-variant="destructive" data-highlighted>Delete <span class="dropdown-shortcut"><kbd class="kbd" id="k-in-item" data-size="sm">⌫</kbd></span></button>
  </div>
  <div class="tooltip" id="k-tip" style="position:static;display:inline-block;opacity:1;margin-top:1rem;">Bold <kbd class="kbd" id="k-in-tip" data-size="sm">⌘B</kbd></div>
  <kbd class="kbd" id="k-hidden" aria-hidden="true">⌘K</kbd>
</body>
</html>
