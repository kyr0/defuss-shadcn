<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Window Manager e2e fixture</title>
  <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css">
  <link rel="stylesheet" href="/dist/components/window/window.css">
  <link rel="stylesheet" href="/dist/components/window-manager/window-manager.css">
  <style>
    /* spacing only - never properties the checks assert */
    body { font-family: system-ui, sans-serif; padding: 1rem; margin: 0; display: grid; gap: 1rem; }
  </style>
</head>
<body>
  <!-- mirrors the doc page: a manager with three windows (one closed), a second manager on the same page with
       its own front window -->
  <div class="window-desktop window-manager" id="wm1" style="width: 720px; height: 360px;">
    <dialog class="window" id="w-notes" open style="--window-x: 20px; --window-y: 20px; --window-w: 260px;">
      <header class="window-titlebar">
        <i data-lucide="notebook-pen" class="window-icon"></i>
        <h2 class="window-title">Notes</h2>
        <form method="dialog" class="window-controls">
          <button type="button" class="window-minimize" aria-label="Minimize"></button>
          <button type="button" class="window-maximize" aria-label="Maximize"></button>
          <button class="window-close" aria-label="Close"></button>
        </form>
      </header>
      <div class="window-body">A note</div>
    </dialog>
    <dialog class="window" id="w-files" open style="--window-x: 200px; --window-y: 80px; --window-w: 260px;">
      <header class="window-titlebar">
        <i data-lucide="folder" class="window-icon"></i>
        <h2 class="window-title">Files</h2>
        <form method="dialog" class="window-controls">
          <button type="button" class="window-minimize" aria-label="Minimize"></button>
          <button type="button" class="window-maximize" aria-label="Maximize"></button>
          <button class="window-close" aria-label="Close"></button>
        </form>
      </header>
      <div class="window-body">3 files</div>
    </dialog>
    <dialog class="window" id="w-calc" style="--window-x: 380px; --window-y: 40px; --window-w: 200px;">
      <header class="window-titlebar">
        <i data-lucide="calculator" class="window-icon"></i>
        <h2 class="window-title">Calculator</h2>
        <form method="dialog" class="window-controls">
          <button type="button" class="window-minimize" aria-label="Minimize"></button>
          <button type="button" class="window-maximize" aria-label="Maximize"></button>
          <button class="window-close" aria-label="Close"></button>
        </form>
      </header>
      <div class="window-body">0</div>
    </dialog>
  </div>

  <div class="window-desktop window-manager" id="wm2" style="width: 720px; height: 200px;">
    <dialog class="window" id="w-other" open style="--window-x: 20px; --window-y: 20px; --window-w: 240px;">
      <header class="window-titlebar">
        <h2 class="window-title">Other desktop</h2>
        <form method="dialog" class="window-controls">
          <button type="button" class="window-minimize" aria-label="Minimize"></button>
          <button class="window-close" aria-label="Close"></button>
        </form>
      </header>
      <div class="window-body">Its own front window</div>
    </dialog>
  </div>

  <script type="module" src="/dist/components/core.js"></script>
  <script type="module" src="/dist/components/window/window.js"></script>
  <script type="module" src="/dist/components/window-manager/window-manager.js"></script>
</body>
</html>
