<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start Button e2e fixture</title>
  <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css">
  <link rel="stylesheet" href="/dist/components/start-button/start-button.css">
  <link rel="stylesheet" href="/dist/components/start-menu/start-menu.css">
  <style>
    /* spacing only - never properties the checks assert */
    body { font-family: system-ui, sans-serif; padding: 1rem; margin: 0; min-height: 700px; display: flex; align-items: flex-end; }
  </style>
</head>
<body>
  <!-- mirrors the doc page: the Start Button with icon and label, an icon-only one, and the menu both open -->
  <button class="start-button" id="sb" type="button" popovertarget="start" aria-haspopup="menu">
    <svg class="start-button-icon" viewBox="0 0 16 16"><rect width="16" height="16" /></svg>
    <span class="start-button-label">Start</span>
  </button>
  <button class="start-button" id="sb-icon" data-variant="icon" type="button" popovertarget="start" aria-haspopup="menu">
    <svg class="start-button-icon" viewBox="0 0 16 16"><rect width="16" height="16" /></svg>
    <span class="start-button-label">Start</span>
  </button>
  <div class="start-menu" id="start" popover aria-label="Start">
    <div class="start-menu-head"><span>Ada</span></div>
    <label class="start-menu-search">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" /></svg>
      <input type="search" placeholder="Search apps" aria-label="Search apps">
    </label>
    <p class="start-menu-heading">Pinned</p>
    <div class="start-menu-pinned" role="group" aria-label="Pinned">
      <button class="start-menu-item" type="button" data-value="notes"><span class="start-menu-icon"></span><span class="start-menu-label">Notes</span></button>
      <button class="start-menu-item" type="button" data-value="mail"><span class="start-menu-icon"></span><span class="start-menu-label">Mail</span></button>
    </div>
    <p class="start-menu-heading">All apps</p>
    <div class="start-menu-list" role="group" aria-label="All apps">
      <button class="start-menu-item" id="f-acc" type="button" aria-controls="start-acc"><span class="start-menu-icon"></span><span class="start-menu-label">Accessories</span></button>
      <div class="start-menu-sub" id="start-acc" popover aria-label="Accessories">
        <button class="start-menu-item" type="button" data-value="calculator"><span class="start-menu-label">Calculator</span></button>
        <button class="start-menu-item" id="f-games" type="button" aria-controls="start-games"><span class="start-menu-label">Games</span></button>
        <div class="start-menu-sub" id="start-games" popover aria-label="Games">
          <button class="start-menu-item" type="button" data-value="solitaire"><span class="start-menu-label">Solitaire</span></button>
        </div>
      </div>
      <button class="start-menu-item" type="button" data-value="terminal"><span class="start-menu-icon"></span><span class="start-menu-label">Terminal</span></button>
      <button class="start-menu-item" type="button" data-value="calendar"><span class="start-menu-icon"></span><span class="start-menu-label">Calendar</span></button>
    </div>
    <p class="start-menu-empty" hidden>No results</p>
    <div class="start-menu-foot">
      <button class="start-menu-item" type="button" data-value="settings"><span class="start-menu-label">Settings</span></button>
      <button class="start-menu-item" type="button" data-value="shutdown" aria-label="Shut down"><span class="start-menu-icon"></span></button>
    </div>
  </div>

  <script type="module" src="/dist/components/core.js"></script>
  <script type="module" src="/dist/components/start-menu/start-menu.js"></script>
</body>
</html>
