<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>carousel e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/carousel/carousel.css" />
  </head>
  <body style="padding:2rem;">
    <!-- mirrors the doc page: default carousel with prev/next buttons -->
    <div class="carousel" role="region" aria-roledescription="carousel" aria-label="Default demo" id="car-default" style="max-width:24rem;margin:0 auto;">
      <div class="carousel-viewport" aria-live="polite">
        <div class="carousel-slide" role="group" aria-roledescription="slide" style="flex:0 0 100%;min-height:12rem;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--card);">1</div>
        <div class="carousel-slide" role="group" aria-roledescription="slide" style="flex:0 0 100%;min-height:12rem;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--card);">2</div>
        <div class="carousel-slide" role="group" aria-roledescription="slide" style="flex:0 0 100%;min-height:12rem;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--card);">3</div>
      </div>
      <button class="carousel-prev" aria-label="Previous slide">&lsaquo;</button>
      <button class="carousel-next" aria-label="Next slide">&rsaquo;</button>
    </div>

    <!-- dots + counter (documented compositions) -->
    <div class="carousel" role="region" aria-roledescription="carousel" aria-label="Dots demo" id="car-dots" style="max-width:24rem;margin:2rem auto 0;">
      <div class="carousel-viewport" aria-live="polite">
        <div class="carousel-slide" role="group" aria-roledescription="slide" style="flex:0 0 100%;min-height:12rem;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--card);">A</div>
        <div class="carousel-slide" role="group" aria-roledescription="slide" style="flex:0 0 100%;min-height:12rem;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--card);">B</div>
      </div>
      <div class="carousel-dots" role="group" aria-label="Choose slide to display"></div>
      <div class="carousel-counter" aria-live="polite">Slide 1 of 2</div>
    </div>

    <script type="module" src="/dist/components/core.js"></script>
    <script type="module" src="/dist/components/carousel/carousel.js"></script>
  </body>
</html>
