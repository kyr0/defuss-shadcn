<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>context-menu e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/context-menu/context-menu.css" />
  </head>
  <body style="padding:2rem;">
    <!-- mirrors the doc page: right-click target + menu popover -->
    <div class="context-menu-trigger" data-context-menu="demo-ctx" style="padding:2rem;border:1px dashed var(--border);">
      Right click here
    </div>
    <div class="context-menu" id="demo-ctx" popover>
      <button class="context-menu-item" role="menuitem">Cut</button>
      <button class="context-menu-item" role="menuitem">Copy</button>
      <button class="context-menu-item" role="menuitem">Paste</button>
    </div>

    <script type="module" src="/dist/components/core.js"></script>
    <script type="module" src="/dist/components/context-menu/context-menu.js"></script>
      <button class="context-menu-trigger" id="ctxb-compact" data-context-menu="ctx-compact" style="margin-top:1rem;">Trigger compact</button><div class="context-menu" id="ctx-compact" popover data-density="compact" role="menu"><button class="context-menu-item" role="menuitem">Cut</button><button class="context-menu-item" role="menuitem">Copy</button></div>
    <button class="context-menu-trigger" id="ctxb-comfortable" data-context-menu="ctx-comfortable" style="margin-top:1rem;">Trigger comfortable</button><div class="context-menu" id="ctx-comfortable" popover data-density="comfortable" role="menu"><button class="context-menu-item" role="menuitem">Cut</button><button class="context-menu-item" role="menuitem">Copy</button></div>
    <button class="context-menu-trigger" id="ctxb-spacious" data-context-menu="ctx-spacious" style="margin-top:1rem;">Trigger spacious</button><div class="context-menu" id="ctx-spacious" popover data-density="spacious" role="menu"><button class="context-menu-item" role="menuitem">Cut</button><button class="context-menu-item" role="menuitem">Copy</button></div>
</body>
</html>
