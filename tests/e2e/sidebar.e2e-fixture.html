<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sidebar e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/sidebar/sidebar.css" />
  </head>
  <body style="padding:0;margin:0;display:flex;height:100vh;">
    <!-- mirrors the doc page: collapsible rail with trigger + mobile dialog -->
    <aside class="app-sidebar" id="demo-sidebar" data-state="expanded" style="position:relative;height:100%;">
      <div class="sidebar-header">
        <a class="sidebar-logo" href="#"><span class="sidebar-logo-text">MyApp</span></a>
      </div>
      <div class="sidebar-content">
        <!-- inline SVGs: fixtures don't load the lucide CDN -->
        <nav class="sidebar-nav">
          <a class="sidebar-link" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> <span>Dashboard</span></a>
          <a class="sidebar-link" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg> <span>Inbox</span></a>
          <!-- submenu summary (the cog case): not a .sidebar-link, so its icon
               must be centered by the collapsed rules too -->
          <details class="sidebar-submenu">
            <summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg> <span>Settings</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></summary>
            <nav class="sidebar-nav">
              <a class="sidebar-link" href="#"><span>General</span></a>
            </nav>
          </details>
        </nav>
      </div>
    </aside>

    <div style="flex:1;position:relative;">
      <button data-sidebar-trigger="demo-sidebar" aria-label="Toggle sidebar">Toggle</button>
      <!-- auto-collapse probe: narrow container forces its sidebar to the rail
           (documented behavior: row < 24rem → collapsed, ≥ 28rem → restored) -->
      <div id="narrow-row" style="width:18rem;display:flex;">
        <aside class="app-sidebar" id="demo-auto" style="position:relative;height:12rem;">
          <div class="sidebar-content">
            <nav class="sidebar-nav"><a class="sidebar-link" href="#"><span>Auto</span></a></nav>
          </div>
        </aside>
        <div style="flex:1;"></div>
      </div>
      <!-- tall spacer keeps the document scrollable so the scroll-lock behavior
           (page behind the mobile sheet must stay put) is observable -->
      <div style="height:200vh"></div>
      <!-- documented data-side="right" variant: docks right of the content -->
      <button data-sidebar-trigger="demo-sidebar-right" aria-label="Toggle right sidebar">Toggle Right</button>
    </div>
    <aside class="app-sidebar" id="demo-sidebar-right" data-side="right" data-state="expanded" style="position:relative;height:100%;">
      <div class="sidebar-header">
        <a class="sidebar-logo" href="#"><span class="sidebar-logo-text">RightApp</span></a>
      </div>
      <div class="sidebar-content">
        <nav class="sidebar-nav">
          <a class="sidebar-link" href="#"><span>Dashboard</span></a>
        </nav>
      </div>
    </aside>

    <!-- mobile dialog (documented data-sidebar-mobile axis) -->
    <button data-sidebar-mobile="demo-mobile" aria-label="Open menu">Menu</button>
    <dialog id="demo-mobile" class="sidebar-mobile">
      <button class="sidebar-mobile-close" aria-label="Close">Close</button>
      <div class="sidebar-header">
        <a class="sidebar-logo" href="#"><span class="sidebar-logo-text">MyApp</span></a>
      </div>
      <div class="sidebar-content">
        <nav class="sidebar-nav"><a class="sidebar-link" href="#"><span>Home</span></a></nav>
      </div>
    </dialog>

    <script type="module" src="/dist/components/sidebar/sidebar.js"></script>
      <aside class="app-sidebar" id="sb-compact" data-density="compact" data-state="expanded" style="position:relative;height:14rem;width:14rem;margin-top:1rem;"><div class="sidebar-header"><a class="sidebar-logo" href="#"><span class="sidebar-logo-text">App</span></a></div><div class="sidebar-content"><nav class="sidebar-nav"><a class="sidebar-link" href="#"><span>Dashboard</span></a><a class="sidebar-link" href="#"><span>Inbox</span></a></nav></div></aside>
    <aside class="app-sidebar" id="sb-comfortable" data-density="comfortable" data-state="expanded" style="position:relative;height:14rem;width:14rem;margin-top:1rem;"><div class="sidebar-header"><a class="sidebar-logo" href="#"><span class="sidebar-logo-text">App</span></a></div><div class="sidebar-content"><nav class="sidebar-nav"><a class="sidebar-link" href="#"><span>Dashboard</span></a><a class="sidebar-link" href="#"><span>Inbox</span></a></nav></div></aside>
    <aside class="app-sidebar" id="sb-spacious" data-density="spacious" data-state="expanded" style="position:relative;height:14rem;width:14rem;margin-top:1rem;"><div class="sidebar-header"><a class="sidebar-logo" href="#"><span class="sidebar-logo-text">App</span></a></div><div class="sidebar-content"><nav class="sidebar-nav"><a class="sidebar-link" href="#"><span>Dashboard</span></a><a class="sidebar-link" href="#"><span>Inbox</span></a></nav></div></aside>
</body>
</html>
