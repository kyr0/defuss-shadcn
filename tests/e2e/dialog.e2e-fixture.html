<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dialog e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/dialog/dialog.css" />
  </head>
  <!-- min-height makes the document scrollable so the scroll-lock behavior
       (page behind a modal dialog must stay put) is observable; the spacer
       puts the trigger mid-page so it can be clicked while the page is
       already scrolled — the real user flow for focus-restore on close. -->
  <body style="min-height:250vh">
    <div style="height:70vh"></div>
    <!-- Size coverage: the doc page documents sm/lg/xl/full via data-size;
         the fixture must instantiate every documented size (AGENTS.md
         "Docs ↔ E2E parity"). -->
    <dialog id="size-sm" class="dialog" data-size="sm"><div class="dialog-content">sm</div></dialog>
    <dialog id="size-md" class="dialog" data-size="md"><div class="dialog-content">md</div></dialog>
    <dialog id="size-lg" class="dialog" data-size="lg"><div class="dialog-content">lg</div></dialog>
    <dialog id="size-xl" class="dialog" data-size="xl"><div class="dialog-content">xl</div></dialog>
    <dialog id="size-full" class="dialog" data-size="full"><div class="dialog-content">full</div></dialog>

    <!-- mirrors the doc page: trigger button + modal dialog, default config -->
    <button class="btn" data-variant="default" data-dialog-trigger="demo-dialog" aria-haspopup="dialog">
      Open dialog
    </button>

    <dialog id="demo-dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="demo-title">
      <div class="dialog-content">
        <div class="dialog-header">
          <h2 class="dialog-title" id="demo-title">Edit profile</h2>
          <p class="dialog-description">Make changes to your profile here.</p>
        </div>
        <div class="dialog-footer">
          <button class="btn" data-variant="outline" data-dialog-close>Cancel</button>
          <button class="btn" data-variant="default" data-dialog-close>Save changes</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/dist/components/dialog/dialog.js"></script>
  </body>
</html>
