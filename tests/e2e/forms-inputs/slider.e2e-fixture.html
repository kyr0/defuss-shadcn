<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>slider e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/slider/slider.css" />
  </head>
  <body style="padding:2rem;display:flex;flex-direction:column;gap:2rem;align-items:flex-start;">
    <!-- mirrors the doc page: default slider, custom range, authored disabled -->
    <div style="width:20rem;">
      <input class="slider" id="s-default" type="range" min="0" max="100" value="50" aria-label="Default" />
    </div>
    <div style="width:20rem;">
      <input class="slider" id="s-range" type="range" min="10" max="20" value="15" aria-label="Volume" />
    </div>
    <div style="width:20rem;">
      <input class="slider" id="s-disabled" type="range" min="0" max="100" value="30" disabled aria-label="Disabled" />
    </div>

    <script type="module" src="/dist/components/core.js"></script>
    <script type="module" src="/dist/components/slider/slider.js"></script>
      <input type="range" class="slider" id="z-slider-xs" data-size="xs" value="50" style="margin-top:1rem;" />
    <input type="range" class="slider" id="z-slider-sm" data-size="sm" value="50" style="margin-top:1rem;" />
    <input type="range" class="slider" id="z-slider-md" data-size="md" value="50" style="margin-top:1rem;" />
    <input type="range" class="slider" id="z-slider-lg" data-size="lg" value="50" style="margin-top:1rem;" />
    <input type="range" class="slider" id="z-slider-xl" data-size="xl" value="50" style="margin-top:1rem;" />
  <div style="display:grid;gap:1rem;width:400px;margin-top:1rem;">
    <input class="slider" type="range" id="t-success" data-tone="success" value="50" aria-label="s" />
    <input class="slider" type="range" id="t-warning" data-tone="warning" value="50" aria-label="w" />
    <input class="slider" type="range" id="t-info" data-tone="info" value="50" aria-label="i" />
    <input class="slider" type="range" id="t-destructive" data-tone="destructive" value="50" aria-label="d" />
    <input class="slider" type="range" id="t-custom" value="50" style="--slider-color: rgb(120, 40, 200);" aria-label="c" />
    <div class="slider-field" id="sf"><span class="slider-icon" aria-hidden="true">🌙</span><input class="slider" type="range" id="u-pct" value="40" data-unit="percent" aria-label="Brightness" /><span class="slider-icon" aria-hidden="true">☀️</span><output class="slider-value" id="u-pct-out" for="u-pct"></output></div>
    <input class="slider" type="range" id="u-temp" min="5" max="30" step="0.5" value="21.5" data-unit="celsius" lang="en" aria-label="Temperature" /><output id="u-temp-out" for="u-temp"></output>
    <input class="slider" type="range" id="u-eur" min="0" max="20" value="5" data-currency="EUR" lang="en" aria-label="Tip" /><output id="u-eur-out" for="u-eur"></output>
    <div class="slider-scale" id="scale"><span>0</span><span>100</span></div>
    <input class="slider" type="range" id="emo" value="10" data-thumb-emoji="😫 😐 😄" aria-label="Mood" />
    <div class="slider-range" id="rg" data-currency="EUR" data-min-gap="50" data-size="lg" data-tone="info" lang="en" role="group" aria-label="Price">
      <input class="slider" type="range" id="rg-lo" min="0" max="1000" step="10" value="200" aria-label="Minimum" />
      <input class="slider" type="range" id="rg-hi" min="0" max="1000" step="10" value="800" aria-label="Maximum" />
    </div>
    <output id="rg-out" for="rg-lo rg-hi"></output>
    <div dir="rtl"><input class="slider" type="range" id="rtl" value="30" aria-label="rtl" /></div>
  </div>
  <!-- marks (doc page: Steps with marks) - default size, lg via sibling, lg set on the marks -->
  <div style="width:320px;">
    <input class="slider" type="range" id="mk" min="0" max="100" step="25" value="50">
    <div class="slider-marks" id="mk-marks" aria-hidden="true"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
    <input class="slider" type="range" id="mk-lg" data-size="lg" min="1" max="5" step="1" value="4">
    <div class="slider-marks" id="mk-lg-marks" aria-hidden="true"><span>1</span><span></span><span>3</span><span></span><span>5</span></div>
    <div class="slider-marks" id="mk-apart" data-size="lg" aria-hidden="true"><span>1</span><span>5</span></div>
  </div>
</body>
</html>
