<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>color-picker e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/color-picker/color-picker.css" />
  </head>
  <body style="padding:2rem;display:flex;flex-direction:column;gap:1.5rem;align-items:flex-start;">
    <!-- mirrors the doc page: default picker -->
    <div class="color-picker" id="cp-default">
      <input type="color" id="d-color" value="#6366f1" aria-label="Color" />
      <span class="color-picker-value">#6366f1</span>
    </div>

    <!-- second instance: state must stay per element -->
    <div class="color-picker" id="cp-second">
      <input type="color" id="d-color-2" value="#10b981" aria-label="Color 2" />
      <span class="color-picker-value">#10b981</span>
    </div>

    <!-- notations: authored data-format per picker + a user-switchable one with a form output -->
    <div class="color-picker" id="cp-rgb" data-format="rgb"><input type="color" value="#6366f1" aria-label="rgb" /><span class="color-picker-value"></span></div>
    <div class="color-picker" id="cp-hsl" data-format="hsl"><input type="color" value="#6366f1" aria-label="hsl" /><span class="color-picker-value"></span></div>
    <div class="color-picker" id="cp-oklch" data-format="oklch"><input type="color" value="#6366f1" aria-label="oklch" /><span class="color-picker-value"></span></div>
    <div class="color-picker" id="cp-switch" data-format="oklch">
      <input type="color" value="#0a0a0a" aria-label="Brand colour" />
      <span class="color-picker-value"></span>
      <input type="hidden" name="brand" data-color-output id="cp-switch-out" />
      <select class="color-picker-format" aria-label="Colour notation" id="cp-switch-select">
        <option value="hex">HEX</option><option value="rgb">RGB</option><option value="hsl">HSL</option><option value="oklch">OKLCH</option>
      </select>
    </div>
    <script type="module" src="/dist/components/core.js"></script>
    <script type="module" src="/dist/components/color-picker/color-picker.js"></script>
      <span class="color-picker" id="z-colorpicker-xs" data-size="xs"><input type="color" value="#6366f1" /><span class="color-picker-value">#6366F1</span></span>
    <span class="color-picker" id="z-colorpicker-sm" data-size="sm"><input type="color" value="#6366f1" /><span class="color-picker-value">#6366F1</span></span>
    <span class="color-picker" id="z-colorpicker-md" data-size="md"><input type="color" value="#6366f1" /><span class="color-picker-value">#6366F1</span></span>
    <span class="color-picker" id="z-colorpicker-lg" data-size="lg"><input type="color" value="#6366f1" /><span class="color-picker-value">#6366F1</span></span>
    <span class="color-picker" id="z-colorpicker-xl" data-size="xl"><input type="color" value="#6366f1" /><span class="color-picker-value">#6366F1</span></span>
</body>
</html>
