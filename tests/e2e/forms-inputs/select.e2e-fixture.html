<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>select e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/select/select.css" />
  </head>
  <body style="padding:2rem;">
    <!-- mirrors the doc page: default (clearable placeholder - the empty
         option stays selectable so a selection can be reset, issue #32),
         disabled, invalid, both sizes (parity) -->
    <select class="select" id="se-default">
      <option value="" selected>Choose…</option>
      <option value="one">One</option>
    </select>
    <select class="select" id="se-disabled" disabled style="margin-top:1rem;">
      <option>Disabled</option>
    </select>
    <select class="select" id="se-invalid" aria-invalid="true" style="margin-top:1rem;">
      <option>Invalid</option>
    </select>
    <select class="select" id="se-xs" data-size="xs" style="margin-top:1rem;">
      <option>Extra small</option>
    </select>
    <select class="select" id="se-sm" data-size="sm" style="margin-top:1rem;">
      <option>Small</option>
    </select>
    <select class="select" id="se-md" data-size="md" style="margin-top:1rem;">
      <option>Medium</option>
    </select>
    <select class="select" id="se-lg" data-size="lg" style="margin-top:1rem;">
      <option>Large</option>
    </select>
    <select class="select" id="se-xl" data-size="xl" style="margin-top:1rem;">
      <option>Extra large</option>
    </select>
    <!-- multiple: native list box -->
    <form id="sel-multi-form"><select class="select" id="sel-multi" name="ship" multiple size="4"><option value="at" selected>Austria</option><option value="be">Belgium</option><option value="de" selected>Germany</option><option value="fr">France</option></select></form>
    <!-- unavailable options: one disabled option / a disabled optgroup in a usable list -->
    <form id="sel-size-form">
      <select class="select" id="sel-size" name="size"><option value="" selected>Select a size</option><option value="m">M</option><option value="l" disabled>L - out of stock</option><optgroup label="Legacy" disabled><option value="old">Old</option></optgroup></select>
      <select class="select" id="sel-size-list" name="sizes" multiple size="3"><option value="m">M</option><option value="l" disabled>L - out of stock</option><option value="xl">XL</option></select>
    </form>
  </body>
</html>
