<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>radio e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/radio/radio.css" />
  </head>
  <body style="padding:2rem;">
    <!-- mirrors the doc page: vertical group, horizontal group, card, block, invalid -->
    <fieldset class="radio-group" id="rg-vertical">
      <legend>Vertical</legend>
      <div class="radio-item">
        <input type="radio" name="v" class="radio" id="r-default" />
        <label for="r-default">Default</label>
      </div>
      <div class="radio-item">
        <input type="radio" name="v" class="radio" id="r-checked" checked />
        <label for="r-checked">Checked</label>
      </div>
      <div class="radio-item">
        <input type="radio" name="v" class="radio" id="r-disabled" disabled />
        <label for="r-disabled">Disabled</label>
      </div>
      <div class="radio-item">
        <input type="radio" name="v" class="radio" id="r-invalid" aria-invalid="true" />
        <label for="r-invalid">Invalid</label>
      </div>
    </fieldset>

    <fieldset class="radio-group" id="rg-horizontal" data-orientation="horizontal" style="margin-top:1rem;">
      <legend>Horizontal</legend>
      <div class="radio-item"><input type="radio" name="h" class="radio" id="r-h1" /><label for="r-h1">One</label></div>
      <div class="radio-item"><input type="radio" name="h" class="radio" id="r-h2" /><label for="r-h2">Two</label></div>
    </fieldset>

    <div class="radio-item-block" style="margin-top:1rem;max-width:20rem;">
      <input type="radio" name="b" class="radio" id="r-block" />
      <label for="r-block">Feature</label>
      <span class="radio-description">A description under the label, in the second grid column.</span>
    </div>

    <!-- density: option gap scales 4/8/12px (0.25/0.5/0.75rem) -->
    <fieldset class="radio-group" id="rg-compact" data-density="compact" style="margin-top:1rem;">
      <div class="radio-item"><input type="radio" name="dc" class="radio" id="r-dc" /><label for="r-dc">One</label></div>
      <div class="radio-item"><input type="radio" name="dc" class="radio" id="r-dc2" /><label for="r-dc2">Two</label></div>
    </fieldset>
    <fieldset class="radio-group" id="rg-comfortable" data-density="comfortable" style="margin-top:1rem;">
      <div class="radio-item"><input type="radio" name="dcm" class="radio" id="r-dcm" /><label for="r-dcm">One</label></div>
      <div class="radio-item"><input type="radio" name="dcm" class="radio" id="r-dcm2" /><label for="r-dcm2">Two</label></div>
    </fieldset>
    <fieldset class="radio-group" id="rg-spacious" data-density="spacious" style="margin-top:1rem;">
      <div class="radio-item"><input type="radio" name="dsp" class="radio" id="r-dsp" /><label for="r-dsp">One</label></div>
      <div class="radio-item"><input type="radio" name="dsp" class="radio" id="r-dsp2" /><label for="r-dsp2">Two</label></div>
    </fieldset>
    <!-- gap hit area: the whitespace between circle and label selects too -->
    <div class="radio-item"><input class="radio" type="radio" name="gap" id="rd-gap" /><label for="rd-gap">Gap target</label></div>
    <div class="radio-item-block"><input class="radio" type="radio" name="gap-block" id="rd-gap-block" /><label for="rd-gap-block">Block gap target</label><span class="radio-description">Description</span></div>
    <!-- disabled choice card: the card dims once, not again on dot + label -->
    <fieldset class="radio-group">
      <label class="radio-card" for="rd-card-disabled">
        <input class="radio" type="radio" name="card" id="rd-card-disabled" disabled />
        <label for="rd-card-disabled">Legacy</label>
        <span class="radio-description">No longer offered.</span>
      </label>
    </fieldset>
    <!-- the name makes the set: shared name = exclusive; different names in one fieldset = independent -->
    <form id="rn-form">
      <fieldset class="radio-group">
        <legend>Shared</legend>
        <div class="radio-item"><input class="radio" type="radio" name="size" id="rn-s" value="s" checked /><label for="rn-s">S</label></div>
        <div class="radio-item"><input class="radio" type="radio" name="size" id="rn-m" value="m" /><label for="rn-m">M</label></div>
      </fieldset>
      <fieldset class="radio-group">
        <legend>Different names</legend>
        <div class="radio-item"><input class="radio" type="radio" name="size-a" id="rn-a" value="a" /><label for="rn-a">A</label></div>
        <div class="radio-item"><input class="radio" type="radio" name="size-b" id="rn-b" value="b" /><label for="rn-b">B</label></div>
      </fieldset>
      <!-- same name, no fieldset: still one set -->
      <div class="radio-item"><input class="radio" type="radio" name="loose" id="rn-x" value="x" checked /><label for="rn-x">X</label></div>
      <div class="radio-item"><input class="radio" type="radio" name="loose" id="rn-y" value="y" /><label for="rn-y">Y</label></div>
    </form>
  </body>
</html>
