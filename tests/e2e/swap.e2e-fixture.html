<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>swap e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/swap/swap.css" />
  </head>
  <!-- plain block flow: a flex body would blockify inline-grid to grid and
       hide the display value the component CSS actually sets -->
  <body style="padding:2rem;">
    <!-- every configuration the doc page demonstrates (CSS is the whole
         contract here — docs ↔ e2e parity, AGENTS.md) -->

    <!-- 1. default crossfade, off -->
    <label class="swap" id="sw-default">
      <input type="checkbox" id="sw-default-input" aria-label="Toggle text" />
      <span class="swap-on">ON</span>
      <span class="swap-off">OFF</span>
    </label>

    <!-- 2. default crossfade, on (checked) -->
    <label class="swap" id="sw-checked">
      <input type="checkbox" checked aria-label="Toggle text checked" />
      <span class="swap-on">ON</span>
      <span class="swap-off">OFF</span>
    </label>

    <!-- 3. icon swap (volume) -->
    <label class="swap" id="sw-icon">
      <input type="checkbox" aria-label="Toggle sound" />
      <span class="swap-on" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      </span>
      <span class="swap-off" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m23 9-6 6"/><path d="m17 9 6 6"/></svg>
      </span>
    </label>

    <!-- 4. rotate variant, off -->
    <label class="swap" id="sw-rotate" data-variant="rotate">
      <input type="checkbox" aria-label="Toggle theme" />
      <span class="swap-on" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
      </span>
      <span class="swap-off" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
      </span>
    </label>

    <!-- 5. rotate variant, on (checked) -->
    <label class="swap" id="sw-rotate-on" data-variant="rotate">
      <input type="checkbox" checked aria-label="Toggle theme checked" />
      <span class="swap-on">☀</span>
      <span class="swap-off">☾</span>
    </label>

    <!-- 6. flip variant, off -->
    <label class="swap" id="sw-flip" data-variant="flip">
      <input type="checkbox" aria-label="Toggle mood" />
      <span class="swap-on">😇</span>
      <span class="swap-off">😈</span>
    </label>

    <!-- 7. flip variant, on (checked) -->
    <label class="swap" id="sw-flip-on" data-variant="flip">
      <input type="checkbox" checked aria-label="Toggle mood checked" />
      <span class="swap-on">😇</span>
      <span class="swap-off">😈</span>
    </label>

    <!-- 8. three-state (indeterminate set via the IDL property below) -->
    <label class="swap" id="sw-indeterminate">
      <input type="checkbox" id="sw-indeterminate-input" aria-label="Selection" />
      <span class="swap-on">All</span>
      <span class="swap-indeterminate">Some</span>
      <span class="swap-off">None</span>
    </label>

    <!-- 9. data-active forces the on face without a checked checkbox -->
    <label class="swap" id="sw-active" data-active>
      <input type="checkbox" aria-label="Forced on" />
      <span class="swap-on">ON</span>
      <span class="swap-off">OFF</span>
    </label>

    <!-- 10. disabled -->
    <label class="swap" id="sw-disabled">
      <input type="checkbox" disabled aria-label="Disabled swap" />
      <span class="swap-on">ON</span>
      <span class="swap-off">OFF</span>
    </label>

    <!-- 11-13. sizes -->
    <label class="swap" id="sw-sm" data-size="sm">
      <input type="checkbox" aria-label="Small" />
      <span class="swap-on">ON</span>
      <span class="swap-off">OFF</span>
    </label>
    <label class="swap" id="sw-md">
      <input type="checkbox" aria-label="Medium" />
      <span class="swap-on">ON</span>
      <span class="swap-off">OFF</span>
    </label>
    <label class="swap" id="sw-lg" data-size="lg">
      <input type="checkbox" aria-label="Large" />
      <span class="swap-on">ON</span>
      <span class="swap-off">OFF</span>
    </label>

    <script>
      // `indeterminate` is an IDL property only — there is no HTML attribute
      document.getElementById('sw-indeterminate-input').indeterminate = true;
    </script>
  </body>
</html>
