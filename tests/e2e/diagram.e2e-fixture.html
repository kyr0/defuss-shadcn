<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram e2e fixture</title>
  <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css">
  <link rel="stylesheet" href="/dist/components/button/button.css">
  <link rel="stylesheet" href="/dist/components/diagram/diagram.css">
  <style>
    /* spacing only - never properties the checks assert */
    body { font-family: system-ui, sans-serif; padding: 1.5rem; background: var(--background); color: var(--foreground); }
    .diagram { margin-bottom: 2.5rem; }
  </style>
</head>
<body>
  <!-- architecture: zones, tones, labelled elbows, a dashed async edge, explicit ports -->
  <figure class="diagram" id="dg-arch" data-type="architecture" aria-label="Web app architecture">
    <figcaption class="diagram-caption">
      <span class="diagram-eyebrow">Architecture</span>
      <span class="diagram-title">Checkout service</span>
    </figcaption>
    <div class="diagram-canvas" style="--cols:4">
      <div class="diagram-group" data-node="vpc" style="--col:2;--row:1;--span:3;--rspan:2"><span class="diagram-group-label">VPC · eu-west-1</span></div>
      <div class="diagram-node" data-node="web" style="--col:1;--row:1"><span class="diagram-node-eyebrow">Client</span><span class="diagram-node-name">Web app</span><span class="diagram-node-meta">React · SSR</span></div>
      <div class="diagram-node" data-node="api" data-tone="accent" style="--col:2;--row:1"><span class="diagram-node-eyebrow">Edge</span><span class="diagram-node-name">API gateway</span><span class="diagram-node-meta">rate-limited</span></div>
      <div class="diagram-node" data-node="orders" style="--col:3;--row:1"><span class="diagram-node-name">Orders</span><span class="diagram-node-meta">Go · 3 pods</span></div>
      <div class="diagram-node" data-node="db" data-shape="store" style="--col:4;--row:1"><span class="diagram-node-name">Postgres</span><span class="diagram-node-meta">primary</span></div>
      <div class="diagram-node" data-node="queue" style="--col:3;--row:2"><span class="diagram-node-name">Event bus</span><span class="diagram-node-meta">Kafka</span></div>
      <div class="diagram-node" data-node="mail" data-tone="external" style="--col:1;--row:2"><span class="diagram-node-name">Mail provider</span><span class="diagram-node-meta">external</span></div>
    </div>
    <ol class="diagram-edges">
      <li class="diagram-edge" data-from="web" data-to="api">HTTPS</li>
      <li class="diagram-edge" data-from="api" data-to="orders" data-tone="accent">gRPC</li>
      <li class="diagram-edge" data-from="orders" data-to="db">SQL</li>
      <li class="diagram-edge" data-from="orders" data-to="queue" data-line="dashed">publish</li>
      <li class="diagram-edge" data-from="queue" data-to="mail" data-line="dashed">notify</li>
    </ol>
  </figure>

  <!-- flow: pill / diamond / labelled exits, step by step -->
  <figure class="diagram" id="dg-flow" data-type="flow" data-steps style="--diagram-hold:100ms;--diagram-element-ms:100ms;--diagram-step-ms:100ms" aria-label="Refund decision">
    <div class="diagram-canvas" style="--cols:3">
      <div class="diagram-node" data-node="start" data-shape="pill" style="--col:1;--row:1"><span class="diagram-node-name">Refund request</span></div>
      <div class="diagram-node" data-node="paid" data-shape="diamond" style="--col:2;--row:1"><span class="diagram-node-name">Paid &lt; 30 days?</span></div>
      <div class="diagram-node" data-node="auto" style="--col:3;--row:1" data-tone="accent"><span class="diagram-node-name">Auto refund</span></div>
      <div class="diagram-node" data-node="review" style="--col:2;--row:2"><span class="diagram-node-name">Manual review</span></div>
      <div class="diagram-node" data-node="done" data-shape="pill" style="--col:3;--row:2"><span class="diagram-node-name">Closed</span></div>
    </div>
    <ol class="diagram-edges">
      <li class="diagram-edge" data-from="start" data-to="paid"></li>
      <li class="diagram-edge" data-from="paid" data-to="auto" data-tone="accent">yes</li>
      <li class="diagram-edge" data-from="paid" data-to="review">no</li>
      <li class="diagram-edge" data-from="review" data-to="done"></li>
      <li class="diagram-edge" data-from="auto" data-to="done"></li>
    </ol>
  </figure>

  <!-- state: start / end dots, self loop, curved transitions -->
  <figure class="diagram" id="dg-state" data-type="state" aria-label="Connection state machine">
    <div class="diagram-canvas" style="--cols:4">
      <div class="diagram-node" data-node="s0" data-shape="start" style="--col:1;--row:1"><span class="diagram-node-name">start</span></div>
      <div class="diagram-node" data-node="idle" style="--col:2;--row:1"><span class="diagram-node-name">Idle</span></div>
      <div class="diagram-node" data-node="conn" style="--col:3;--row:1"><span class="diagram-node-name">Connecting</span></div>
      <div class="diagram-node" data-node="open" data-tone="accent" style="--col:4;--row:1"><span class="diagram-node-name">Open</span></div>
      <div class="diagram-node" data-node="fail" style="--col:3;--row:2"><span class="diagram-node-name">Failed</span></div>
      <div class="diagram-node" data-node="s1" data-shape="end" style="--col:4;--row:2"><span class="diagram-node-name">end</span></div>
    </div>
    <ol class="diagram-edges">
      <li class="diagram-edge" data-from="s0" data-to="idle"></li>
      <li class="diagram-edge" data-from="idle" data-to="conn">connect()</li>
      <li class="diagram-edge" data-from="conn" data-to="open">ack</li>
      <li class="diagram-edge" data-from="conn" data-to="fail">timeout</li>
      <li class="diagram-edge" data-from="fail" data-to="idle:bottom">retry [n &lt; 3]</li>
      <li class="diagram-edge" data-from="open" data-to="open">heartbeat</li>
      <li class="diagram-edge" data-from="fail" data-to="s1">give up</li>
    </ol>
  </figure>

  <!-- ER / schema: field rows, column-to-column FKs, crow's feet -->
  <figure class="diagram" id="dg-er" data-type="db-schema" aria-label="Orders schema">
    <div class="diagram-canvas" style="--cols:3">
      <div class="diagram-node" data-node="customers" style="--col:1;--row:1">
        <span class="diagram-node-eyebrow">Table</span><span class="diagram-node-name">public.customers</span>
        <ul class="diagram-node-fields"><li data-field="id" data-key="pk"><span>id</span><span>uuid</span></li><li data-field="email" data-key="uq"><span>email</span><span>text</span></li><li data-field="created_at"><span>created_at</span><span>timestamptz</span></li></ul>
      </div>
      <div class="diagram-node" data-node="orders" data-tone="accent" style="--col:2;--row:1">
        <span class="diagram-node-eyebrow">Table</span><span class="diagram-node-name">public.orders</span>
        <ul class="diagram-node-fields"><li data-field="id" data-key="pk"><span>id</span><span>uuid</span></li><li data-field="customer_id" data-key="fk"><span>customer_id</span><span>uuid</span></li><li data-field="total"><span>total</span><span>numeric(12,2)</span></li><li data-field="status"><span>status</span><span>text</span></li></ul>
      </div>
      <div class="diagram-node" data-node="items" style="--col:3;--row:1">
        <span class="diagram-node-eyebrow">Table</span><span class="diagram-node-name">public.order_items</span>
        <ul class="diagram-node-fields"><li data-field="id" data-key="pk"><span>id</span><span>uuid</span></li><li data-field="order_id" data-key="fk"><span>order_id</span><span>uuid</span></li><li data-field="sku"><span>sku</span><span>text</span></li></ul>
      </div>
    </div>
    <ol class="diagram-edges">
      <li class="diagram-edge" data-from="orders#customer_id" data-to="customers#id" data-head="one" data-tail="zero-many"></li>
      <li class="diagram-edge" data-from="items#order_id" data-to="orders#id" data-head="one" data-tail="one-many"></li>
    </ol>
  </figure>

  <!-- sequence: lifelines, messages, a dashed return, a self message -->
  <figure class="diagram" id="dg-seq" data-type="sequence" data-steps aria-label="Token refresh">
    <div class="diagram-canvas" style="--cols:3">
      <div class="diagram-node" data-node="client"><span class="diagram-node-name">Client</span></div>
      <div class="diagram-node" data-node="auth" data-tone="accent"><span class="diagram-node-name">Auth server</span></div>
      <div class="diagram-node" data-node="api"><span class="diagram-node-name">API</span></div>
      <ol class="diagram-edges">
        <li class="diagram-edge" data-from="client" data-to="api">GET /orders</li>
        <li class="diagram-edge" data-from="api" data-to="client" data-line="dashed">401 expired</li>
        <li class="diagram-edge" data-from="client" data-to="auth">POST /token (refresh)</li>
        <li class="diagram-edge" data-from="auth" data-to="auth">rotate refresh token</li>
        <li class="diagram-edge" data-from="auth" data-to="client" data-line="dashed" data-tone="accent">200 access token</li>
      </ol>
    </div>
  </figure>

  <!-- delta: before / changes / after from one annotated source -->
  <figure class="diagram" id="dg-delta" data-type="architecture" data-delta aria-label="Extracting the payments service">
    <div class="diagram-canvas" style="--cols:3">
      <div class="diagram-node" data-node="api" style="--col:1;--row:1"><span class="diagram-node-name">API</span></div>
      <div class="diagram-node" data-node="mono" data-change="changed" style="--col:2;--row:1"><span class="diagram-node-name">Monolith</span><span class="diagram-node-meta" data-before="orders · payments">orders</span></div>
      <div class="diagram-node" data-node="pay" data-change="added" data-tone="accent" style="--col:2;--row:2"><span class="diagram-node-name">Payments</span><span class="diagram-node-meta">new service</span></div>
      <div class="diagram-node" data-node="db" data-shape="store" style="--col:3;--row:1"><span class="diagram-node-name">DB</span></div>
      <div class="diagram-node" data-node="cron" data-change="removed" style="--col:1;--row:2"><span class="diagram-node-name">Nightly cron</span></div>
    </div>
    <ol class="diagram-edges">
      <li class="diagram-edge" data-from="api" data-to="mono">REST</li>
      <li class="diagram-edge" data-from="api" data-to="pay" data-change="added">charge</li>
      <li class="diagram-edge" data-from="mono" data-to="db"></li>
      <li class="diagram-edge" data-from="cron" data-to="mono" data-change="removed">batch</li>
    </ol>
  </figure>

  <!-- timeline -->
  <figure class="diagram" id="dg-time" data-type="timeline" aria-label="Release history">
    <div class="diagram-canvas">
      <div class="diagram-tick" style="--x:0">Q1</div><div class="diagram-tick" style="--x:25">Q2</div><div class="diagram-tick" style="--x:50">Q3</div><div class="diagram-tick" style="--x:75">Q4</div><div class="diagram-tick" style="--x:100">Q1</div>
      <div class="diagram-node" data-node="a" style="--x:6"><div class="diagram-node-body"><span class="diagram-node-eyebrow">Jan 12</span><span class="diagram-node-name">v1.0 launch</span></div></div>
      <div class="diagram-node" data-node="b" data-side="below" style="--x:31"><div class="diagram-node-body"><span class="diagram-node-eyebrow">Apr 20</span><span class="diagram-node-name">Teams</span></div></div>
      <div class="diagram-node" data-node="c" data-tone="accent" style="--x:58"><div class="diagram-node-body"><span class="diagram-node-eyebrow">Aug 2</span><span class="diagram-node-name">v2.0 · new engine</span></div></div>
      <div class="diagram-node" data-node="d" data-side="below" style="--x:88"><div class="diagram-node-body"><span class="diagram-node-eyebrow">Nov 30</span><span class="diagram-node-name">EU region</span></div></div>
    </div>
  </figure>

  <!-- matrix -->
  <figure class="diagram" id="dg-matrix" data-type="matrix" aria-label="Access matrix">
    <div class="diagram-canvas">
      <table class="diagram-matrix">
        <thead><tr><th>Component</th><th>Admins</th><th>Engineers</th><th>Consumers</th></tr></thead>
        <tbody>
          <tr><th scope="row">Raw bucket</th><td data-perm="full"><span>RW</span></td><td data-perm="write"><span>W</span></td><td data-perm="none"><span>—</span></td></tr>
          <tr><th scope="row">Aggregates</th><td data-perm="full"><span>RW</span></td><td data-perm="read"><span>R</span></td><td data-perm="read" data-tone="accent"><span>R</span></td></tr>
        </tbody>
      </table>
    </div>
  </figure>

  <!-- wardley -->
  <figure class="diagram" id="dg-wardley" data-type="wardley" aria-label="Wardley map">
    <div class="diagram-canvas">
      <div class="diagram-node" data-node="user" data-shape="dot" style="--x:60;--y:6"><span class="diagram-node-name">Customer</span></div>
      <div class="diagram-node" data-node="shop" data-shape="dot" style="--x:52;--y:30"><span class="diagram-node-name">Online shop</span></div>
      <div class="diagram-node" data-node="reco" data-shape="dot" data-tone="accent" style="--x:20;--y:52"><span class="diagram-node-name">Recommendations</span></div>
      <div class="diagram-node" data-node="reco-next" data-shape="ghost" style="--x:44;--y:52"></div>
      <div class="diagram-node" data-node="compute" data-shape="dot" style="--x:90;--y:86"><span class="diagram-node-name">Compute</span></div>
      <div class="diagram-axis" data-axis="x"><span>Genesis</span><span>Custom</span><span>Product</span><span>Commodity</span></div>
      <div class="diagram-axis" data-axis="y"><span>Visible</span><span>Invisible</span></div>
    </div>
    <ol class="diagram-edges">
      <li class="diagram-edge" data-from="user" data-to="shop" data-curve="straight" data-head="none"></li>
      <li class="diagram-edge" data-from="shop" data-to="reco" data-curve="straight" data-head="none"></li>
      <li class="diagram-edge" data-from="shop" data-to="compute" data-curve="straight" data-head="none"></li>
      <li class="diagram-edge" data-from="reco" data-to="compute" data-curve="straight" data-head="none"></li>
      <li class="diagram-edge" data-from="reco" data-to="reco-next" data-curve="straight" data-line="dashed" data-tone="accent"></li>
    </ol>
  </figure>

  <!-- loop -->
  <figure class="diagram" id="dg-loop" data-type="loop" aria-label="Flywheel">
    <div class="diagram-canvas" style="--n:5">
      <div class="diagram-node" data-node="hub" data-hub data-tone="muted"><span class="diagram-node-name">Shared memory</span><span class="diagram-node-meta">one record</span></div>
      <div class="diagram-node" data-node="cap" style="--i:0"><span class="diagram-node-name">Capture</span></div>
      <div class="diagram-node" data-node="res" style="--i:1"><span class="diagram-node-name">Research</span></div>
      <div class="diagram-node" data-node="dec" data-tone="accent" style="--i:2"><span class="diagram-node-name">Decide</span></div>
      <div class="diagram-node" data-node="act" style="--i:3"><span class="diagram-node-name">Act</span></div>
      <div class="diagram-node" data-node="learn" style="--i:4"><span class="diagram-node-name">Learn</span></div>
    </div>
    <ol class="diagram-edges">
      <li class="diagram-edge" data-from="cap" data-to="res" data-curve="curve" data-flow></li>
      <li class="diagram-edge" data-from="res" data-to="dec" data-curve="curve"></li>
      <li class="diagram-edge" data-from="dec" data-to="act" data-curve="curve"></li>
      <li class="diagram-edge" data-from="act" data-to="learn" data-curve="curve"></li>
      <li class="diagram-edge" data-from="learn" data-to="cap" data-curve="curve"></li>
      <li class="diagram-edge" data-from="act" data-to="hub" data-curve="straight" data-line="dashed">outcomes</li>
    </ol>
  </figure>

  <!-- fishbone -->
  <figure class="diagram" id="dg-fish" data-type="fishbone" aria-label="Checkout outage causes">
    <div class="diagram-canvas" style="--cols:4">
      <div class="diagram-node" data-node="people" data-bone style="--col:1;--row:1"><span class="diagram-node-name">People</span><ul class="diagram-node-fields"><li>on-call handover</li></ul></div>
      <div class="diagram-node" data-node="process" data-bone data-tone="accent" style="--col:2;--row:1"><span class="diagram-node-name">Process</span><ul class="diagram-node-fields"><li>no canary</li><li>manual config</li></ul></div>
      <div class="diagram-node" data-node="tech" data-bone data-side="below" style="--col:1;--row:3"><span class="diagram-node-name">Technology</span><ul class="diagram-node-fields"><li>pool exhausted</li></ul></div>
      <div class="diagram-node" data-node="env" data-bone data-side="below" style="--col:2;--row:3"><span class="diagram-node-name">Environment</span><ul class="diagram-node-fields"><li>traffic spike</li></ul></div>
      <div class="diagram-node" data-node="effect" data-effect data-tone="accent" style="--col:4"><span class="diagram-node-eyebrow">Effect</span><span class="diagram-node-name">Checkout 5xx for 42 min</span></div>
    </div>
  </figure>

  <!-- quadrant -->
  <figure class="diagram" id="dg-quad" data-type="quadrant" aria-label="Scenarios">
    <div class="diagram-canvas">
      <div class="diagram-axis" data-axis="y"><span>Fast</span><b>Adoption</b><span>Slow</span></div>
      <div class="diagram-node"><span class="diagram-node-eyebrow">Scenario A</span><span class="diagram-node-name">Walled gardens</span><span class="diagram-node-meta">Fast adoption, closed standards.</span></div>
      <div class="diagram-node" data-tone="accent"><span class="diagram-node-eyebrow">Scenario B</span><span class="diagram-node-name">Open bazaar</span><span class="diagram-node-meta">Fast adoption, open standards.</span></div>
      <div class="diagram-node"><span class="diagram-node-eyebrow">Scenario C</span><span class="diagram-node-name">Slow burn</span><span class="diagram-node-meta">Slow, closed.</span></div>
      <div class="diagram-node"><span class="diagram-node-eyebrow">Scenario D</span><span class="diagram-node-name">Commons</span><span class="diagram-node-meta">Slow, open.</span></div>
      <div class="diagram-axis" data-axis="x"><span>Closed</span><b>Standards</b><span>Open</span></div>
    </div>
  </figure>

  <!-- kanban -->
  <figure class="diagram" id="dg-kanban" data-type="kanban" aria-label="Board">
    <div class="diagram-canvas" style="--cols:3">
      <div class="diagram-group" data-shape="column"><span class="diagram-group-label">Todo <span class="diagram-group-meta">3</span></span>
        <div class="diagram-node"><span class="diagram-node-name">Billing export</span><span class="diagram-node-meta">PAY-12</span></div>
        <div class="diagram-node" data-status="waiting"><span class="diagram-node-name">Vendor SSO</span><span class="diagram-node-meta">waiting on vendor</span></div>
      </div>
      <div class="diagram-group" data-shape="column" data-over><span class="diagram-group-label">Doing <span class="diagram-group-meta">4/3</span></span>
        <div class="diagram-node" data-status="blocked"><span class="diagram-node-name">Tax rules</span><span class="diagram-node-meta">blocked · legal</span></div>
        <div class="diagram-node"><span class="diagram-node-name">Refund flow</span></div>
      </div>
      <div class="diagram-group" data-shape="column"><span class="diagram-group-label">Done <span class="diagram-group-meta">12</span></span>
        <div class="diagram-node" data-status="done"><span class="diagram-node-name">Invoices v2</span></div>
      </div>
    </div>
  </figure>

  <!-- main page figures -->
  <figure class="diagram" id="dg-shapes" data-type="flow" aria-label="Order fulfilment flow">
    <figcaption class="diagram-caption">
      <span class="diagram-eyebrow">Flow</span>
      <span class="diagram-title">Order fulfilment</span>
    </figcaption>
    <div class="diagram-canvas" style="--cols:4">
      <div class="diagram-node" data-node="placed" data-shape="pill" style="--col:1;--row:1"><span class="diagram-node-name">Order placed</span></div>
      <div class="diagram-node" data-node="stock" data-shape="diamond" style="--col:2;--row:1"><span class="diagram-node-name">In stock?</span></div>
      <div class="diagram-node" data-node="pick" data-tone="accent" style="--col:3;--row:1">
        <span class="diagram-node-name">Pick & pack</span>
        <span class="diagram-node-meta">warehouse</span>
      </div>
      <div class="diagram-node" data-node="shipped" data-shape="pill" style="--col:4;--row:1"><span class="diagram-node-name">Shipped</span></div>
      <div class="diagram-node" data-node="inventory" data-shape="store" style="--col:2;--row:2">
        <span class="diagram-node-name">Inventory</span>
        <span class="diagram-node-meta">stock levels</span>
      </div>
      <div class="diagram-node" data-node="backorder" style="--col:3;--row:2">
        <span class="diagram-node-name">Back-order</span>
        <span class="diagram-node-meta">customer notified</span>
      </div>
      <div class="diagram-node" data-node="supplier" data-tone="external" style="--col:4;--row:2">
        <span class="diagram-node-name">Supplier</span>
        <span class="diagram-node-meta">EDI</span>
      </div>
    </div>
    <ol class="diagram-edges">
      <li class="diagram-edge" data-from="placed" data-to="stock"></li>
      <li class="diagram-edge" data-from="stock" data-to="pick" data-tone="accent">yes</li>
      <li class="diagram-edge" data-from="pick" data-to="shipped"></li>
      <li class="diagram-edge" data-from="stock" data-to="inventory" data-line="dashed" data-head="open">reads</li>
      <li class="diagram-edge" data-from="stock" data-to="backorder">no</li>
      <li class="diagram-edge" data-from="backorder" data-to="supplier" data-line="dashed">reorder</li>
      <li class="diagram-edge" data-from="supplier" data-to="pick">delivery</li>
    </ol>
  </figure>

  <figure class="diagram" id="dg-tones" data-type="architecture" aria-label="Checkout health right now">
    <figcaption class="diagram-caption">
      <span class="diagram-eyebrow">Health</span>
      <span class="diagram-title">Checkout, right now</span>
    </figcaption>
    <div class="diagram-canvas" style="--cols:4">
      <div class="diagram-node" data-node="cdn" data-tone="ok" data-detail="Serving 41k req/s from 212 edge locations, no errors." style="--col:1;--row:1">
        <span class="diagram-node-name">CDN</span>
        <span class="diagram-node-meta">99.99% · ok</span>
      </div>
