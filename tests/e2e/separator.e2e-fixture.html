<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>separator e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/separator/separator.css" />
  </head>
  <body style="padding:2rem;display:block;">
    <!-- mirrors the doc page: horizontal rule, labelled rule, vertical rule in a flex row -->
    <hr class="separator" id="sep-horizontal" />

    <div class="separator-label" id="sep-labelled" style="margin-top:1rem;">
      <span>or</span>
      <hr class="separator" />
    </div>

    <div style="display:flex;height:3rem;margin-top:1rem;gap:0.5rem;align-items:stretch;">
      <span>left</span>
      <hr class="separator" id="sep-vertical" data-orientation="vertical" />
      <span>right</span>
    </div>
  </body>
</html>
