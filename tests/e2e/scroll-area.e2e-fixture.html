<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>scroll-area e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/utils/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/scroll-area/scroll-area.css" />
  </head>
  <body style="padding:2rem;">
    <!-- mirrors the doc page: a clipped pane with overflowing content -->
    <div class="scroll-area" id="sa-demo" style="width:200px;height:120px;">
      <div style="height:400px;width:400px;">Overflowing content</div>
    </div>

    <!-- density: the scrollbar gutter IS the whitespace policy (4/6/8px) -->
    <div class="scroll-area" id="sa-compact" data-density="compact" style="width:200px;height:120px;margin-top:1rem;">
      <div style="height:400px;width:400px;">Overflowing content</div>
    </div>
    <div class="scroll-area" id="sa-comfortable" data-density="comfortable" style="width:200px;height:120px;margin-top:1rem;">
      <div style="height:400px;width:400px;">Overflowing content</div>
    </div>
    <div class="scroll-area" id="sa-spacious" data-density="spacious" style="width:200px;height:120px;margin-top:1rem;">
      <div style="height:400px;width:400px;">Overflowing content</div>
    </div>
  </body>
</html>
