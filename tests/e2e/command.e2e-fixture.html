<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>command e2e fixture</title>
    <link rel="stylesheet" href="/dist/theme/default-semantic-tokens.css" />
    <link rel="stylesheet" href="/dist/components/button/button.css" />
    <link rel="stylesheet" href="/dist/components/command/command.css" />
  </head>
  <!-- min-height makes the document scrollable so the scroll-lock behavior
       (page behind a modal palette must stay put) is observable. -->
  <body style="padding:2rem;min-height:250vh;">
    <!-- mirrors the doc page demo -->
    <button class="btn" data-variant="outline" data-command-trigger="demo-cmd">Open Command Menu</button>
    <dialog id="demo-cmd" class="command" role="dialog" aria-modal="true" aria-label="Command menu">
      <div class="command-content">
        <div class="command-input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="command-input" type="text" placeholder="Type a command or search..." autocomplete="off" autocorrect="off" spellcheck="false">
        </div>
        <div class="command-list">
          <div class="command-group">
            <p class="command-group-heading">Suggestions</p>
            <button class="command-item">Calendar</button>
            <button class="command-item">Search Emoji</button>
            <button class="command-item">Calculator</button>
          </div>
          <div class="command-separator"></div>
          <div class="command-group">
            <p class="command-group-heading">Settings</p>
            <button class="command-item">Profile <span class="command-shortcut">⌘P</span></button>
            <button class="command-item">Billing <span class="command-shortcut">⌘B</span></button>
            <button class="command-item">Settings <span class="command-shortcut">⌘S</span></button>
          </div>
        </div>
        <div class="command-empty" hidden>No results found.</div>
      </div>
    </dialog>

    <script type="module" src="/dist/components/command/command.js"></script>
      <dialog id="cmd-compact" class="command" data-density="compact" role="dialog" aria-modal="true" aria-label="Command compact"><div class="command-content"><div class="command-input-wrapper"><input class="command-input" type="text" placeholder="Search..." autocomplete="off"></div><div class="command-list"><div class="command-group"><p class="command-group-heading">G</p><button class="command-item">Item</button></div></div></div></dialog>
    <dialog id="cmd-comfortable" class="command" data-density="comfortable" role="dialog" aria-modal="true" aria-label="Command comfortable"><div class="command-content"><div class="command-input-wrapper"><input class="command-input" type="text" placeholder="Search..." autocomplete="off"></div><div class="command-list"><div class="command-group"><p class="command-group-heading">G</p><button class="command-item">Item</button></div></div></div></dialog>
    <dialog id="cmd-spacious" class="command" data-density="spacious" role="dialog" aria-modal="true" aria-label="Command spacious"><div class="command-content"><div class="command-input-wrapper"><input class="command-input" type="text" placeholder="Search..." autocomplete="off"></div><div class="command-list"><div class="command-group"><p class="command-group-heading">G</p><button class="command-item">Item</button></div></div></div></dialog>
</body>
</html>
