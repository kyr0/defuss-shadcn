<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--CE_STYLES-->
    <style data-ce-chrome>
      /* sandbox chrome: the body IS the demo stage — block flow (like a page),
         the example's own wrappers (.checkbox-item, .separator-label, the
         restored demo divs) own their layout; a flex body would shrink-wrap
         block demos (headings side-by-side, empty scroll-area, invisible
         labeled separators). flow-root: child margins can't collapse through
         the body, so the bridge's content-height measurement stays exact. */
      body {
        display: flow-root;
        margin: 2.5rem 1.5rem;
        background: var(--background);
        color: var(--foreground);
        /*CE_BODY_STYLE*/
      }
    </style>
  </head>
  <body>
    <!--CE_SOURCE-->
    <script id="ce-bootstrap" data-ce-chrome>
      globalThis.__CE_CH = <!--CE_CH-->;
      globalThis.__CE_SCHEMA = <!--CE_SCHEMA-->;
    </script>
    <!--CE_BRIDGE-->
  </body>
</html>
