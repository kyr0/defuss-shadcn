    place-items: center;
    inline-size: 1.75rem;

    border-radius: var(--radius-md);
    background: var(--primary);
    color: var(--primary-foreground);
  }
  .kg-brand-sub {
    color: var(--muted-foreground);
    font-weight: 400;
  }
  .kg-title-sub {
    color: var(--muted-foreground);

    text-overflow: ellipsis;

<script type="module">
  // Atlas' plugins: the explorer draws the graph and the details; these renderers turn an API system, a domain, a
  // dataset and a link between clusters into pages composed from the library - Chart and Geo Map in islands (their
  // scripts keep what they drew while the details re-render), Avatar, Timeline, Progress, Table, Badge, Statistic.
  // The numbers are synthetic and stable per node: a metrics service would answer through ctx.request.
  const OWNERS = ['mira', 'jonas', 'li', 'sam', 'ada', 'omar', 'noor', 'tomas'];
  const COUNTRIES = [
    'USA',
    'DEU',
    'IRL',
    'JPN',
    'BRA',
    'IND',
    'SGP',
    'AUS',
    'CAN',
    'FRA',
    'GBR',
    'NLD',
    'SWE',
    'ZAF',
    'KOR',
  ];
  const NOUNS = ['orders', 'payments', 'users', 'sessions', 'invoices', 'items', 'events', 'tokens', 'reports'];
  const HOURS = Array.from({ length: 24 }, (_, k) => String(k).padStart(2, '0') + 'h');
  const DAYS = Array.from({ length: 30 }, (_, k) => 'd' + (k + 1));
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmt = (n) => Number(n).toLocaleString('en-US');
  const hash = (s) => [...String(s)].reduce((h, ch) => Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0, 2166136261);
  // a seeded generator: the same node always shows the same numbers
  const rng = (seed) => () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const series = (id, n, base, spread, salt = 0) => {
    const r = rng(hash(id) + salt);
    let v = base;
    return Array.from({ length: n }, (_, k) => {
      v = v * 0.6 + (base + (r() - 0.5) * spread + Math.sin(k / 3.5) * spread * 0.35) * 0.4;
      return Math.max(0, Math.round(v * 10) / 10);
    });
  };
  const pick = (id, list, n, salt = 0) => {
    const r = rng(hash(id) + salt),
      out = [];
    while (out.length < Math.min(n, list.length)) {
      const x = list[Math.floor(r() * list.length)];
      if (!out.includes(x)) out.push(x);
    }
    return out;
  };

  // -- what a node or a link reports (a pretend observability service)
  const apiMetrics = (id) => {
    const r = rng(hash(id));
    const p50 = series(id, 24, 30 + r() * 60, 30, 1),
      p95 = p50.map((v, k) => Math.round(v * (2.2 + 0.4 * Math.sin(k / 4)))),
      p99 = p95.map((v) => Math.round(v * 1.6)),
      rps = series(id, 24, 200 + r() * 3000, 900, 2).map(Math.round),
      errors = series(id, 24, 0.4 + r() * 1.5, 1.2, 3);
    const endpoints = Array.from({ length: 6 }, (_, k) => {
      const noun = NOUNS[(hash(id) + k * 7) % NOUNS.length];
      const method = ['GET', 'GET', 'POST', 'PUT', 'DELETE', 'GET'][k];
      return {
        method,
        path: `/v${1 + (k % 2)}/${noun}${method === 'POST' ? '' : '/{id}'}`,
        p95: Math.round(p95[k * 3] * (0.6 + r() * 0.8)),
        rps: Math.round(rps[k * 3] / (2 + k)),
        errors: Math.round(errors[k * 3] * (0.5 + r()) * 100) / 100,
      };
    });
    const team = pick(id, OWNERS, 3 + (hash(id) % 3), 4);
    const regions = pick(id, COUNTRIES, 3 + (hash(id) % 3), 5);
    const last = (list) => list[list.length - 1];
    return {
      p50,
      p95,
      p99,
      rps,
      errors,
      endpoints,
      team,
      regions,
      now: { p95: last(p95), p99: last(p99), rps: last(rps), errors: last(errors) },
      slo: 99 + ((hash(id) >>> 4) % 99) / 100,
      events: [
        {
          title: 'Deployed ' + `v${2 + (hash(id) % 5)}.${hash(id) % 20}.${hash(id) % 9}`,
          text: `by ${team[0]}, canary 10 % then 100 %`,
          when: '2 h ago',
          active: true,
        },
        {
          title: 'Latency alert resolved',
          text: `p95 back under ${Math.round(last(p95) * 1.3)} ms`,
          when: 'yesterday',
        },
        { title: 'Breaker tripped', text: 'to a dependency, recovered after 4 probes', when: '3 days ago' },
        {
          title: 'Deployed ' + `v${1 + (hash(id) % 5)}.${(hash(id) >>> 3) % 20}.0`,
          text: `by ${team[1] ?? team[0]}`,
          when: 'last week',
        },
      ],
    };
  };
  // the metrics arrive like a service answer: after a moment, once per node (ctx.request caches them)
  const later = (value, id) => new Promise((resolve) => setTimeout(() => resolve(value), 150 + (hash(id) % 300)));

  // -- building blocks: the explorer's detail parts and the library's components
  const stats = (c, rows) =>
    c.html`<dl class="graph-explorer-stats">${rows.map(([k, v, tone]) => c.html`<div class="graph-explorer-stat"${tone ? c.html` data-tone="${tone}"` : ''}><dt>${k}</dt><dd>${v}</dd></div>`)}</dl>`;
  const section = (c, title, body, count) =>
    c.html`<section class="graph-explorer-section"><h4 class="graph-explorer-section-title"><span>${title}</span>${count != null ? c.html`<span class="graph-explorer-section-count">${count}</span>` : ''}</h4>${body}</section>`;
  const card = (c, title, body, { icon, note, wide } = {}) =>
    c.html`<section class="card graph-explorer-page-card" data-size="sm"${wide ? c.html` data-wide` : ''}><header class="card-header"><h3 class="card-title">${icon ? c.icon(icon, { size: 'sm' }) : ''}${title}</h3>${note ? c.html`<p class="card-description">${note}</p>` : ''}</header><div class="card-content">${body}</div></section>`;
  const kpi = (c, title, value, note, tone) =>
    c.html`<div class="statistic graph-explorer-kpi"${tone ? c.html` data-tone="${tone}"` : ''}><p class="statistic-title">${title}</p><p class="statistic-value">${value}</p>${note != null ? c.html`<p class="statistic-description">${note}</p>` : ''}</div>`;
  const head = (c, icon, kicker, path) =>
    c.html`<header class="graph-explorer-detail-head"><span class="graph-explorer-detail-tile">${c.icon(icon, { size: c.expanded ? 'xl' : 'lg' })}</span><div class="graph-explorer-detail-titles"><p class="graph-explorer-detail-kicker">${kicker}</p>${trail(c, path)}</div></header>`;
  const pageHead = (c, icon, title, kicker, path, actions) =>
    c.html`<header class="graph-explorer-page-head"><span class="graph-explorer-detail-tile" data-size="xl">${c.icon(icon, { size: 'xl' })}</span><div class="graph-explorer-page-titles">${trail(c, path)}<h2 class="graph-explorer-page-title">${title}</h2><p class="graph-explorer-detail-kicker">${kicker}</p></div>${actions}</header>`;
  const trail = (c, path, last = false) =>
    path
      ? c.html`<nav class="graph-explorer-trail" aria-label="Path">${(last ? path : path.slice(0, -1)).map((p, k) => c.html`${k ? c.html`<span class="graph-explorer-trail-sep" aria-hidden="true">›</span>` : ''}${p.id === 'c0' ? c.html`<span>${p.label}</span>` : c.html`<button type="button" class="graph-explorer-link" data-graph-explorer-goto="${p.id}">${p.label}</button>`}`)}</nav>`
      : '';
  const actions = (c, n) =>
    c.html`<div class="graph-explorer-detail-actions">${n && n.kind === 'cluster' ? c.html`<button type="button" class="btn" data-size="sm" data-graph-explorer-action="enter">${c.icon('arrow-right')} Enter</button>` : ''}${n && !c.expanded ? c.html`<button type="button" class="btn" data-variant="outline" data-size="sm" data-graph-explorer-action="bring">${c.icon('crosshair')} Bring &amp; Go</button>` : ''}${c.expanded ? c.html`<button type="button" class="btn" data-variant="outline" data-size="sm" data-graph-explorer-action="collapse">${c.icon('shrink')} Back to graph</button>` : c.expandable ? c.html`<button type="button" class="btn" data-variant="ghost" data-size="sm" data-graph-explorer-action="expand">${c.icon('expand')} Expand</button>` : ''}</div>`;
  const row = (c, r) =>
    c.html`<li class="graph-explorer-row"><button type="button" class="graph-explorer-row-main" data-graph-explorer-goto="${r.id}">${r.icon ?? ''}<span class="graph-explorer-row-name">${r.label}</span>${r.meta != null ? c.html`<span class="graph-explorer-row-meta">${r.meta}</span>` : ''}</button>${r.badge ?? ''}${r.edge ? c.html`<button type="button" class="graph-explorer-row-link" data-graph-explorer-edge="${r.edge}" title="Inspect the link" aria-label="Inspect the link to ${r.label}">${c.icon('link-2', { size: 'sm' })}</button>` : ''}</li>`;
  const rows = (c, list) => c.html`<ul class="graph-explorer-rows">${list}</ul>`;
  const badge = (c, text, variant = 'secondary') =>
    c.html`<span class="badge" data-variant="${variant}">${text}</span>`;
  const stateBadge = (c, state) =>
    c.html`<span class="badge graph-explorer-state" data-variant="${state === 'closed' ? 'secondary' : 'outline'}" data-state="${state}">${state}</span>`;
  const loading = (c) => c.html`<p class="kg-note">Loading...</p>`;
  // a Chart: the data-chart JSON is the ECharts option; in an island its canvas survives the details' re-renders
  const chart = (c, key, label, option, height = '8.5rem') =>
    c.island(
      key,
      c.html`<div class="chart" role="img" aria-label="${label}" style="height:${height}" data-chart="${JSON.stringify({ grid: { left: 40, right: 12, top: 28, bottom: 22 }, tooltip: { trigger: 'axis' }, ...option })}"></div>`,
    );
  const lines = (labels, list, extra = {}) => ({
    legend: { top: 0, right: 0, itemWidth: 10, itemHeight: 6, textStyle: { fontSize: 10 } },
    xAxis: { type: 'category', data: labels, boundaryGap: false, axisLabel: { fontSize: 10 } },
    yAxis: { type: 'value', splitNumber: 3, axisLabel: { fontSize: 10 }, ...extra },
    series: list.map(([name, data, area]) => ({
      name,
      type: 'line',
      smooth: true,
      showSymbol: false,
      data,
      ...(area ? { areaStyle: { opacity: 0.14 } } : {}),
    })),
  });
  const donut = (data) => ({
    tooltip: { trigger: 'item' },
    grid: undefined,
    legend: { orient: 'vertical', right: 0, top: 'middle', itemWidth: 8, itemHeight: 8, textStyle: { fontSize: 11 } },
    series: [{ type: 'pie', radius: ['52%', '78%'], center: ['32%', '50%'], label: { show: false }, data }],
  });
  // a Geo Map of the countries a node runs in (the data loads with the first map)
  const map = (c, key, countries, label) =>
    c.island(
      key,
      c.html`<div class="geo-map" data-select="none" data-palette="mono" data-highlight="fill" data-selected="${countries.map((k) => 'country:' + k).join(' ')}" aria-label="${label}"></div>`,
    );
  // an Avatar group of the people behind a node
  const team = (c, key, people) =>
    c.island(
      key,
      c.html`<div class="kg-team"><div class="avatar-group">${people.map((p) => c.html`<span class="avatar" data-size="sm" title="${p}"><span class="avatar-fallback">${p.slice(0, 2).toUpperCase()}</span></span>`)}</div><p class="kg-note">${people.join(', ')} · on call: ${people[0]}</p></div>`,
    );
  // a Timeline of what happened to it
  const timeline = (c, events) =>
    c.html`<ol class="timeline">${events.map((e) => c.html`<li class="timeline-item"><div class="timeline-dot"${e.active ? c.html` data-variant="active"` : ''}></div><div class="timeline-content"><p class="timeline-title">${e.title}</p><p class="timeline-description">${e.text}</p><time class="timeline-time">${e.when}</time></div></li>`)}</ol>`;
  const table = (c, heads, body) =>
    c.html`<div class="table-container"><table class="table graph-explorer-rel-table"><thead><tr class="table-row">${heads.map((h) => c.html`<th class="table-head" scope="col"${/^(p95|Links|Rows|Requests|Errors|Trips)/.test(h) ? c.html` style="text-align:right"` : ''}>${h}</th>`)}</tr></thead><tbody>${body}</tbody></table></div>`;
  const num = (c, v) => c.html`<td class="table-cell" style="text-align:right">${v}</td>`;
  const relationRows = (c, n, d, limit = 10) =>
    rows(
      c,
      (d.relations ?? []).slice(0, limit).map((r) =>
        row(c, {
          id: r.id,
          label: r.label,
          meta: c.html`${r.out ? c.html`<span>→ ${fmt(r.out)}</span>` : ''}${r.in ? c.html`<span>← ${fmt(r.in)}</span>` : ''}`,
          badge: r.breaker && r.breaker.state !== 'closed' ? stateBadge(c, r.breaker.state) : '',
          edge: n.id + '>' + r.id,
        }),
      ),
    );

  // -- an API system: metrics, latency, endpoints, regions, team, deploys
  const apiSystem = {
    kind: 'detail',
    name: 'atlas-api-system',
    match: (n) => (n.kind === 'cluster' && n.typeName === 'API' ? 20 : false),
    title: (n) => `${n.label} (API)`,
    render: (n, c) => {
      const m = c.request('metrics:' + n.id, () => later(apiMetrics(n.id), n.id));
      const d = c.request('details:' + n.id, () => c.fetchDetails(n.id));
      const kicker = c.html`API system · ${fmt(n.members)} nodes`;
      if (!m || !d) return c.html`${head(c, 'plug-zap', kicker, d?.path)}${loading(c)}`;
      const tone = m.now.errors > 1.5 ? 'danger' : m.now.errors > 0.8 ? 'warn' : 'ok';
      const latency = (h) =>
        chart(
          c,
          `latency:${n.id}:${h}`,
          `${n.label} latency, the last 24 hours`,
          lines(HOURS, [['p50', m.p50], ['p95', m.p95, true], ...(c.expanded ? [['p99', m.p99]] : [])], { name: 'ms' }),
          h,
        );
      const open = (d.relations ?? []).filter((r) => r.breaker && r.breaker.state !== 'closed');
      const endpointRows = m.endpoints.map(
        (e) =>
          c.html`<tr class="table-row"><td class="table-cell"><span class="kg-endpoint">${badge(c, e.method, e.method === 'GET' ? 'secondary' : 'outline')}${e.path}</span></td>${num(c, e.p95 + ' ms')}${c.expanded ? c.html`${num(c, fmt(e.rps) + ' /s')}${num(c, e.errors.toFixed(2) + ' %')}<td class="table-cell">${e.errors > 1.5 ? badge(c, 'degraded', 'destructive') : badge(c, 'healthy', 'outline')}</td>` : ''}</tr>`,
      );
      if (!c.expanded)
        return c.html`${head(c, 'plug-zap', kicker, d.path)}${actions(c, n)}
          ${stats(c, [
            ['p95 latency', m.now.p95 + ' ms'],
            ['Error rate', m.now.errors.toFixed(2) + ' %', tone],
            ['Requests', fmt(m.now.rps) + ' /s'],
            ['SLO', m.slo.toFixed(2) + ' %', m.slo >= 99.5 ? 'ok' : 'warn'],
          ])}
          ${section(c, 'Latency, 24 h', latency('8.5rem'))}
          ${section(c, 'Endpoints', table(c, ['Endpoint', 'p95'], endpointRows), m.endpoints.length)}
          ${section(c, 'Team', team(c, 'team:' + n.id, m.team))}
          ${open.length ? section(c, 'Breakers not closed', relationRows(c, n, { relations: open }), open.length) : ''}`;
      return c.html`<div class="graph-explorer-page">${pageHead(c, 'plug-zap', n.label, kicker, d.path, actions(c, n))}
        <section class="graph-explorer-kpis">
          ${kpi(c, 'p95 latency', m.now.p95 + ' ms', `p99 ${m.now.p99} ms`)}
          ${kpi(c, 'Error rate', m.now.errors.toFixed(2) + ' %', 'the last hour', tone)}
          ${kpi(c, 'Requests', fmt(m.now.rps) + ' /s', `${fmt(m.rps.reduce((a, b) => a + b, 0) * 3600)} a day`)}
          ${kpi(c, 'SLO', m.slo.toFixed(2) + ' %', 'target 99.5 %', m.slo >= 99.5 ? 'ok' : 'warn')}
          ${kpi(c, 'Regions', m.regions.length, m.regions.join(', '))}
        </section>
        <div class="graph-explorer-page-grid">
          ${card(c, 'Latency, the last 24 hours', latency('15rem'), { icon: 'timer', note: 'p50, p95 and p99 per hour', wide: true })}
          ${card(
            c,
            'Throughput and errors',
            chart(
              c,
              'rps:' + n.id,
              `${n.label} requests and errors`,
              {
                legend: { top: 0, right: 0, itemWidth: 10, itemHeight: 6, textStyle: { fontSize: 10 } },
                xAxis: { type: 'category', data: HOURS, axisLabel: { fontSize: 10 } },
                yAxis: [
                  { type: 'value', splitNumber: 3, axisLabel: { fontSize: 10 } },
                  { type: 'value', splitNumber: 3, axisLabel: { fontSize: 10 } },
                ],
                series: [
                  { name: 'requests /s', type: 'bar', data: m.rps },
                  { name: 'errors %', type: 'line', yAxisIndex: 1, smooth: true, showSymbol: false, data: m.errors },
                ],
              },
              '13rem',
            ),
            { icon: 'activity' },
          )}
          ${card(c, 'Deployment regions', map(c, 'regions:' + n.id, m.regions, `${n.label} runs in ${m.regions.join(', ')}`), { icon: 'globe', note: m.regions.join(' · ') })}
          ${card(c, 'Deploys and incidents', timeline(c, m.events), { icon: 'history' })}
          ${card(c, 'Endpoints', table(c, ['Endpoint', 'p95', 'Requests', 'Errors', 'Status'], endpointRows), { icon: 'plug', wide: true })}
          ${card(c, 'Team', team(c, 'team:' + n.id, m.team), { icon: 'users' })}
          ${card(c, 'Relations', d.relations?.length ? relationRows(c, n, d, 20) : c.html`<p class="kg-note">No relations at this level.</p>`, { icon: 'link-2', note: 'a name opens its page, the link button its traffic' })}
        </div></div>`;
    },
  };

  // -- a domain: its systems by kind, its regions, its cost, its teams
  const domain = {
    kind: 'detail',
    name: 'atlas-domain',
    match: (n) => (n.kind === 'cluster' && n.typeName === 'Domain' ? 20 : false),
    render: (n, c) => {
      const d = c.request('details:' + n.id, () => c.fetchDetails(n.id));
      const v = c.request('view:' + n.id, () => c.fetchView(n.id));
      const kicker = c.html`Domain · ${fmt(n.members)} nodes`;
      if (!d || !v) return c.html`${head(c, 'boxes', kicker, d?.path)}${loading(c)}`;
      const kinds = new Map();
      for (const s of v.children) kinds.set(s.typeName, (kinds.get(s.typeName) || 0) + 1);
      const mix = chart(
        c,
        'kinds:' + n.id,
        `${n.label} systems by kind`,
        donut([...kinds].map(([name, value]) => ({ name, value }))),
        c.expanded ? '13rem' : '8.5rem',
      );
      const people = pick(n.id, OWNERS, 4 + (hash(n.id) % 3), 6);
      const b = n.breakers || { open: 0, half: 0, cut: 0, total: 0 };
      const bad = b.open + b.half + b.cut;
      if (!c.expanded)
        return c.html`${head(c, 'boxes', kicker, d.path)}${actions(c, n)}
          ${stats(c, [
            ['Systems', fmt(d.children)],
            ['Nodes', fmt(d.members)],
            ['Relations', fmt(d.relations?.length ?? 0)],
            ['Not closed', bad ? `${bad} of ${b.total}` : 'none', bad ? 'warn' : 'ok'],
          ])}
          ${section(c, 'Systems by kind', mix)}
          ${section(c, 'Teams', team(c, 'teams:' + n.id, people))}
          ${section(c, 'Relations', relationRows(c, n, d), d.relations?.length)}`;
      const cost = series(n.id, 12, 40 + (hash(n.id) % 60), 25, 7).map((x) => Math.round(x));
      const systems = [...v.children].sort((a, b) => b.members - a.members).slice(0, 30);
      return c.html`<div class="graph-explorer-page">${pageHead(c, 'boxes', n.label, kicker, d.path, actions(c, n))}
        <section class="graph-explorer-kpis">
          ${kpi(c, 'Systems', fmt(d.children), [...kinds].map(([k, x]) => `${x} ${k}`).join(' · '))}
          ${kpi(c, 'Nodes', fmt(d.members), 'entities below')}
          ${kpi(c, 'Links not closed', fmt(bad), `of ${fmt(b.total)} bundled`, bad ? 'warn' : 'ok')}
          ${kpi(c, 'Cost', '$' + cost[11] + 'k', 'this month')}
        </section>
        <div class="graph-explorer-page-grid">
          ${card(c, 'Systems by kind', mix, { icon: 'layers' })}
          ${card(c, 'Regions', map(c, 'regions:' + n.id, pick(n.id, COUNTRIES, 5, 8), `${n.label} runs in these countries`), { icon: 'globe' })}
          ${card(c, 'Cost per month', chart(c, 'cost:' + n.id, `${n.label} cost per month`, { xAxis: { type: 'category', data: MONTHS, axisLabel: { fontSize: 10 } }, yAxis: { type: 'value', splitNumber: 3, name: '$k', axisLabel: { fontSize: 10 } }, series: [{ type: 'bar', data: cost }] }, '13rem'), { icon: 'activity' })}
          ${card(
            c,
            'Systems',
            table(
              c,
              ['System', 'Kind', 'Links'],
              systems.map(
                (s) =>
                  c.html`<tr class="table-row"><td class="table-cell"><button type="button" class="graph-explorer-link" data-graph-explorer-goto="${s.id}">${s.label}</button></td><td class="table-cell">${badge(c, s.typeName, s.typeName === 'API' ? 'default' : 'secondary')}</td>${num(c, fmt(s.members))}</tr>`,
              ),
            ),
            { icon: 'boxes', note: 'pick one for its page', wide: true },
          )}
          ${card(c, 'Teams', team(c, 'teams:' + n.id, people), { icon: 'users' })}
          ${card(c, 'Relations', relationRows(c, n, d, 20), { icon: 'link-2', note: 'the link button shows the traffic between the domains' })}
        </div></div>`;
    },
  };

  // -- a dataset: freshness, quality, schema, lineage, pipeline runs
  // -- a dataset's records: synthetic and stable per dataset, up to a million rows. The Data Grid holds them, the
  //    charts draw their aggregation (df$.shadcn.chart.bind over the grid's own dataview source) and follow its
  //    filters; a click on a country or a status filters the grid in turn
  const REGIONS = ['DEU', 'USA', 'IRL', 'JPN', 'BRA', 'IND', 'SGP', 'FRA', 'GBR', 'CAN'];
  const CHANNELS = ['web', 'app', 'api', 'partner'];
  const STATUSES = ['ok', 'ok', 'ok', 'ok', 'ok', 'ok', 'late', 'failed'];
  const USER_IDS = Array.from({ length: 60000 }, (_, k) => 'u-' + String(k).padStart(5, '0'));
  const DAY = 864e5;
  const NOW = Date.UTC(2026, 10, 1);
  const RECORD_FIELDS = [
    ['id', 'bigint'],
    ['created_at', 'timestamp'],
    ['country', 'char(3)'],
    ['channel', 'enum'],
    ['status', 'enum'],
    ['amount', 'decimal'],
    ['user_id', 'text'],
  ];
  const recordCount = (n) => Math.min(1_000_000, n.attrs.rows * 1000);
  // one dataset's records at a time - a million rows take about 100 MB
  let kept = null;
  const records = (n) => {
    if (kept?.id === n.id) return kept.rows;
    const count = recordCount(n),
      seed = hash(n.id),
      rows = new Array(count);
    for (let i = 0; i < count; i++) {
      let h = Math.imul(seed ^ (i + 1), 0x9e3779b1);
      h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
      h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
      h = (h ^ (h >>> 16)) >>> 0;
      const g = Math.imul(h ^ 0x5bd1e995, 0x27d4eb2d) >>> 0;
      rows[i] = {
        id: i + 1,
        // more rows lately: the dataset grows - an age density falling linearly to 40 % over the month
        created_at: NOW - Math.floor(((1 - Math.sqrt(1 - (0.84 * h) / 4294967296)) / 0.6) * 30 * DAY),
        country: REGIONS[g % REGIONS.length],
        channel: CHANNELS[(g >>> 4) & 3],
        status: STATUSES[(g >>> 6) & 7],
        amount: (((g >>> 9) % 40000) + 100) / 100,
        user_id: USER_IDS[(g >>> 3) % USER_IDS.length],
      };
    }
    kept = { id: n.id, rows };
    return rows;
  };
  // the aggregations: plain JSON (df$.dataview's aggregate spec)
  const PER_DAY = { groupBy: { field: 'created_at', bucket: 'day', as: 'day' }, fill: true };
  const BY_COUNTRY = {
    groupBy: 'country',
    measures: [{ op: 'sum', field: 'amount', as: 'amount' }],
    sort: { by: 'amount', direction: 'desc' },
  };
  const BY_STATUS = { groupBy: 'status', sort: { by: 'count', direction: 'desc' } };
  // a static option: the groups join it as dataset.source, the series encode the keys
  const dayOption = {
    grid: { left: 44, right: 12, top: 12, bottom: 22 },
    tooltip: { trigger: 'axis' },
    dataset: { dimensions: ['day', 'count'] },
    xAxis: { type: 'time', axisLabel: { fontSize: 10 } },
    yAxis: { type: 'value', splitNumber: 3, axisLabel: { fontSize: 10 } },
    series: [{ type: 'bar', name: 'records', encode: { x: 'day', y: 'count' }, barMaxWidth: 10 }],
  };
  // an option of the groups
  const countryOption = (rows) => ({
    grid: { left: 48, right: 16, top: 8, bottom: 20 },
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'value', splitNumber: 3, axisLabel: { fontSize: 10 } },
    yAxis: { type: 'category', inverse: true, data: rows.map((r) => r.country), axisLabel: { fontSize: 10 } },
    series: [{ type: 'bar', name: 'amount (EUR)', data: rows.map((r) => Math.round(r.amount)), barMaxWidth: 14 }],
  });
  const statusOption = (rows) => donut(rows.map((r) => ({ name: r.status, value: r.count })));
  // a chart bound to a source (an island: bound once, released when the island goes)
  const boundChart = (c, key, label, height, bind) =>
    c.island(key, c.html`<div class="chart" role="img" aria-label="${label}" style="height:${height}"></div>`, (el) => {
      const binding = df$.shadcn.chart.bind(df$(el).find('.chart').get(0), bind());
      return () => binding.dispose();
    });
  // every record in a Data Grid, three charts of what its filters match - the grid's filter scan is theirs too
  const recordsView = (c, n) =>
    c.island(
      'records:' + n.id,
      c.html`<div class="kg-records">
        <p class="kg-records-count" aria-live="polite">${fmt(recordCount(n))} records</p>
        <div class="kg-records-charts">
          <figure class="kg-records-chart"><figcaption>Records per day</figcaption><div class="chart" data-kg-chart="day" role="img" aria-label="${n.label}: records per day" style="height: 10rem"></div></figure>
          <figure class="kg-records-chart"><figcaption>Amount by country - click to filter</figcaption><div class="chart" data-kg-chart="country" role="img" aria-label="${n.label}: amount by country" style="height: 10rem"></div></figure>
          <figure class="kg-records-chart"><figcaption>Status - click to filter</figcaption><div class="chart" data-kg-chart="status" role="img" aria-label="${n.label}: records by status" style="height: 10rem"></div></figure>
        </div>
        <div class="data-grid" aria-label="${n.label}: records" data-persist="none" data-empty-text="No record matches the filters." style="height: 22rem">
          <div class="data-grid-viewport"><div class="data-grid-head"><div class="data-grid-row">
            <div class="data-grid-header" data-field="id" data-type="number" data-format="" data-width="7rem">Id</div>
            <div class="data-grid-header" data-field="created_at" data-type="number" data-format="date" data-width="8rem">Created</div>
            <div class="data-grid-header" data-field="country" data-width="7rem" data-filter="select">Country</div>
            <div class="data-grid-header" data-field="channel" data-width="7rem" data-filter="select">Channel</div>
            <div class="data-grid-header" data-field="status" data-width="7rem" data-filter="select">Status</div>
            <div class="data-grid-header" data-field="amount" data-type="number" data-format="currency:EUR" data-width="8rem" data-filter="number">Amount</div>
            <div class="data-grid-header" data-field="user_id" data-width="8rem" data-filter="text">User</div>
          </div></div><div class="data-grid-body"></div></div>
        </div>
      </div>`,
      (el) => {
        const grid = df$(el).find('.data-grid').get(0);
        const count = df$(el).find('.kg-records-count').get(0);
        df$.shadcn.dataGrid.setSource(grid, records(n));
        const source = df$.shadcn.dataGrid.source(grid);
        const charts = {
          day: [PER_DAY, dayOption],
          country: [BY_COUNTRY, countryOption],
          status: [BY_STATUS, statusOption],
        };
        const bound = Object.entries(charts).map(([name, [aggregate, option]]) =>
          df$.shadcn.chart.bind(df$(el).find(`[data-kg-chart="${name}"]`).get(0), {
            source,
            aggregate,
            option,
            follow: grid,
          }),
        );
        // chart-data: how many records the groups were made of
        df$(el)
          .find('[data-kg-chart="day"]')
          .on('chart-data', (e) => {
            const { matched, total, ms } = e.detail;
            df$(count).text(
              `${fmt(matched)} of ${fmt(total)} records${matched < total ? ' match the filters' : ''} · grouped in ${ms} ms`,
            );
          });
        // a click on a bar or a slice filters the grid by it (again: lets it go) - the charts follow the grid
        const toggle = (field, value) => {
          const now = grid.store.value.config.filters ?? [];
          const had = now.some((f) => f.field === field && f.value === value);
          const rest = now.filter((f) => f.field !== field);
          df$.shadcn.dataGrid.query(grid, { filters: had ? rest : [...rest, { field, op: 'eq', value }] });
        };
        bound[1].mounted.then((chart) => chart.on('click', (p) => toggle('country', p.name)));
        bound[2].mounted.then((chart) => chart.on('click', (p) => toggle('status', p.name)));
        return () => bound.forEach((b) => b.dispose());
      },
    );

  const dataset = {
    kind: 'detail',
    name: 'atlas-dataset',
    match: (n) => (n.kind === 'entity' && n.typeName === 'Dataset' ? 20 : false),
    render: (n, c) => {
      const d = c.request('details:' + n.id, () => c.fetchDetails(n.id));
      const a = n.attrs;
      const stale = a.freshness > 24;
      const quality = 70 + (hash(n.id) % 30);
      const kicker = c.html`Dataset · owned by ${a.owner}`;
      if (!d) return c.html`${head(c, 'database', kicker, null)}${loading(c)}`;
      const checks = [
        ['not null', true],
        ['unique id', true],
        ['fresh < 24 h', !stale],
        ['schema stable', hash(n.id) % 4 !== 0],
      ];
      const quality$ = c.island(
        'quality:' + n.id,
        c.html`<progress class="progress" value="${quality}" max="100" aria-label="Quality score">${quality} %</progress>`,
      );
      const lineage = (list, incoming) =>
        list.length
          ? rows(
              c,
              list.slice(0, 8).map((r) =>
                row(c, {
                  id: r.id,
                  label: r.label,
                  icon: c.icon(r.edge === 'reads' ? 'eye' : r.edge === 'owns' ? 'key-round' : 'zap', { size: 'xs' }),
                  meta: `${r.type} · ${r.same ? 'here' : r.system}`,
                  edge: r.same ? (incoming ? r.id + '>' + n.id : n.id + '>' + r.id) : null,
                }),
              ),
            )
          : c.html`<p class="kg-note">None.</p>`;
      const schema = table(
        c,
        ['Column', 'Type'],
        RECORD_FIELDS.map(
          ([col, type]) =>
            c.html`<tr class="table-row"><td class="table-cell"><code>${col}</code></td><td class="table-cell">${badge(c, type, 'outline')}</td></tr>`,
        ),
      );
      const checkBadges = c.html`<div class="kg-checks">${checks.map(([k, ok]) => badge(c, (ok ? '✓ ' : '✗ ') + k, ok ? 'secondary' : 'destructive'))}</div>`;
      // the side: a chart of every record - a million rows aggregated by day, in the sidebar
      if (!c.expanded)
        return c.html`${head(c, 'database', kicker, d.path)}${actions(c, n)}
          ${stats(c, [
            ['Rows', fmt(a.rows) + 'k'],
            ['Freshness', a.freshness + ' h', stale ? 'warn' : 'ok'],
            ['Quality', quality + ' %', quality >= 85 ? 'ok' : 'warn'],
            ['Links', `${d.outDeg} out · ${d.inDeg} in`],
          ])}
          ${section(
            c,
            'Records per day',
            boundChart(c, 'side-day:' + n.id, `${n.label}: records per day`, '7.5rem', () => ({
              source: df$.dataview.source(records(n)),
              aggregate: PER_DAY,
              option: dayOption,
            })),
            fmt(recordCount(n)),
          )}
          ${section(c, 'Quality', c.html`${quality$}${checkBadges}`)}
          ${section(c, 'Schema', schema, RECORD_FIELDS.length)}
          ${section(c, 'Upstream', lineage(d.in ?? [], true), d.inDeg)}
          ${section(c, 'Downstream', lineage(d.out ?? [], false), d.outDeg)}`;
      const runs = [
        {
          title: 'Pipeline run succeeded',
          text: `${fmt(Math.round(a.rows * 12))} rows written`,
          when: `${a.freshness} h ago`,
          active: true,
        },
        { title: 'Schema change', text: `added ${RECORD_FIELDS[RECORD_FIELDS.length - 1][0]}`, when: 'last week' },
        { title: 'Backfill', text: 'the last 90 days', when: 'last month' },
      ];
      return c.html`<div class="graph-explorer-page">${pageHead(c, 'database', n.label, kicker, d.path, actions(c, n))}
        <section class="graph-explorer-kpis">
          ${kpi(c, 'Rows', fmt(a.rows) + 'k', `the latest ${fmt(recordCount(n))} below`)}
          ${kpi(c, 'Freshness', a.freshness + ' h', stale ? 'stale' : 'fresh', stale ? 'warn' : 'ok')}
          ${kpi(c, 'Quality', quality + ' %', `${checks.filter(([, ok]) => ok).length} of ${checks.length} checks pass`, quality >= 85 ? 'ok' : 'warn')}
          ${kpi(c, 'Lineage', `${d.inDeg} → · → ${d.outDeg}`, 'upstream · downstream')}
        </section>
        <div class="graph-explorer-page-grid">
          ${card(c, 'Records', recordsView(c, n), { icon: 'database', wide: true, note: 'every record in a Data Grid; the charts group what its filters match' })}
          ${card(c, 'Quality', c.html`${quality$}${checkBadges}`, { icon: 'shield-check', note: 'checks of the last run' })}
          ${card(c, 'Pipeline runs', timeline(c, runs), { icon: 'history' })}
          ${card(c, 'Schema', schema, { icon: 'table' })}
          ${card(c, 'Upstream', lineage(d.in ?? [], true), { icon: 'arrow-left', note: 'what it is built from' })}
          ${card(c, 'Downstream', lineage(d.out ?? [], false), { icon: 'arrow-right', note: 'what reads or owns it' })}
        </div></div>`;
    },
  };

  // -- a link between two clusters: its traffic both ways, by relation, its breakers, who sends and who receives
  const traffic = {
    kind: 'edge',
    name: 'atlas-traffic',
    detail: {
      match: (item) => (item.edge.kind === 'agg' ? 20 : false),
      title: (item) => `${item.source.label} → ${item.target.label}`,
      render: (item, c) => {
        const d = c.request('edge:' + item.id, () => c.fetchEdge(item.id));
        const e = item.edge;
        const kicker = c.html`Links between ${item.source.typeName === 'Domain' ? 'domains' : 'systems'} · ${fmt(e.count + e.count2)}`;
        const ends = c.html`<div class="graph-explorer-ends">${[item.source, item.target].map((x, k) => c.html`${k ? c.html`<span class="graph-explorer-ends-arrow">${c.icon(e.bidir ? 'arrow-left-right' : 'arrow-right', { size: 'sm' })}</span>` : ''}<button type="button" class="graph-explorer-end" data-graph-explorer-goto="${x.id}">${c.icon(x.typeName === 'Domain' ? 'boxes' : 'plug-zap', { size: 'sm' })}<span class="graph-explorer-end-name">${x.label}</span><span class="graph-explorer-end-type">${x.typeName}</span></button>`)}</div>`;
        if (!d) return c.html`${head(c, 'link-2', kicker, null)}${ends}${loading(c)}`;
        const fwd = series(item.id, 24, d.forward * 2.4, d.forward, 13).map(Math.round),
          back = series(item.id, 24, d.backward * 2.4, d.backward + 1, 14).map(Math.round),
          errs = series(item.id, 24, 0.3 + (hash(item.id) % 20) / 10, 0.8, 15);
        const bad = d.pairs.filter((p) => p.state !== 'closed');
        const callsChart = (h) =>
          chart(
            c,
            `calls:${item.id}:${h}`,
            `calls per minute between ${item.source.label} and ${item.target.label}`,
            lines(HOURS, [
              [`→ ${item.target.label}`, fwd, true],
              [`← ${item.source.label}`, back],
            ]),
            h,
          );
        const share = (list) =>
          rows(
            c,
            list.slice(0, 6).map((x) => row(c, { id: x.id, label: x.label, meta: fmt(x.count) })),
          );
        const pairsTable = table(
          c,
          ['Caller', 'Callee', 'Links', 'State', 'Trips'],
          d.pairs
            .slice(0, c.expanded ? 40 : 6)
            .map(
              (p) =>
                c.html`<tr class="table-row"><td class="table-cell"><button type="button" class="graph-explorer-link" data-graph-explorer-goto="${p.from.id}">${p.from.label}</button></td><td class="table-cell"><button type="button" class="graph-explorer-link" data-graph-explorer-goto="${p.to.id}">${p.to.label}</button></td>${num(c, fmt(p.count))}<td class="table-cell">${stateBadge(c, p.state)}</td>${num(c, p.trips)}</tr>`,
            ),
        );
        const errNow = errs[23];
        if (!c.expanded)
          return c.html`${head(c, 'link-2', kicker, d.path)}${ends}${actions(c, null)}
            ${stats(c, [
              ['Forward', fmt(d.forward)],
              ['Back', fmt(d.backward)],
              ['Errors', errNow.toFixed(2) + ' %', errNow > 1.5 ? 'danger' : errNow > 0.8 ? 'warn' : 'ok'],
              ['Breakers', `${bad.length} of ${d.pairs.length} not closed`, bad.length ? 'warn' : 'ok'],
            ])}
            ${section(c, 'Calls per minute, 24 h', callsChart('8.5rem'))}
            ${bad.length ? section(c, 'Breakers not closed', pairsTable, bad.length) : ''}
            ${d.sources.length ? section(c, 'Top senders', share(d.sources)) : ''}`;
        return c.html`<div class="graph-explorer-page">${pageHead(c, 'link-2', `${item.source.label} → ${item.target.label}`, kicker, d.path, actions(c, null))}${ends}
          <section class="graph-explorer-kpis">
            ${kpi(c, 'Forward', fmt(d.forward), `${fmt(fwd[23])} calls / min now`)}
            ${kpi(c, 'Back', fmt(d.backward), `${fmt(back[23])} calls / min now`)}
            ${kpi(c, 'Errors', errNow.toFixed(2) + ' %', 'the last hour', errNow > 1.5 ? 'danger' : errNow > 0.8 ? 'warn' : 'ok')}
            ${kpi(c, 'Breakers', fmt(d.pairs.length), `${bad.length} not closed`, bad.length ? 'warn' : 'ok')}
          </section>
          <div class="graph-explorer-page-grid">
            ${card(c, 'Calls per minute, the last 24 hours', callsChart('15rem'), { icon: 'activity', wide: true })}
            ${card(
              c,
              'By relation',
              chart(
                c,
                'types:' + item.id,
                'links by relation',
                donut(
                  Object.entries(d.byType)
                    .filter(([, x]) => x > 0)
                    .map(([name, value]) => ({ name, value })),
                ),
                '12rem',
              ),
              { icon: 'workflow' },
            )}
            ${card(c, 'Error rate', chart(c, 'errors:' + item.id, 'error rate per hour', lines(HOURS, [['errors %', errs, true]]), '12rem'), { icon: 'triangle-alert' })}
            ${card(c, 'Top senders', share(d.sources), { icon: 'send', note: 'in ' + item.source.label })}
            ${card(c, 'Top receivers', share(d.targets), { icon: 'target', note: 'in ' + item.target.label })}
            ${card(c, 'Circuit breakers', pairsTable, { icon: 'shield-check', note: 'the system pairs this link bundles, the worst first', wide: true })}
          </div></div>`;
      },
    },
  };

  document.addEventListener('DOMContentLoaded', () => {
    const ge = df$.shadcn.graphExplorer;
    // Datasets as cards of their own, an Owners Node UI, the pages above
    ge.register('global', {
      kind: 'node',
      name: 'atlas-dataset-card',
      match: (n) => (n.kind === 'entity' && n.typeName === 'Dataset' ? 10 : false),
      sizes: { chip: [156, 26], card: [236, 100] },
      render: (n, c) => {
        const icon = c.icon('database', { cls: 'graph-explorer-type-icon', type: n.type });
        if (c.tier === 'chip')
          return c.html`<span class="graph-explorer-chip" data-kind="entity">${icon}<span class="graph-explorer-label">${n.label}</span><span class="graph-explorer-count">${n.attrs.rows}k</span></span>`;
        const stale = n.attrs.freshness > 24;
        return c.html`<article class="graph-explorer-card" data-kind="entity">
          <header class="graph-explorer-card-head">${icon}<strong class="graph-explorer-label">${n.label}</strong>
            <button type="button" class="btn graph-explorer-card-expand" data-variant="ghost" data-size="icon-sm" data-graph-explorer-action="expand" aria-label="Expand ${n.label}">${c.icon('expand')}</button></header>
          <p class="graph-explorer-card-meta">Dataset · ${n.attrs.rows.toLocaleString('en-US')}k rows</p>
          <p class="graph-explorer-card-flags"><span class="badge" data-variant="${stale ? 'destructive' : 'secondary'}">${stale ? 'stale' : 'fresh'} · ${n.attrs.freshness} h</span><span class="badge" data-variant="outline">owner ${n.attrs.owner}</span></p>
        </article>`;
      },
    });
    ge.register('global', {
      kind: 'node',
      name: 'atlas-owners',
      variant: 'owners',
      variantLabel: 'Owners',
      variantIcon: 'users',
      match: (n) => (n.kind === 'entity' ? 0 : false),
      sizes: { chip: [168, 30], card: [232, 72] },
      render: (n, c) => {
        const avatar = c.html`<span class="graph-explorer-avatar" data-type="${OWNERS.indexOf(n.attrs.owner)}">${n.attrs.owner.slice(0, 2).toUpperCase()}</span>`;
        if (c.tier === 'chip')
          return c.html`<span class="graph-explorer-chip" data-kind="entity">${avatar}<span class="graph-explorer-label">${n.label}</span></span>`;
        return c.html`<article class="graph-explorer-card" data-kind="entity"><header class="graph-explorer-card-head">${avatar}<strong class="graph-explorer-label">${n.label}</strong></header><p class="graph-explorer-card-meta">owned by ${n.attrs.owner} · ${n.typeName}</p></article>`;
      },
    });
    for (const plugin of [apiSystem, domain, dataset, traffic]) ge.register('global', plugin);
  });
</script>
<script type="module">
  // routing and translation: defuss-dom-router owns the address, defuss-i18n the language
  import { createRouter } from 'https://cdn.jsdelivr.net/npm/defuss-dom-router@0.1.1/dist/index.js';
  import { createDomI18n, createI18n } from 'https://cdn.jsdelivr.net/npm/defuss-i18n@0.2.0/dist/core.js';

  // df$ comes with the component bundle - a full-screen page loads it after this module
  addEventListener('DOMContentLoaded', async () => {
    const app = df$('[data-kg]').get(0);
    const kg = df$('#kg').get(0);

    // -- translation: the markup is the catalog (the templates at the end of the app)
    const locale = createI18n({
      locale: 'en', // the demos start in English; the language select offers German
    });
    createDomI18n(df$).bind(app, locale);
    const language = df$('[data-app-locale]');
    language.val(locale.locale).on('change', () => locale.setLocale(language.val()));

    // -- light / dark: the button writes the class every token reads; the explorer, its charts and the map follow it
    const theme = df$('[data-kg-theme]');
    const showTheme = () => theme.attr('aria-pressed', String(document.documentElement.classList.contains('dark')));
    showTheme();
    theme.on('click', () => {
      document.documentElement.classList.toggle('dark');
      showTheme();
      document.dispatchEvent(new CustomEvent('defuss-theme-change'));
    });

    // -- routing: an expanded page is a route - a node's (#/node/c26) or a link's (#/link/c1/c5), so Back walks a
    //    drill-down back up and a page can be linked
    const routes = [
      { id: 'graph', path: '/' },
      { id: 'node', path: '/node/:id' },
      { id: 'link', path: '/link/:from/:to' },
      { id: 'missing', path: '*' },
    ];
    await kg.api.settled();
    const show = (to) => {
      const now = kg.api.getState().config;
      if (to.routeId === 'node') {
        if (!now.expanded || now.selected[0] !== to.params.id || now.selected.length !== 1)
          void kg.api.setState('selected', { selected: [to.params.id], edge: null, expanded: true });
      } else if (to.routeId === 'link') {
        const edge = to.params.from + '>' + to.params.to;
        if (!now.expanded || now.edge !== edge)
          void kg.api.setState('selected', { selected: [], edge, expanded: true });
      } else if (now.expanded) void kg.api.setState(kg.api.getState().name, { expanded: false });
    };
    // the explorer moves the address: an expanded page names its route, the graph is #/
    const routeOf = ({ config }) =>
      config.expanded && config.selected.length === 1
        ? '#/node/' + config.selected[0]
        : config.expanded && config.edge
          ? '#/link/' + config.edge.replace('>', '/')
          : '#/';
    kg.store.subscribe((state) => {
      const want = routeOf(state);
      if ((location.hash || '#/') !== want) location.hash = want.slice(1);
    });
    const router = createRouter({ mode: 'hash', routes, prepare: ({ to }) => ({ commit: () => show(to) }) });
    if ((await router.start()).status === 'rejected') {
      // no address the router may own - a docs preview is an about:srcdoc frame: the same routes match its hash
      const preview = createRouter({ mode: 'hash', routes, baseUrl: 'https://preview.invalid/' });
      const follow = () => show(preview.resolve(location.hash.startsWith('#/') ? location.hash : '#/'));
      addEventListener('hashchange', follow);
      follow();
    }
  });
</script>
<script type="module" src="https://cdn.jsdelivr.net/gh/kyr0/defuss-shadcn@v0.9.13/dist/apps/knowledge-graph/knowledge-graph.min.js"></script>
