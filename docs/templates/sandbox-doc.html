<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--CE_STYLES-->
    <style data-ce-chrome>
      /* sandbox chrome: the body IS the demo stage — it mirrors the host's
         .preview card (layout.css: flex, centered, wrapped, 0.875rem gap,
         2.5rem/1.5rem padding) so an example renders identically to the old
         in-page .preview. Flex matters beyond looks: demos that need a flex
         parent (vertical separators via align-self:stretch, shrink-wrapped
         switch rows) only render correctly in flow like this. A flex container
         never margin-collapses through its body either, so the bridge's
         content-height measurement stays exact and stable. */
      body {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.875rem;
        margin: 2.5rem 1.5rem;
        background: var(--background);
        color: var(--foreground);
        /*CE_BODY_STYLE*/
      }
    </style>
  </head>
  <body>
    <!--CE_SOURCE-->
    <script id="ce-bootstrap" data-ce-chrome>
      globalThis.__CE_CH = <!--CE_CH-->;
      globalThis.__CE_SCHEMA = <!--CE_SCHEMA-->;
    </script>
    <!--CE_BRIDGE-->
  </body>
</html>
