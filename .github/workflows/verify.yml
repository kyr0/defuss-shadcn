# CI is DISABLED by design (maintainer decision, 2026-10-09).
# Why: the verifier, the unit suite and the e2e pipeline are LOCAL gates
# (AGENTS.md "The verifier is authoritative"; deploy.sh runs e2e in full
# before a release) - a push is proven by the last green local run, not by a
# runner. GitHub's only job in this repository is publishing ./docs via
# GitHub Pages. This file remains as the documented tombstone: it has no
# push/PR trigger, and a manual dispatch prints the note and skips.
# Delete it wholesale (or replace its steps) to ever re-enable CI.
name: verify (disabled)
on:
  workflow_dispatch: {}
jobs:
  noop:
    if: false # never runs - CI stays off; the gates run locally
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI disabled - gates run locally; GitHub only publishes ./docs (Pages)"
